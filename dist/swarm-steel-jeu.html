<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm &amp; Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>/* Table de jeu : plateau central entre le camp de la colonie (gauche) et celui de l'essaim (droite) */
:root {
  --bg: #e9ecea; --panel: #ffffff; --panel-2: #f4f6f5; --ink: #1b1f1d; --ink-soft: #5b6560; --rule: #d3d9d6;
  --aggro: #b0372b; --tank: #2c5b8a; --soutien: #6b4c97;
  --wall: #9c6a32; --wall-bg: #f3e7d6; --support: #1e7469; --support-bg: #d8ece8;
  --off: #c4611d; --sup: #3a7a4a;
  --north: #2563a8; --east: #2f8a55; --south: #c98a12; --west: #a03d8a;
  --colonie: #1e7469; --essaim: #6b4c97; --hot: #e2a400; --danger: #b0372b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cell: min(96px, calc((100vw - 52px) / 9)); /* plateau agrandi pour les illustrations (Oni, 04/11/2026 ; avant 64 px) */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131716; --panel: #1c2120; --panel-2: #232927; --ink: #e5eae7; --ink-soft: #9ba7a1; --rule: #33403b;
  --wall-bg: #3a2e20; --support-bg: #18332f; --colonie: #3fb3a3; --essaim: #a68bd6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131716; --panel: #1c2120; --panel-2: #232927; --ink: #e5eae7; --ink-soft: #9ba7a1; --rule: #33403b;
  --wall-bg: #3a2e20; --support-bg: #18332f; --colonie: #3fb3a3; --essaim: #a68bd6; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-block: 0 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.i { width: 1.05em; height: 1.05em; vertical-align: -.16em; flex: none; }
.i.big { width: 44px; height: 44px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand b { font: 700 1.5rem/1 var(--display); letter-spacing: .01em; }
.brand span { color: var(--ink-soft); font-size: .8rem; }
.round { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.1rem; }
.round b { font-size: 1.3rem; }
.menu { margin-left: auto; display: flex; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--ink-soft); }
.dot.colonie { background: var(--colonie); } .dot.essaim { background: var(--essaim); }

button.primary, button.ghost, .acts button, .choices button, .step button { border: 1px solid var(--rule); background: var(--panel); padding: 7px 12px; border-radius: 6px; }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
.choices button.on { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }

.layout { display: grid; grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; min-width: 0; }
.panel.colonie { border-top: 4px solid var(--colonie); } .panel.essaim { border-top: 4px solid var(--essaim); }
.panel h3 { margin: 0 0 10px; font: 700 1.25rem/1 var(--display); display: flex; align-items: center; gap: 6px; }
.panel h4 { margin: 14px 0 6px; font: 600 .78rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--rule); font-variant-numeric: tabular-nums; }
.kv span { color: var(--ink-soft); } .kv b { text-align: right; }
.small { font-size: .8rem; color: var(--ink-soft); margin: 4px 0 0; }
.muted { color: var(--ink-soft); }
.floors { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 10px; }
.fl { font: 600 .72rem/1 var(--display); font-style: normal; text-align: center; padding: 5px 0; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-soft); }
.fl.ms { border-color: var(--colonie); }
.fl.on { background: var(--colonie); color: #fff; border-color: var(--colonie); }
.atelier { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px dotted var(--rule); }
.atelier .al { font: 700 1rem/1 var(--display); color: #fff; text-align: center; padding: 5px 0; border-radius: 4px; }
.atelier.lane-N .al { background: var(--north); } .atelier.lane-E .al { background: var(--east); } .atelier.lane-S .al { background: var(--south); } .atelier.lane-O .al { background: var(--west); }
.slots { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.slot { font-size: .82rem; padding: 2px 6px; border-radius: 4px; background: var(--wall-bg); }
.slot.empty { background: transparent; border: 1px dashed var(--rule); color: var(--ink-soft); }
.slot .x { border: 0; background: none; padding: 0 4px; font-weight: 700; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { padding: 2px 9px; }
.step b, .pts { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; }
.hand { display: flex; flex-direction: column; gap: 5px; }
.tcard, .ccard { text-align: left; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.tcard { border-left: 4px solid var(--wall); }
.tcard small, .ccard small { color: var(--ink-soft); font-size: .76rem; }
.tcard.sel, .ccard.sel { outline: 2px solid var(--hot); outline-offset: 1px; }
.ccard { position: relative; padding-left: 40px; border-left: 4px solid var(--c); }
.ccard.aggro { --c: var(--aggro); } .ccard.tank { --c: var(--tank); } .ccard.soutien { --c: var(--soutien); }
.ccard .cost { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 .95rem/1 var(--display); }
.hidden-hand { color: var(--ink-soft); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: .78rem; padding: 2px 8px; border-radius: 99px; color: #fff; }
.chip.off { background: var(--off); } .chip.sup { background: var(--sup); }
.tree { border: 1px solid var(--rule); border-radius: 6px; padding: 6px; margin-bottom: 6px; display: grid; gap: 4px; }
.tree .tt { font: 600 .8rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
.tree.aggro .tt { color: var(--aggro); } .tree.tank .tt { color: var(--tank); } .tree.soutien .tt { color: var(--soutien); }
.tree .r { display: flex; gap: 4px; }
.tree .node { flex: 1; min-width: 0; font-size: .74rem; padding: 4px 3px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel-2); }
.tree .node.taken { background: var(--essaim); color: #fff; border-color: var(--essaim); opacity: 1; }
.log { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; font-size: .8rem; }
.log li { padding: 3px 0; border-bottom: 1px dotted var(--rule); }
.log li span { font: 600 .7rem/1 var(--display); color: var(--ink-soft); margin-right: 6px; }
.log li.colonie { color: var(--colonie); } .log li.essaim { color: var(--essaim); }

.center { display: flex; flex-direction: column; gap: 12px; min-width: 0; align-items: center; }
.phase { width: 100%; max-width: calc(var(--cell) * 9 + 16px); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-left: 5px solid var(--ink-soft); border-radius: 10px; padding: 10px 14px; }
.phase.colonie { border-left-color: var(--colonie); } .phase.essaim { border-left-color: var(--essaim); }
.ph-head { display: flex; align-items: center; gap: 8px; } .ph-head b { font: 700 1.15rem/1 var(--display); }
.ph-head .side { margin-left: auto; color: var(--ink-soft); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.ph-txt { margin: 4px 0 6px; color: var(--ink-soft); font-size: .86rem; }
.hint { margin: 6px 0; font-size: .88rem; }
.acts, .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.choices .lab { font-size: .8rem; color: var(--ink-soft); }
.spells { display: flex; flex-direction: column; gap: 5px; }
.spell { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 6px; background: var(--panel-2); padding: 6px 8px; }
.spell.off { --c: var(--off); } .spell.sup { --c: var(--sup); }
.spell .i { width: 22px; height: 22px; color: var(--c); }
.spell span { display: flex; flex-direction: column; } .spell small { color: var(--ink-soft); }

.board-wrap { overflow-x: auto; max-width: 100%; }
.board { display: grid; grid-template-columns: repeat(9, var(--cell)); grid-auto-rows: var(--cell); gap: 2px; padding: 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.cell { position: relative; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 10px; }
.cell.void { background: transparent; }
.cell.entry { background: transparent; border: 1px dashed var(--rule); }
.cell.entry .col { position: absolute; top: 2px; left: 4px; font: 600 10px/1 var(--display); color: var(--ink-soft); }
.cell.lane { background: color-mix(in srgb, var(--lc) 13%, var(--panel)); }
.cell.lane.r1 { background: color-mix(in srgb, var(--lc) 22%, var(--panel)); }
.lane-N { --lc: var(--north); } .lane-E { --lc: var(--east); } .lane-S { --lc: var(--south); } .lane-O { --lc: var(--west); }
.cell.stase { box-shadow: inset 0 0 0 3px #7fb6d9; }
.cell.core { background: var(--ink); color: var(--panel); flex-direction: column; gap: 1px; }
.cell.core .i { width: 22px; height: 22px; } .cell.core b { font: 700 13px/1 var(--display); } .cell.core small { font-size: 9px; opacity: .8; }
.cell.corner { background: var(--panel-2); color: var(--ink-soft); }
.cell.sup { background: var(--support); color: #fff; flex-direction: column; gap: 1px; }
.cell.sup .i { width: 20px; height: 20px; } .cell.sup b { font: 700 12px/1 var(--display); }
.cell.sup.spent { opacity: .55; }
.cell .lv { position: absolute; top: 2px; left: 4px; font: 700 9px/1 var(--display); }
.cell.hot { box-shadow: inset 0 0 0 3px var(--hot); cursor: pointer; }
.cell.sel { box-shadow: inset 0 0 0 3px var(--ink); }
.tile { position: absolute; inset: 3px; border-radius: 3px; background: var(--wall-bg); border: 1.5px solid var(--wall); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); }
.tile .tn { font: 600 9.5px/1 var(--display); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.tile .hp { font: 700 15px/1 var(--display); color: var(--wall); } .tile .hp small { font-size: 9px; color: var(--ink-soft); }
.tile .tb { display: flex; align-items: center; gap: 1px; font: 600 9px/1 var(--display); color: var(--wall); }
.tile .tb .i { width: 9px; height: 9px; }
.tile.hidden { background: repeating-linear-gradient(45deg, var(--wall) 0 4px, color-mix(in srgb, var(--wall) 75%, #000) 4px 8px); color: #fff; border-color: var(--wall); }
.tile.hidden b { font: 700 18px/1 var(--display); } .tile.hidden small { font-size: 8px; }
.tile.trap { border-style: dashed; }
.cghost { position: absolute; inset: 4px; border: 1.5px dashed var(--wall); border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--wall); font: 600 9px/1.1 var(--display); text-align: center; }
.cghost .i { width: 13px; height: 13px; }
.toks { position: absolute; inset: auto 2px 2px 2px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; z-index: 1; }
.tok { width: calc(var(--cell) / 2.6); height: calc(var(--cell) / 3.4); min-width: 20px; min-height: 16px; border: 0; border-radius: 4px; padding: 0 2px; display: flex; justify-content: space-between; align-items: center; color: #fff; font: 700 10px/1 var(--display); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tok.aggro { background: var(--aggro); } .tok.tank { background: var(--tank); } .tok.soutien { background: var(--soutien); }
.tok.sel { outline: 2px solid var(--hot); } .tok.done { opacity: .5; } .tok.new { box-shadow: 0 0 0 1.5px #fff, 0 1px 2px rgba(0,0,0,.35); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: .75rem; color: var(--ink-soft); margin-top: 6px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--lc); margin-right: 4px; vertical-align: -1px; }
.detail { width: 100%; max-width: calc(var(--cell) * 9 + 16px); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; font-size: .86rem; }
.detail.empty { color: var(--ink-soft); text-align: center; background: transparent; border-style: dashed; margin: 0; }
.detail.aggro { border-top: 4px solid var(--aggro); } .detail.tank { border-top: 4px solid var(--tank); } .detail.soutien { border-top: 4px solid var(--soutien); }
.d-head { display: flex; align-items: center; gap: 6px; } .d-head b { font: 700 1.1rem/1 var(--display); } .d-head span { color: var(--ink-soft); font-size: .8rem; }
.detail p { margin: 5px 0; }

.handoff { display: flex; justify-content: center; padding: 40px 0; }
.ho-card { background: var(--panel); border: 1px solid var(--rule); border-top: 6px solid var(--c); border-radius: 12px; padding: 28px 30px; max-width: 420px; text-align: center; }
.handoff.essaim { --c: var(--essaim); } .handoff.colonie { --c: var(--colonie); }
.ho-card .i.big { color: var(--c); }
.ho-card h2 { margin: 6px 0 8px; font: 700 2rem/1.05 var(--display); text-wrap: balance; }
.ho-k { margin: 8px 0 0; font: 600 .8rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.ho-card p { color: var(--ink-soft); }
.banner.win { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 10px; color: #fff; margin-bottom: 14px; font-size: 1.05rem; }
.banner.win.essaim { background: var(--essaim); } .banner.win.colonie { background: var(--colonie); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-card { position: relative; background: var(--panel); border-radius: 12px; padding: 22px 24px; max-width: 640px; max-height: 85vh; overflow-y: auto; }
.modal-card h2 { margin: 0 0 8px; font: 700 1.6rem/1 var(--display); }
.modal-card .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 1.4rem; }
#flash { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; z-index: 30; font-size: .9rem; max-width: calc(100vw - 32px); }

@media (max-width: 1180px) {
  .layout { grid-template-columns: 1fr 1fr; }
  .center { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 680px) {
  .layout { grid-template-columns: 1fr; }
  .menu { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.capline { display: flex; gap: 6px; align-items: flex-start; font-size: .8rem; line-height: 1.35; margin-top: 3px; color: var(--ink); }
.capline .i { width: 16px; height: 16px; color: var(--soutien); margin-top: 1px; }
.capline b { color: var(--soutien); font-weight: 600; }

.ccard:disabled { opacity: 1; cursor: default; }
.ccard .stats { font-size: .8rem; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ccard .stats em { color: var(--ink-soft); font-style: normal; font-size: .74rem; }
.capline.none { color: var(--ink-soft); font-style: italic; }
.upline { display: flex; gap: 6px; align-items: flex-start; font-size: .76rem; line-height: 1.3; color: var(--ink-soft); }
.upline .i { width: 14px; height: 14px; color: var(--essaim); margin-top: 1px; }
.tree .rk { font-size: .7rem; color: var(--ink-soft); margin-top: 2px; }
.tree .r { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tree .r.r3 { grid-template-columns: 1fr; }
.tree .node { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 6px 7px; font-size: .78rem; opacity: 1; cursor: default; }
.tree .node .np { font: 600 .66rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tree .node b { font-size: .86rem; }
.tree .node .nt { line-height: 1.3; }
.tree .node .ns { font: 600 .7rem/1.2 var(--display); letter-spacing: .04em; color: var(--ink-soft); margin-top: 2px; }
.tree .node.can { border-color: var(--essaim); box-shadow: inset 0 0 0 1px var(--essaim); }
.tree .node.can .ns { color: var(--essaim); }
.tree .node.taken .np, .tree .node.taken .ns, .tree .node.taken .nt { color: rgba(255,255,255,.88); }
.tree .node.closed { opacity: .55; }

.tree .node.closed, .tree .node.needR1 { opacity: .55; }
.tree .node .bar { display: block; height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 3px; }
.tree .node .bar i { display: block; height: 100%; background: var(--essaim); }
.tree .node .inv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tree .node .inv button { border: 1px solid var(--essaim); color: var(--essaim); background: var(--panel); border-radius: 4px; padding: 3px 8px; font-size: .76rem; font-weight: 600; }
.tree .node.taken .bar { display: none; }
.cell.hot .toks { pointer-events: none; }
.cghost:has(+ .toks) { justify-content: flex-start; padding-top: 2px; }
.cghost:has(+ .toks) .i { width: 10px; height: 10px; }
.tcard .capline .i { color: var(--wall); } .tcard .capline b { color: var(--wall); }
.tcard:disabled { opacity: 1; cursor: default; }
.slot.go { display: block; width: 100%; text-align: left; border: 1px solid var(--hot); background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 600; }

/* accueil et jeu en ligne */
.handoff.home { --c: var(--ink); }
.home-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 18px; }
.home-acts button { border: 1px solid var(--rule); background: var(--panel); padding: 9px 14px; border-radius: 6px; }
.home-acts button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.home-acts.join input { font: 700 1.3rem/1 var(--display); letter-spacing: .3em; text-transform: uppercase; text-align: center; width: 8.5em; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel-2); color: var(--ink); }
.bigcode { letter-spacing: .12em; }
.ho-card .link { font-size: .85rem; word-break: break-all; color: var(--ink); }
.code-chip { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; color: var(--ink-soft); padding: 0 4px; }
.code-chip b { color: var(--ink); letter-spacing: .08em; }
.phase.waiting { opacity: .85; }

/* animations (lot 1) : calque au-dessus du plateau, jamais cliquable */
#fx { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 40; pointer-events: none; }
#fx > * { position: absolute; pointer-events: none; }
#fx .tok.ghost { margin: 0; z-index: 2; }
#fx .float { font: 700 .95rem/1 var(--display); white-space: nowrap; text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel); z-index: 3; }
#fx .float.tile-dmg { color: var(--wall); } #fx .float.cr-dmg { color: var(--danger); } #fx .float.bio { color: var(--essaim); font-size: .8rem; }
#fx .shot { width: 8px; height: 8px; border-radius: 50%; background: var(--support); box-shadow: 0 0 0 2px var(--support-bg); z-index: 3; }
#fx .turn-banner { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; font: 600 1rem/1.2 var(--display); letter-spacing: .02em; max-width: calc(100vw - 32px); text-align: center; border-left: 5px solid var(--c, var(--hot)); z-index: 50; }
#fx .turn-banner.essaim { --c: var(--essaim); } #fx .turn-banner.colonie { --c: var(--colonie); }

/* animations (lot 2) et cartes de sortilège en main */
#fx .float.heal { color: var(--sup); }
#fx .beam { width: 4px; height: 60px; border-radius: 2px; background: linear-gradient(var(--off), transparent); transform-origin: bottom; z-index: 3; }
#fx .turn-banner.spell-banner { top: 56px; font-size: .9rem; }
#fx .turn-banner.spell-banner.off { --c: var(--off); } #fx .turn-banner.spell-banner.sup { --c: var(--sup); }
.spell.card { align-items: flex-start; cursor: default; }
.spell.card .i { margin-top: 2px; }
.spell.card small.when { color: var(--c); font-weight: 600; }
.spell.card small.lost { font-size: .72rem; }

/* animations (lot 3) */
#fx .float.aura { color: var(--soutien); font-size: .78rem; }
#fx .float.up { color: var(--ink); font-size: .85rem; }
#fx .nuke { background: radial-gradient(circle, #fff 0%, var(--hot) 60%, transparent 100%); border-radius: 12px; z-index: 4; }
/* carte gratuite (amélioration Déploiement) */
.ccard.free { box-shadow: inset 0 0 0 2px var(--hot); }
.ccard.free .cost { background: var(--hot); color: #1b1f1d; }

/* nouvelle version disponible (page restée ouverte pendant une mise à jour) */
.stale { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 12px; max-width: 900px; padding: 10px 14px; border-radius: 8px; background: var(--hot); color: #1b1f1d; font-weight: 600; }
.stale button { border: 0; background: #1b1f1d; color: #fff; padding: 7px 14px; border-radius: 6px; font-weight: 600; }
/* page Statistiques */
.statpage { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
.st-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.st-head h2 { font: 700 1.8rem/1.1 var(--display); margin: 8px 0; }
.statpage h3 { font: 700 1.25rem/1.2 var(--display); margin: 22px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.statpage .home-acts { justify-content: flex-start; margin: 10px 0; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
.tbl table { border-collapse: collapse; width: 100%; font-size: .9rem; white-space: nowrap; }
.tbl th, .tbl td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--rule); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-weight: 600; color: var(--ink-soft); background: var(--panel-2); }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover, .tbl tbody tr.sel { background: var(--panel-2); }
.tbl tbody tr.sel td:first-child { box-shadow: inset 4px 0 0 var(--hot); }
.st-games { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.st-game { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.st-line { margin: 2px 0; overflow-wrap: anywhere; }
.st-line b.essaim { color: var(--essaim); } .st-line b.colonie { color: var(--colonie); }
.st-game button { margin-top: 6px; }
.st-plan { display: block; width: 100%; max-width: 278px; height: auto; margin-top: 8px; }

/* illustrations (Oni, 04/11/2026) : .im-… fournit --img (miniature WebP intégrée par tools/build.py) */
.tile.im { background: linear-gradient(to bottom, rgba(0,0,0,.05) 35%, rgba(0,0,0,.78)), var(--img) center / cover; color: #fff; justify-content: flex-end; gap: 1px; padding-bottom: 3px; }
.tile.im .tn { font-size: max(9.5px, calc(var(--cell) * .13)); text-shadow: 0 1px 2px #000; }
.tile.im .hp { color: #fff; font-size: max(15px, calc(var(--cell) * .2)); text-shadow: 0 1px 2px #000; } .tile.im .hp small { color: #e6dccd; }
.tile.im .tb { color: #ffd9a8; text-shadow: 0 1px 2px #000; }
.tile.im .tb .i { width: max(9px, calc(var(--cell) * .12)); height: max(9px, calc(var(--cell) * .12)); }
.cell.sup.im { background: linear-gradient(rgba(10,40,36,.35), rgba(10,40,36,.75)), var(--img) center / cover; text-shadow: 0 1px 2px #000; }
.tok.im { background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,.75)), var(--img) center 30% / cover; box-shadow: inset 0 0 0 2px var(--tc); align-items: flex-end; padding-bottom: 1px; text-shadow: 0 1px 2px #000; }
.tok.aggro { --tc: var(--aggro); } .tok.tank { --tc: var(--tank); } .tok.soutien { --tc: var(--soutien); }
.tok.im.new { box-shadow: inset 0 0 0 2px var(--tc), 0 0 0 1.5px #fff; }
.tcard, .ccard { position: relative; }
.tcard:has(.thumb) > b, .tcard:has(.thumb) > small, .ccard:has(.thumb) > b, .ccard:has(.thumb) > small { padding-right: 50px; }
.tcard:has(.thumb), .ccard:has(.thumb) { min-height: 54px; }
.thumb { position: absolute; top: 6px; right: 6px; width: 42px; height: 42px; border-radius: 5px; background: var(--img) center / cover; box-shadow: 0 0 0 1px var(--rule); }
@media (min-width: 681px) { .tok { width: calc(var(--cell) / 2.3); height: calc(var(--cell) / 2.6); } }
@media (min-width: 1181px) { :root { --cell: min(96px, calc((100vw - 640px) / 9)); } } /* 3 colonnes : le plateau laisse la place aux panneaux */

/* ---- résumé compact du camp adverse (Oni, 04/11/2026) : moins de place pour l'adversaire, plateau plus grand ---- */
.layout.me-essaim { grid-template-columns: 196px auto minmax(330px, 1fr); }
.layout.me-colonie { grid-template-columns: minmax(330px, 1fr) auto 196px; }
@media (min-width: 1181px) {
  :root:has(.layout.me-essaim), :root:has(.layout.me-colonie) { --cell: min(104px, calc((100vw - 650px) / 9)); }
}
@media (max-width: 1180px) {
  .layout.me-essaim { grid-template-columns: 210px 1fr; }
  .layout.me-colonie { grid-template-columns: 1fr 210px; }
}
@media (max-width: 680px) { .layout.me-essaim, .layout.me-colonie { grid-template-columns: 1fr; } }
.panel.mini { padding: 12px; }
.panel.mini h3 { font-size: 1.05rem; margin-bottom: 8px; }
.panel.mini h4 { margin: 12px 0 6px; }
.sum { display: flex; gap: 10px; align-items: stretch; }
.kcs { display: grid; grid-template-columns: 1fr; gap: 4px; flex: 1; min-width: 0; align-content: start; }
.kc { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--rule); cursor: help; min-width: 0; }
.kc .i { width: 15px; height: 15px; flex: none; color: var(--ink-soft); }
.kc b { font: 700 1.05rem/1 var(--display); }
.kc small { font-size: .72rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* fusée en colonne : étage 1 en bas, 12 en haut */
.rocket { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.floors.v { display: flex; flex-direction: column-reverse; gap: 3px; margin: 0; width: 34px; flex: 1; }
.floors.v .fl { flex: 1; min-height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: .7rem; cursor: help; position: relative; }
.floors.v .fl.cur { background: linear-gradient(to top, color-mix(in srgb, var(--colonie) 45%, transparent) var(--p), transparent var(--p)); }
.rk-lab { font: 600 .72rem/1 var(--display); color: var(--ink-soft); } .rk-lab b { color: var(--ink); font-size: .9rem; }
.sum-at { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }
.sa { display: flex; align-items: center; gap: 5px; font-size: .74rem; padding: 4px 6px; border-radius: 5px; background: var(--panel-2); border-left: 3px solid var(--lc); cursor: help; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sa b { font: 700 .8rem/1 var(--display); color: var(--lc); }
/* améliorations en icônes */
.utrees { display: flex; flex-direction: column; gap: 6px; }
.utree { display: flex; align-items: center; gap: 4px; }
.utree .ut { width: 20px; display: flex; justify-content: center; color: var(--c); cursor: help; }
.utree.aggro { --c: var(--aggro); } .utree.tank { --c: var(--tank); } .utree.soutien { --c: var(--soutien); }
.utree .usep { width: 1px; align-self: stretch; background: var(--rule); margin: 0 1px; }
.node.un { position: relative; width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--rule); color: var(--ink-soft); background: var(--panel); cursor: help; padding: 0; }
.node.un .i { width: 17px; height: 17px; }
.node.un .bar { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px; border-radius: 2px; background: transparent; overflow: hidden; }
.node.un.prog .bar { background: var(--rule); }
.node.un .bar i { display: block; height: 100%; background: var(--c); }
.node.un.taken { background: var(--c); border-color: var(--c); color: #fff; }
.node.un.taken .bar { display: none; }
.node.un.prog { border-color: var(--c); color: var(--c); }
.node.un.closed { opacity: .28; }
.node.un.needR1 { opacity: .55; }
/* info-bulles (survol, ou toucher sur mobile : focus) */
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after, [data-tip]:focus::after {
  content: attr(data-tip); position: absolute; z-index: 40; top: 50%; left: calc(100% + 8px); transform: translateY(-50%);
  width: max-content; max-width: 230px; white-space: pre-line; text-align: left;
  background: var(--ink); color: var(--panel); font: 500 .76rem/1.4 var(--body); letter-spacing: 0; text-transform: none;
  padding: 7px 9px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none; }
.panel.essaim.mini [data-tip]:hover::after, .panel.essaim.mini [data-tip]:focus::after { left: auto; right: calc(100% + 8px); }
.panel.colonie:not(.mini) .floors [data-tip]:hover::after, .panel.colonie:not(.mini) .floors [data-tip]:focus::after { top: calc(100% + 6px); left: 0; transform: none; }
@media (max-width: 1180px) {
  [data-tip]:hover::after, [data-tip]:focus::after, .panel.essaim.mini [data-tip]:hover::after, .panel.essaim.mini [data-tip]:focus::after {
    top: calc(100% + 6px); left: 0; right: auto; transform: none; max-width: min(230px, 70vw); }
  .panel.essaim.mini [data-tip]:hover::after, .panel.essaim.mini [data-tip]:focus::after { left: auto; right: 0; }
}
.panel.mini, .panel.mini .kcs { overflow: visible; }
@media (max-width: 1180px) { .panel.mini .kcs { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); align-content: start; } .sum-at { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 420px) { .sum-at { grid-template-columns: 1fr 1fr; } }

  // Événements visuels (animations) : S.fx n'existe que pendant une action, créé et vidé par l'appelant

  function addPile(S, lvl, type) {

  // ------------------------------------------------------------------ dérivés
  const tier = S => { let t = 0; TIERS.forEach((r, i) => { if (S.biomass >= r.min) t = i; }); return t; };
  // plafond de population par lane : celui du palier, +3 avec l'amélioration aggro « Essaim agrandi » (décision d'Oni, 30/10/2026)
  const capOf = S => TIERS[tier(S)].cap + (S.upgrades.aggro.r2 === "B" ? 3 : 0);
  const laneCount = (S, lane) => S.creatures.filter(c => c.lane === lane).length;
  const tech = S => Object.values(S.tiles).reduce((a, t) => a + (t.tech || 0), 0) + S.techBonus;
  const spellsPerTurn = S => { const t = tech(S); return t >= 9 ? 3 : t >= 6 ? 2 : t >= 3 ? 1 : 0; };
  // support de niveau 3 : +3 travailleurs tant qu'il tient (Oni, 02/11/2026 ; avant +2)
  const SUP3_WORKERS = 2; // Oni, 04/11/2026 (+3 du 02/11 au 04/11)

  // main de tuiles : 4, +1 à chaque palier de la fusée atteint (étages 3, 6, 9) → 4 / 5 / 6 / 7 (décision d'Oni, 30/10/2026 ;

  const handSize = S => 4 + rocketMilestones(S);
  const posKey = c => { const [x, y] = toGlobal(c.lane, c.u, c.k); return c.k === 4 ? "in:" + c.lane + ":" + c.u : key(x, y); };
  const caseMates = (S, c) => S.creatures.filter(o => o !== c && posKey(o) === posKey(c));
  const anySoutien = S => S.creatures.some(c => CREATURES[c.name].type === "soutien");

  function bonusHp(S, c) {

  // ------------------------------------------------------------------ tuiles et supports

  // ------------------------------------------------------------------ créatures
  function makeCreature(S, name, lane, u, extra) {

  function killCheck(S) {

      const txt = chs.length ? chs.map(ch => `${E(!ch.tile || SF.TILES[ch.tile].camo ? "?" : short(ch.tile))} ${ch.left}`).join(" · ") : "—";
      return `<span class="sa lane-${l}" tabindex="0" data-tip="${E(`Atelier ${SF.LANE_NAME[l]} : ${chs.length ? chs.map(ch => `${!ch.tile || SF.TILES[ch.tile].camo ? "tuile cachée" : ch.tile}, ${ch.left} point${ch.left > 1 ? "s" : ""} restant${ch.left > 1 ? "s" : ""}`).join(" ; ") : "libre"}`)}"><b>${l}</b>${txt}</span>`;
    }).join("");
    return `<h3>${icon("fusee")} Colonie</h3>
      <div class="sum">
        <div class="rocket" aria-label="Fusée : ${S.floors} étages sur 12"><div class="floors v">${rocket}</div><span class="rk-lab"><b>${S.floors}</b>/12</span></div>
        <div class="kcs">
          <span class="kc" tabindex="0" data-tip="Travailleurs : ${S.workersBase} de base${bonus ? ` + ${bonus} grâce aux tuiles et supports` : ""}. L'essaim gagne quand la colonie n'en a plus.">${icon("travailleur")}<b>${S.workersBase}</b>${bonus ? `<small>+${bonus}</small>` : ""}</span>
          <span class="kc" tabindex="0" data-tip="Technologies : ${SF.tech(S)} → ${SF.spellsPerTurn(S)} sortilège(s) par tour">${icon("tech")}<b>${SF.tech(S)}</b><small>${SF.spellsPerTurn(S)} sort/t</small></span>
          <span class="kc" tabindex="0" data-tip="Fusée : ${S.rocketPts} / ${SF.floorCost(S)} points vers l'étage ${Math.min(12, S.floors + 1)}">${icon("fusee")}<b>${S.rocketPts}</b><small>/${SF.floorCost(S)} pts</small></span>
          <span class="kc" tabindex="0" data-tip="${S.hand.length} tuiles en main (cachées)">${icon("mur")}<b>${S.hand.length}</b><small>tuiles</small></span>
          <span class="kc" tabindex="0" data-tip="${S.spells.length} sortilège(s) en main (cachés)">${icon("sort")}<b>${S.spells.length}</b><small>sorts</small></span>
        </div>
      </div>
      <div class="sum-at" data-fx="ateliers">${ateliers}</div>`;
  }
  // icône de chaque nœud d'amélioration (résumé de l'essaim vu par la colonie)
  const NODE_ICON = {
    aggro: { A1: "ferocite", B1: "mobilite", A2: "carnage", C2: "deploiement", B2: "essaim" },
    tank: { A1: "carapace", B1: "protection", A2: "blindage", C2: "reincarnation", B2: "masse" },
    soutien: { A1: "mue", B1: "griffes", A2: "regeneration", C2: "clairvoyance", B2: "frenesie" },
  };
  // résumé de l'essaim vu par la colonie : chiffres clés et améliorations en icônes (détail au survol)
  function swarmSummary() {
    const t = SF.TIERS[SF.tier(S)], next = SF.TIERS[SF.tier(S) + 1];
    const POS = { A1: "rang 1, côté A", B1: "rang 1, côté B", A2: "rang 2, après A", C2: "rang 2, centre", B2: "rang 2, après B" };
    const trees = ["aggro", "tank", "soutien"].map(ty => {
      const T = SF.TREES[ty];
      const node = slot => {
        const st = SF.nodeState(S, ty, slot), cost = SF.nodeCost(slot), got = SF.invested(S, ty, slot);
        const state = st === "taken" ? "acquis" : st === "closed" ? "fermé" : st === "needR1" ? "demande d'abord un rang 1" : got ? `${got} / ${cost} investis` : `${cost} biomasse`;
        return `<span class="node un ${st}${got && st !== "taken" ? " prog" : ""}" data-node="${ty}:${slot}" tabindex="0" style="--p:${Math.round(100 * got / cost)}%"
          data-tip="${E(`${T[slot][0]} (${POS[slot]}) : ${T[slot][1]}\n${state}`)}">${icon(NODE_ICON[ty][slot])}<span class="bar"><i style="width:${Math.round(100 * got / cost)}%"></i></span></span>`;
      };
      return `<div class="utree ${ty}"><span class="ut" tabindex="0" data-tip="Améliorations ${ty}">${icon(ty)}</span>${node("A1")}${node("B1")}<span class="usep"></span>${node("A2")}${node("C2")}${node("B2")}</div>`;
    }).join("");
    const turn = ["A_deploy", "A_upgrade", "A_attack", "A_react"].includes(S.phase);
    return `<h3>${icon("spores")} Essaim</h3>
      <div class="kcs">
        <span class="kc" tabindex="0" data-tip="Biomasse : ${S.biomass}${next ? ` (palier suivant à ${next.min})` : ""}">${icon("biomasse")}<b>${S.biomass}</b><small>bio</small></span>
        <span class="kc" tabindex="0" data-tip="Palier ${SF.tier(S) + 1} : pioche ${t.n.join(" / ")} (niveaux 1 / 2 / 3), plafond ${SF.capOf(S)} créatures par lane">${icon("palier")}<b>${SF.tier(S) + 1}</b><small>max ${SF.capOf(S)}/lane</small></span>
        ${turn ? `<span class="kc" data-fx="budget" tabindex="0" data-tip="Budget de ce tour${S.famine ? " (Famine : biomasse ÷ 2)" : ""}">${icon("biomasse")}<b>${S.budget}</b><small>budget</small></span>` : `<span class="kc" data-fx="budget" tabindex="0" data-tip="Réserve : biomasse non investie">${icon("biomasse")}<b>${S.reserve}</b><small>réserve</small></span>`}
        <span class="kc hidden-hand" tabindex="0" data-tip="${S.handA.length} cartes en main (cachées) · pioches ${S.piles[1].length} / ${S.piles[2].length} / ${S.piles[3].length}">${icon("sort")}<b>${S.handA.length}</b><small>cartes</small></span>
      </div>
      <h4>Améliorations</h4><div class="utrees">${trees}</div>`;
  }

  // ---------------------------------------------------------------- boîte d'action
  function phaseBox() {
    if (S.winner) return "";
    const p = PHASE_TXT[S.phase];
    if (online() && !myTurn()) return `<section class="phase ${p[0]} waiting"><div class="ph-head"><span class="dot ${p[0]}"></span><b>${E(p[1])}</b><span class="side">${E(SIDE[p[0]])}</span></div>
      <p class="ph-txt">Au tour de ${E(SIDE[p[0]])} : en attente de votre adversaire…</p></section>`;
    let body = "", acts = "";
    const ph = S.phase;
    if (ph === "A_famine") {
      acts = `<button data-a="famine" data-v="1" class="primary">Jouer Famine</button><button data-a="famine" data-v="0">Ne pas jouer</button>`;
    } else if (ph === "A_start") {
      acts = `<button data-a="draw" class="primary">Piocher (palier ${SF.tier(S) + 1})</button>`;
    } else if (ph === "A_deploy" && UI.sap) {
      body = `<p class="hint">Sapeur : choisissez le bâtiment à détruire dans la lane ${SF.LANE_NAME[UI.sap.lane]}.</p><div class="choices">` +
        SF.laneTiles(S, UI.sap.lane).map(k => `<button data-a="sapTarget" data-k="${k}">${E(tileLabel(k))}</button>`).join("") + `<button data-a="sapCancel">Annuler</button></div>`;
    } else if (ph === "A_deploy") {
      body = UI.sel ? `<p class="hint">Carte choisie : <b>${E(cardOf(UI.sel).name)}</b>. Cliquez une case d'entrée surlignée.</p>` : "";
      acts = `<button data-a="endDeploy" class="primary">Terminer les déploiements</button>`;
    } else if (ph === "A_upgrade") {
      body = `<p class="hint">Réserve disponible : <b>${S.reserve}</b>. Investissez-la dans un nœud des arbres (panneau Essaim) ou gardez-la pour plus tard.</p>`;
      acts = `<button data-a="toAttacks" class="primary">Passer aux attaques</button>`;
    } else if (ph === "A_react") {
      body = spellBox("off");
      acts = `<button data-a="reactDone" class="primary">Terminer la réaction</button>`;
    } else if (ph === "A_attack") {
      const ready = SF.readyCases(S), crOf = k => S.creatures.filter(c => SF.posKey(c) === k && !c.acted);
      const blockTxt = k => { const cs = crOf(k); return `${posTxt(cs[0])} : ${cs.map(c => c.name + (SF.attacks(c) ? "" : " (avance)")).join(", ")}`; };
      if (UI.blk && ready.includes(UI.blk)) { // choix de l'ordre d'attaque dans le bloc
        const att = crOf(UI.blk).filter(SF.attacks);
        body = `<p class="hint">Bloc ${E(blockTxt(UI.blk))}. Touchez les créatures dans l'ordre où elles attaqueront (les autres suivront).</p><div class="choices">` +
          att.map(c => { const n = UI.ord.indexOf(c.id); return `<button data-a="ordPick" data-id="${c.id}" class="${n >= 0 ? "on" : ""}">${n >= 0 ? (n + 1) + ". " : ""}${E(c.name)} · ATQ ${SF.effAtq(S, c)} · ${c.hp + SF.bonusHp(S, c)} PV</button>`; }).join("") + `</div>`;
        acts = `<button data-a="ordGo" class="primary">Attaquer</button><button data-a="ordCancel">Annuler</button>`;
      } else {
        const waiting = [...new Set(S.creatures.filter(c => !c.acted).map(SF.posKey))].filter(k => !ready.includes(k));
        body = ready.length ? `<p class="hint">Chaque case avance en bloc d'une case (deux pour les aggros mobiles) et attaque si elle est au contact ; dans une lane, les cases les plus proches de la fusée agissent d'abord.</p><div class="choices">` + ready.map(k => `<button data-a="act" data-k="${k}">${E(blockTxt(k))}</button>`).join("") + `</div>` +
          (waiting.length ? `<p class="small">En attente : ${waiting.map(k => E(blockTxt(k))).join(" · ")}</p>` : "") : `<p class="hint">Toutes les créatures ont agi.</p>`;
        acts = (ready.length ? `<button data-a="actAll">Tout résoudre (les plus avancées d'abord)</button>` : "") + `<button data-a="endA" class="primary"${ready.length ? " disabled" : ""}>Fin du tour de l'essaim</button>`;
      }
    } else if (ph === "D_main") {
      body = spellBox("sup") + (UI.sel !== null ? `<p class="hint">Tuile choisie : <b>${E(S.hand[UI.sel])}</b>. Choisissez la lane de son chantier : bouton « Construire ici » dans les ateliers (panneau Colonie). La case exacte sera choisie à la fin de la construction.</p>` : "");
      acts = `<button data-a="build" class="primary">Construire, puis passer aux tirs</button>`;
    } else if (ph === "D_place") {
      const p = S.toPlace[0];
      body = p ? `<p class="hint"><b>${E(p.tile)}</b> est achevé en lane ${SF.LANE_NAME[p.lane]} : cliquez une case surlignée.${S.toPlace.length > 1 ? ` Encore ${S.toPlace.length - 1} bâtiment${S.toPlace.length > 2 ? "s" : ""} à poser ensuite.` : ""}</p>` : "";
    } else if (ph === "D_fire") {
      if (UI.support) {
        const c = SF.supportTargets(S, UI.support);
        body = `<p class="hint">Tourelle de niveau ${S.supports[UI.support]} (${SF.turretDmg(S, S.supports[UI.support])} dégâts) : choisissez la cible.</p><div class="choices">` +
          c.map(o => `<button data-a="fireAt" data-id="${o.id}">${E(o.name)} · ${o.hp} PV · ${posTxt(o)}</button>`).join("") + `</div>`;
      } else {
        const ready = Object.keys(S.supports).filter(k => S.supports[k] < 3 && SF.shotsLeft(S, k) > 0 && SF.supportTargets(S, k).length);
        body = ready.length ? `<p class="hint">Tourelles prêtes : cliquez une tourelle surlignée sur le plateau.</p>` : `<p class="hint">Aucune tourelle n'a de cible.</p>`;
      }
      acts = `<button data-a="autoFire">Tirs automatiques</button><button data-a="endD" class="primary">Terminer le tour</button>`;
    }
    return `<section class="phase ${p[0]}"><div class="ph-head"><span class="dot ${p[0]}"></span><b>${E(p[1])}</b><span class="side">${E(SIDE[p[0]])}</span></div>
      <p class="ph-txt">${E(p[2])}</p>${body}<div class="acts">${acts}</div></section>`;
  }
  function spellBox(kind) {
    const list = S.spells.map((s, i) => [s, i]).filter(([s]) => SF.SPELLS[s].kind === kind && !(kind === "off" && s === "Famine"));
    if (UI.spell !== null) return spellTargeting();
    if (!list.length) return kind === "sup" ? "" : `<p class="hint">Aucun sortilège offensif jouable.</p>`;
    return `<div class="spells">` + list.map(([s, i]) => `<button data-a="spell" data-i="${i}" class="spell ${kind}">${icon(spellIcon(s))}<span><b>${E(s)}</b><small>${E(SF.SPELLS[s].text)}</small></span></button>`).join("") + `</div>`;
  }
  function spellTargeting() {
    const name = S.spells[UI.spell];
    const cancel = `<button data-a="spellCancel">Annuler</button>`;
    const crs = list => `<div class="choices">${list.map(c => `<button data-a="spellArg" data-v="${c.id}">${E(c.name)} · ${c.hp} PV · ${posTxt(c)}</button>`).join("")}${cancel}</div>`;
    const lanes = `<div class="choices">${SF.LANES.map(l => `<button data-a="spellArg" data-v="${l}">Lane ${SF.LANE_NAME[l]}</button>`).join("")}${cancel}</div>`;
    let inner = "";
    switch (name) {
      case "Frappe orbitale": case "Salve": inner = crs(S.creatures.filter(c => SF.targetable(S, c))); break;
      case "Brouillage": inner = crs(S.creatures.filter(c => SF.targetable(S, c) && !c.acted)); break;
      case "Barrage": inner = lanes; break;
      case "Champ de stase": inner = `<p class="hint">Bâtiment à protéger ce tour (aucun dégât, pas d'Épines) :</p><div class="choices">${Object.keys(S.tiles).map(k => `<button data-a="spellArg" data-v="${k}">${E(tileLabel(k))}</button>`).join("")}${cancel}</div>`; break;
      case "Onde de choc": inner = `<div class="choices">${[1, 2, 3].map(r => `<button data-a="spellArg" data-v="${r}">Couronne ${r}</button>`).join("")}${cancel}</div>`; break;
      case "Réparation": {
        const dmg = Object.keys(S.tiles).filter(k => S.tiles[k].hp < S.tiles[k].max);
        inner = `<p class="hint">Points posés : ${UI.picks.length} / 3.</p><div class="choices">` +
          dmg.map(k => `<button data-a="pick" data-k="${k}">+1 · ${E(tileLabel(k))} (${S.tiles[k].hp + UI.picks.filter(p => p === k).length}/${S.tiles[k].max})</button>`).join("") +
          `<button data-a="spellArg" data-v="picks" class="primary"${UI.picks.length ? "" : " disabled"}>Valider</button>${cancel}</div>`;
        break;
      }
      case "Renouvellement":
        inner = `<p class="hint">Choisissez les tuiles à défausser.</p><div class="choices">` +
          S.hand.map((t, i) => `<button data-a="pickHand" data-i="${i}" class="${UI.picks.includes(i) ? "on" : ""}">${E(t)}</button>`).join("") +
          `<button data-a="spellArg" data-v="picks" class="primary">Défausser et repiocher</button>${cancel}</div>`;
        break;
      case "Reconversion":
        inner = UI.recoHand === null
          ? `<p class="hint">Choisissez la tuile de votre main.</p><div class="choices">${S.hand.map((t, i) => `<button data-a="recoHand" data-i="${i}">${E(t)}</button>`).join("")}${cancel}</div>`
          : `<p class="hint">Elle remplace quelle tuile construite ?</p><div class="choices">${Object.keys(S.tiles).filter(k => !S.tiles[k].start).map(k => `<button data-a="spellArg" data-v="${k}">${E(tileLabel(k))}</button>`).join("")}${cancel}</div>`;
        break;
      default: inner = `<div class="choices"><button data-a="spellArg" data-v="go" class="primary">Jouer ${E(name)}</button>${cancel}</div>`;
    }
    return `<div class="targeting"><p class="hint"><b>${E(name)}</b> : ${E(SF.SPELLS[name].text)}</p>${inner}</div>`;
  }
  // carte de sortilège en main : type, moment où le jouer, effet complet
  function spellCard(s) {
    const sp = SF.SPELLS[s];
    const when = s === "Famine" ? "Offensif · au début du tour de l'essaim, avant qu'il calcule son budget"
      : sp.kind === "off" ? "Offensif · pendant le tour de l'essaim, juste avant ses attaques"
      : "Soutien · pendant votre tour, avant de passer aux tirs";
    return `<div class="spell ${sp.kind} card">${icon(spellIcon(s))}<span><b>${E(s)}</b><small class="when">${E(when)}</small><small>${E(sp.text)}</small><small class="lost">Reste en main tant qu'il n'est pas joué.</small></span></div>`;
  }
  const spellIcon = s => ({ "Frappe orbitale": "frappe", "Salve": "salve", "Barrage": "lane", "Onde de choc": "couronne", "Champ de stase": "stase", "Famine": "famine", "Brouillage": "brouillage", "Effort": "effort", "Cadence": "cadence", "Feu nourri": "tourelle", "Réparation": "reparation", "Renouvellement": "renouvellement", "Reconversion": "reconversion" }[s]);
  const capIcon = c => ({ vision: "vision", soin: "soin", fureur: "fureur", butin: "biomasse", percee: "percee", cuirasse: "renforce", sabotage: "sabotage", spores: "spores" }[c] || "aura");
  const cardOf = uid => S.handA.find(c => c.uid === uid) || { name: "?" };
  function posTxt(c) { return c.k === 4 ? `entrée ${SF.LANE_NAME[c.lane]} ${SF.COLS[c.u + 2]}` : `${SF.LANE_NAME[c.lane]} ${SF.COLS[c.u + 2]}${c.k}`; }
  function tileLabel(k) {
    const [x, y] = SF.parse(k), l = SF.cellLane(x, y), [u, r] = SF.toLocal(l, x, y);
    return `${S.tiles[k] ? (hiddenTrap(S.tiles[k]) ? "Tuile camouflée" : S.tiles[k].name) : "case"} · ${SF.LANE_NAME[l]} ${SF.COLS[u + 2]}${r}`;
  }

  // ---------------------------------------------------------------- plateau
  function hiddenTrap(t) { return t.camo && !t.revealed && S.view === "essaim" && !SF.clairvoyance(S); }
  function board() {
    const canDeployHere = (lane, u) => S.phase === "A_deploy" && S.view === "essaim" && UI.sel && SF.canDeploy(S, cardOf(UI.sel), lane);
    const placeHot = S.phase === "D_place" && S.view === "colonie" ? SF.placeTargets(S) : [];
    let html = "";
    for (let y = 4; y >= -4; y--) for (let x = -4; x <= 4; x++) {
      const r = SF.ring(x, y), k = SF.key(x, y);
      if (r === 4) { // entrées
        const lane = SF.cellLane(x, y);
        if (!lane) { html += `<div class="cell void"></div>`; continue; }
        const [u] = SF.toLocal(lane, x, y);
        if (Math.abs(u) > 2) { html += `<div class="cell void"></div>`; continue; }
        const crs = S.creatures.filter(c => c.lane === lane && c.k === 4 && c.u === u);
        const hot = canDeployHere(lane, u);
        html += `<div class="cell entry lane-${lane}${hot ? " hot" : ""}" data-xy="${k}" ${hot ? `data-a="deployAt" data-l="${lane}" data-u="${u}"` : ""}><span class="col">${SF.COLS[u + 2]}</span>${tokens(crs)}</div>`;
        continue;
      }
      if (x === 0 && y === 0) {
        html += `<div class="cell core" data-xy="${k}">${icon("fusee")}<b>${S.floors}/12</b><small>${S.workersBase} trav.</small></div>`;
        continue;
      }
      if (SF.isSupportCell(x, y)) {
        const lvl = S.supports[k];
        const ready = S.phase === "D_fire" && S.view === "colonie" && lvl && lvl < 3 && SF.shotsLeft(S, k) > 0 && SF.supportTargets(S, k).length;
        const fired = lvl && lvl < 3 && SF.shotsLeft(S, k) <= 0;
        html += lvl ? `<div class="cell sup ${imCls("support " + lvl)}${ready ? " hot" : ""}${UI.support === k ? " sel" : ""}${fired ? " spent" : ""}" data-xy="${k}" ${ready ? `data-a="support" data-k="${k}"` : ""}>
            <span class="lv">${["", "I", "II", "III"][lvl]}</span>${lvl < 3 ? icon("tourelle") + `<b>${SF.turretDmg(S, lvl)}</b>` : icon("travailleur") + `<b>+${SF.SUP3_WORKERS}</b>`}</div>`
          : `<div class="cell corner"><span class="lv">${["", "I", "II", "III"][r]}</span></div>`;
        continue;
      }
      const lane = SF.cellLane(x, y);
      const t = S.tiles[k];
      const crs = S.creatures.filter(c => c.k < 4 && SF.posKey(c) === k);
      const target = placeHot.includes(k);
      let inner = "";
      if (t) {
        if (hiddenTrap(t)) inner = `<div class="tile hidden"><b>?</b><small>camouflée</small></div>`;
        else {
          const ep = SF.epinesOf(S, k, S.view === "essaim");
          inner = `<div class="tile ${imCls(t.name)}${t.camo && !t.revealed ? " trap" : ""}" title="${t.camo && !t.revealed ? "Camouflée : l'essaim ne la voit pas" : ""}"><span class="tn">${E(short(t.name))}</span><b class="hp">${t.hp}<small>/${t.max}</small></b>
            <span class="tb">${ep ? icon("epines") + ep : ""}${t.ren ? icon("renforce") + t.ren : ""}${t.tech ? icon("tech") + t.tech : ""}${t.temp ? icon("temp") : ""}</span></div>`;
        }
      }
      const stased = S.stase.includes(k);
      html += `<div class="cell lane lane-${lane} r${r}${target ? " hot" : ""}${stased ? " stase" : ""}" data-xy="${k}" ${target ? `data-a="placeAt" data-k="${k}"` : ""}>${inner}${tokens(crs)}</div>`;
    }
    return `<div class="board" role="grid" aria-label="Plateau">${html}</div>
      <div class="legend"><span><i class="sw lane-N"></i>Nord</span><span><i class="sw lane-E"></i>Est</span><span><i class="sw lane-S"></i>Sud</span><span><i class="sw lane-O"></i>Ouest</span><span>Lettres : colonnes d'entrée</span></div>`;
  }
  // Carte de tuile en main : durée, PV, Épines et capacités (libellés du Catalogue du livret v0.3)
  function tileCard(name) {
    const t = SF.TILES[name], L = SF.LANE_NAME;
    const pv = t.pv === "ap" ? `2 (4 en lane ${L[t.dir]})` : t.pv === "front" ? "2 à 4" : t.pv === "reduit" ? "2 à 4" : t.pv;
    const caps = [];
    const cap = (ic, n, txt) => caps.push(`<span class="capline">${icon(ic)}<span><b>${E(n)}</b> : ${E(txt)}</span></span>`);
    if (t.aura) cap("epines", "Aura d'épines", "+1 Épines à chaque bâtiment des 8 cases autour (cumulable).");
    if (t.pv === "ap") cap("cardinal", "Avant-poste", `+2 PV si posé dans la lane ${L[t.dir]} (4 PV), sinon 2 PV.`);
    if (t.pv === "front") cap("couronne", "Ligne de front", "PV = 1 + couronne (2 / 3 / 4) : plus solide loin de la fusée.");
    if (t.pv === "reduit") cap("couronne", "Réduit", "PV = 5 − couronne (4 / 3 / 2) : plus solide près de la fusée.");
    if (t.ren) cap("renforce", `Renforcé ${t.ren}`, `ne perd 1 PV que par tranche complète de ${t.ren} dégâts d'une même attaque.`);
    if (t.tech) cap("tech", `+${t.tech} technologie${t.tech > 1 ? "s" : ""}`, "compte dans votre total de technologies tant que la tuile tient.");
    if (t.temp) cap("temp", "Travailleur temporaire", "+1 travailleur tant que la tuile tient.");
    if (t.perm) cap("perm", "Travailleur permanent", "+1 travailleur gagné à la construction, conservé même si la tuile tombe.");
    if (t.camo) cap("piege", "Camouflage", "posée face cachée : l'essaim ne la voit pas. Retournée à la première attaque, ou révélée par un Œil-sonde vivant dans sa lane ou par la Clairvoyance.");
    if (t.siphon) cap("biomasse", "Siphon", `révélé par une attaque de l'essaim, il lui retire ${t.siphon} biomasse (jamais sous ${SF.MIN_BIOMASS}). Ne se déclenche pas s'il a été vu par Vision ou Clairvoyance.`);
    if (t.trap) cap("piege", "Piège", `${SF.TRAP_DMG} dégâts à la créature qui le révèle en l'attaquant, avant qu'elle frappe (si elle en meurt, elle ne frappe pas). Un piège rendu visible par Vision ou Clairvoyance ne se déclenche plus.`);
    if (t.ep) cap("epines", `Épines ${t.ep}`, `${t.ep} dégât${t.ep > 1 ? "s" : ""} à la créature qui l'attaque, après son attaque (+1 par Avant-poste dans les 8 cases autour).`);
    return `<b>${E(name)}</b><small>${icon("duree")} ${t.d} point${t.d > 1 ? "s" : ""} de construction</small>
      <span class="stats">${icon("pv")} ${pv} PV${t.ep ? ` · ${icon("epines")} Épines ${t.ep}` : " · sans Épines"}</span>${caps.join("")}`;
  }
  // illustration d'une tuile, d'un support ou d'une créature : classe CSS « im im-… » ajoutée au build (vide si pas d'image)
  const imCls = n => (typeof IMG_CLASS !== "undefined" && IMG_CLASS[n]) || "";
  const short = n => ({ "Haie d'épines": "Haie", "Mur hérissé": "Hérissé", "Avant-poste du Nord": "Av.-poste N", "Avant-poste de l'Est": "Av.-poste E", "Avant-poste du Sud": "Av.-poste S", "Avant-poste de l'Ouest": "Av.-poste O", "Ligne de front": "Front", "Observatoire": "Observ.", "Laboratoire": "Labo", "Baraquement": "Baraq." }[n] || n);
  function tokens(crs) {

      const t = SF.CREATURES[c.name].type;

  function detail() {
    const c = S.creatures.find(o => o.id === UI.selCreature);

    const b = SF.CREATURES[c.name];
    const extras = [];
    { const v = SF.speedOf(S, c); if (v > 1) extras.push(`${v} cases par tour (${[c.name === "Glaneur" ? "vitesse de base 2" : "", SF.hasMobility(S, c) ? "Mobilité" : "", SF.caseMates(S, c).some(o => o.name === "Glaneur") ? "Aura Mobilité" : ""].filter(Boolean).join(" + ")})`); }
    if (SF.isStealthy(S, c)) extras.push("Furtivité");

    // Frénésie : chaque soutien double les dégâts d'une autre créature de sa case, au choix de l'essaim (cumulable)

      }).join("");

    return `<h3>${icon("fusee")} Colonie</h3>
      <div class="kv"><span>Travailleurs</span><b>${S.workersBase}${SF.bonusWorkers(S) ? ` + ${SF.bonusWorkers(S)}` : ""}</b></div>
      <div class="kv"><span>Technologies</span><b>${SF.tech(S)} → ${SF.spellsPerTurn(S)} sort./tour</b></div>
      <div class="floors">${floors}</div><p class="small">Fusée : ${S.floors}/12 étages · ${S.rocketPts}/${SF.floorCost(S)} points vers le suivant. Un étage coûte 2 points (étages 1 à 3), puis 4, 6 et 8 après les paliers 3 · 6 · 9.</p>
      <h4 data-fx="ateliers">Ateliers ${mine && S.phase === "D_main" ? `<span class="small">points ${used}/${pts} · fusée ${pts - used}</span>` : ""}</h4>${ateliers}
      <h4 data-fx="tilehand">Main de tuiles</h4>${hand}<h4>Sortilèges</h4>${spells}`;
  }
  function swarmPanel() {
    const mine = S.view === "essaim";
    const t = SF.TIERS[SF.tier(S)];
    const acquired = ty => { // améliorations acquises pour ce type
      const u = S.upgrades[ty], out = [];
      if (u.r1) out.push(SF.TREES[ty][u.r1 + "1"]);
      if (u.r2) out.push(SF.TREES[ty][u.r2 + "2"]);
      return out;
    };
    const hand = mine
      ? (S.handA.length ? `<div class="hand">${S.handA.map(c => {
        const b = SF.CREATURES[c.name];
        const atq = SF.baseAtq(S, c.name), pv = SF.maxHp(S, c.name);
        const ups = acquired(b.type).map(([n, txt]) => `<span class="upline">${icon("palier")}<span><b>${E(n)}</b> : ${E(txt)}</span></span>`).join("");
        return `<button data-a="card" data-uid="${c.uid}" class="ccard ${b.type}${c.free ? " free" : ""}${UI.sel === c.uid ? " sel" : ""}"${S.phase === "A_deploy" ? "" : " disabled"}><span class="cost">${c.free ? "0" : b.cost}</span>${imCls(c.name) ? `<span class="thumb ${imCls(c.name)}"></span>` : ""}
          <b>${E(c.name)}</b><small>${b.type} · niveau ${b.lvl}${c.free ? " · gratuit" : ""}</small>
          <span class="stats">${b.type === "soutien" ? `${icon("atq")} 0 ATQ <em>(n'attaque pas)</em>` : `${icon("atq")} ${atq} ATQ${atq !== b.atq ? ` <em>(base ${b.atq})</em>` : ""}`} · ${icon("pv")} ${pv} PV${pv !== b.pv ? ` <em>(base ${b.pv})</em>` : ""}</span>
          ${b.cap ? `<span class="capline">${icon(capIcon(b.cap))}<span><b>${E(b.capName)}</b> : ${E(b.capText)}</span></span>` : `<span class="capline none">Aucune capacité propre.</span>`}${ups}</button>`;
      }).join("")}</div>` : `<p class="muted">Pas de cartes en main.</p>`)
      : `<p class="hidden-hand">${S.handA.length} cartes en main (cachées)</p>`;
    let trees = "";
    const POS = { A1: "Côté A", B1: "Côté B", A2: "Après A", C2: "Centre", B2: "Après B" };
    for (const ty of ["aggro", "tank", "soutien"]) {
      const u = S.upgrades[ty], T = SF.TREES[ty];
      const node = slot => {
        const st = SF.nodeState(S, ty, slot), cost = SF.nodeCost(slot), got = SF.invested(S, ty, slot);
        const avail = SF.investable(S);
        const canInv = mine && st === "open" && avail > 0 && ["A_deploy", "A_upgrade"].includes(S.phase);
        let state, cls = st;
        if (st === "taken") state = "Acquis";
        else if (st === "closed") state = got ? "Fermé" : (u.r1 && !slot.endsWith("1") && slot !== "C2" && u.r1 !== slot[0] ? `Fermé : demande ${T[slot[0] + "1"][0]}` : "Fermé : biomasse déjà engagée sur l'autre choix de ce rang");
        else if (st === "needR1") state = "Demande d'abord un rang 1";
        else state = `${got} / ${cost} investis`;
        const bar = st === "open" || got ? `<span class="bar"><i style="width:${Math.round(100 * got / cost)}%"></i></span>` : "";
        const btns = canInv ? `<span class="inv"><button data-a="invest" data-t="${ty}" data-s="${slot}" data-n="1">+1</button><button data-a="invest" data-t="${ty}" data-s="${slot}" data-n="99">Tout investir (${Math.min(avail, cost - got)})</button></span>` : "";
        return `<div class="node ${cls}${canInv ? " can" : ""}" data-node="${ty}:${slot}"><span class="np">${POS[slot]}</span><b>${E(T[slot][0])}</b><span class="nt">${E(T[slot][1])}</span>${bar}<span class="ns">${E(state)}</span>${btns}</div>`;
      };
      trees += `<div class="tree ${ty}"><span class="tt">${icon(ty)}${ty}</span>
        <span class="rk">Rang 1 · ${SF.COST_R1} biomasse · 1 choix sur 2 · ajoute les cartes de niveau 2</span><div class="r">${node("A1")}${node("B1")}</div>
        <span class="rk">Rang 2 · ${SF.COST_R2} biomasse · 1 choix sur 3 · ajoute les cartes de niveau 3</span><div class="r r3">${node("A2")}${node("C2")}${node("B2")}</div></div>`;
    }
    return `<h3>${icon("spores")} Essaim</h3>
      <div class="kv"><span>Biomasse</span><b>${S.biomass}</b></div>
      <div class="kv"><span>Palier</span><b>${SF.tier(S) + 1} · pioche ${t.n.join("/")} · plafond ${SF.capOf(S)}</b></div>
      <div class="kv" data-fx="budget"><span>Budget du tour</span><b>${S.budget}${S.famine ? " (Famine : biomasse ÷ 2)" : ""}</b></div>
      <div class="kv"><span>Réserve (non investie)</span><b>${S.reserve}</b></div>
      <div class="kv"><span>Pioches N1 / N2 / N3</span><b>${S.piles[1].length} / ${S.piles[2].length} / ${S.piles[3].length}</b></div>
      <h4>Main</h4>${hand}<h4>Arbres d'amélioration</h4>${trees}`;
  }
  function logPanel() {
    return `<h4>Journal</h4><ol class="log">${S.log.slice(0, 40).map(l => `<li class="${l.who}"><span>M${l.r}</span>${E(l.msg)}</li>`).join("")}</ol>`;
  }
  function help() {
    return `<div class="modal" role="dialog" aria-label="Règles"><div class="modal-card"><button data-a="help" class="x close" aria-label="Fermer">×</button>
      <h2>Règles en bref</h2>
      <p><b>But.</b> La colonie gagne quand le 12ᵉ étage de la fusée est achevé. L'essaim gagne quand la colonie n'a plus de travailleurs.</p>
      <p><b>Essaim.</b> Budget = biomasse (5 au départ). Premier tour : une aggro, un tank et un soutien de niveau 1, au lieu de la pioche. Ensuite, piochez selon le palier (départ, puis 9 · 15 · 21 de biomasse), déployez sur une case d'entrée en respectant le plafond par lane (2 / 3 / 4 / 5 selon le palier, +3 avec Essaim agrandi), ou investissez dans un nœud d'amélioration (rang 1 : 6, rang 2 : 12, payable en plusieurs fois) ; le reste va à la réserve. Puis chaque case avance en bloc d'<b>une case par tour</b>, sans diagonale (les plus proches de la fusée d'abord) ; au contact d'une tuile ou de la fusée, ses créatures attaquent aussitôt, dans l'ordre choisi ; si la tuile tombe alors qu'il reste des créatures à faire frapper, le bloc entre dans la case libérée s'il n'a pas encore bougé ce tour (une attaque contre la fusée tue un seul travailleur). Mobilité : les aggros avancent de 2 cases par tour ; l'Aura Mobilité du Glaneur donne +1 case aux autres créatures de sa case ; les plus rapides partent devant. Les soutiens avancent aussi mais n'attaquent jamais. Une tuile détruite ou un support qui tombe rapporte 1 biomasse.</p>
      <p><b>Colonie.</b> Lancez une tuile par chantier libre : le chantier appartient à une lane. Quand il est achevé, posez le bâtiment sur une case de cette lane qui touche une tuile, un support ou la fusée ; les créatures présentes reculent d'une case vers le fond. Répartissez vos travailleurs : les points d'une lane avancent son chantier, le reste va à la fusée (2 points par étage, puis 4, 6 et 8 après les paliers 3, 6 et 9 ; +1 travailleur par étage ; étage 3 : +2 technologies, 6 : 2ᵉ chantier par lane, 9 : nuke ; la main de tuiles gagne +1 à chaque palier : 4, 5, 6 puis 7).</p>
      <p><b>Combat.</b> Épines : dégâts à la créature qui attaque la tuile (Barbelés, Baraquement, Ligne de front, Réduit : 1 ; Haie d'épines, Mur hérissé, Ronceraie : 2) ; +1 par Avant-poste dans les 8 cases autour, cumulable. Renforcé X : 1 PV perdu par tranche complète de X dégâts d'une même attaque. Une aura ne profite qu'aux autres créatures de sa case (jamais à elle-même) et toutes les auras se cumulent. Les supports tirent à la toute fin du tour de la colonie (après la construction, l'apparition des nouveaux supports et la fusée) sur une créature des 8 cases qui les entourent (I : 1 dégât, +1 aux étages 3, 6 et 9 ; II : 2) et tombent quand tous leurs murs voisins ont disparu.</p>
      <p><b>Écrans de passage.</b> En partie locale, à chaque changement de camp, passez l'appareil : chaque joueur ne voit que sa main.</p>
      <p><b>En ligne.</b> Créez une partie et donnez le code (ou le lien) à votre adversaire. Chaque joueur ne reçoit que ce que son camp a le droit de voir. Vous pouvez recharger la page : la partie reprend.</p></div></div>`;
  }

  // ---------------------------------------------------------------- actions
  // Les actions de jeu passent toutes par SF.apply (moteur) : en local directement, en ligne via le serveur.
  function play(type, args, onOk) {
    if (online()) { send(type, args, onOk); return; }
    S.fx = [];
    const refused = SF.apply(S, who(), type, args || {});
    const events = S.fx; delete S.fx;
    if (!refused && onOk) onOk();
    if (!S.winner) setPhaseHandoff();
    save();
    if (S.winner) recordLocal();
    animate(events).then(() => { render(); afterRender(events); });
  }
  function handle(a, d) {
    if (a === "help") { UI.help = !UI.help; render(); return; }
    if (a === "reload") { location.reload(); return; }
    if (MODE === "stats") { statsAction(a, d); return; }
    if (a === "anim") { animOn = !animOn; try { localStorage.setItem(ANIM_KEY, animOn ? "1" : "0"); } catch (e) { /* rien */ } render(); return; }
    if (MODE === "home" || !S) { homeAction(a, d); return; }
    if (a === "home") { if (online()) return; MODE = "home"; render(); return; }
    if (a === "quit") { if (confirmQuit()) { setNet(null); MODE = "home"; S = null; UI = resetUI(); render(); } return; }
    if (a === "new") {
      if (online()) { if (S.winner) send("rematch", {}); return; }
      if (!S || S.winner || confirmNew()) { clearSave(); newGame(); } return;
    }
    if (a === "reveal") { if (online()) return; S.view = S.handoff; S.handoff = null; save(); render(); return; }
    if (S.winner) return;
    switch (a) {
      // choix locaux (sans effet sur la partie)
      case "card": UI.sel = UI.sel === Number(d.uid) ? null : Number(d.uid); break;
      case "creature": UI.selCreature = Number(d.id); break;
      case "tile": UI.sel = UI.sel === Number(d.i) ? null : Number(d.i); break;
      case "spell": UI.spell = Number(d.i); UI.picks = []; UI.recoHand = null; break;
      case "spellCancel": UI.spell = null; UI.picks = []; UI.recoHand = null; break;
      case "pick": if (UI.picks.length < 3) UI.picks.push(d.k); break;
      case "pickHand": { const i = Number(d.i); UI.picks = UI.picks.includes(i) ? UI.picks.filter(p => p !== i) : [...UI.picks, i]; break; }
      case "recoHand": UI.recoHand = Number(d.i); break;
      case "support": UI.support = UI.support === d.k ? null : d.k; break;
      case "act": { // une case (bloc) : choix de l'ordre si au moins 2 créatures attaquent
        const att = S.creatures.filter(c => SF.posKey(c) === d.k && !c.acted && SF.attacks(c));
        if (att.length >= 2) { UI.blk = d.k; UI.ord = []; break; }
        return play("act", { key: d.k });
      }
      case "ordPick": { const id = Number(d.id); UI.ord = UI.ord.includes(id) ? UI.ord.filter(x => x !== id) : [...UI.ord, id]; break; }
      case "ordCancel": UI.blk = null; UI.ord = []; break;
      case "ordGo": { const key = UI.blk, order = UI.ord; UI.blk = null; UI.ord = []; if (key) return play("act", { key, order }); break; }
      // actions de jeu
      case "famine": return play("famine", { play: d.v === "1" });
      case "draw": return play("draw");
      case "deployAt": {
        if (!UI.sel) break;
        // Sapeur : choisir d'abord le bâtiment de la lane à détruire
        if (cardOf(UI.sel).name === "Sapeur" && SF.laneTiles(S, d.l).length) { UI.sap = { uid: UI.sel, lane: d.l, u: Number(d.u) }; break; }
        return play("deploy", { uid: UI.sel, lane: d.l, u: Number(d.u) }, () => { UI.sel = null; });
      }
      case "sapTarget": { const sp = UI.sap; UI.sap = null; if (sp) return play("deploy", { uid: sp.uid, lane: sp.lane, u: sp.u, target: d.k }, () => { UI.sel = null; }); break; }
      case "sapCancel": UI.sap = null; break;
      case "frenzy": return play("frenzy", { src: Number(d.id), target: Number(d.v) });
      case "endDeploy": UI.sel = null; return play("endDeploy");
      case "invest": return play("invest", { t: d.t, s: d.s, n: Number(d.n) });
      case "toAttacks": return play("toAttacks");
      case "reactDone": UI.spell = null; return play("reactDone");
      case "actAll": return play("actAll");
      case "endA": return play("endA");
      case "startCh": if (UI.sel !== null) return play("startCh", { i: UI.sel, lane: d.l }, () => { UI.sel = null; }); break;
      case "placeAt": return play("placeAt", { k: d.k });
      case "cancelCh": return play("cancelCh", { lane: d.l, i: Number(d.i) });
      case "alloc": return play("alloc", { lane: d.l, d: Number(d.d) });
      case "spellArg": {
        const name = S.spells[UI.spell];

  function statsPage() {
    const head = `<div class="st-head"><h2>Statistiques des parties</h2><button data-a="statsBack" class="ghost">Retour</button></div>`;
    if (STATS.error) return `<section class="statpage">${head}<p>${E(STATS.error)}</p></section>`;
    if (!STATS.list) return `<section class="statpage">${head}<p>Chargement…</p></section>`;
    const list = shown(), rows = BILAN.byVersion(list);
    const nTest = STATS.list.filter(r => r.test).length;
    const table = rows.length ? `<div class="tbl"><table><thead><tr><th>Version</th><th>Parties</th><th>Essaim gagne</th><th>Colonie gagne</th><th>Manches</th><th>Biomasse finale</th><th>Travailleurs tués</th><th>Étages</th></tr></thead><tbody>${
      rows.map(r => `<tr class="${STATS.ver === r.version ? "sel" : ""}" data-a="statsVer" data-v="${E(r.version)}"><td><b>v${E(r.version)}</b></td><td>${r.n}</td><td>${pct(r.essaim, r.n)}</td><td>${pct(r.colonie, r.n)}</td><td>${avg(r.rounds)}</td><td>${avg(r.biomass)}</td><td>${avg(r.killed)}</td><td>${avg(r.floors)}</td></tr>`).join("")
    }</tbody></table></div><p class="small">Moyennes par partie. Touchez une version pour ne voir que ses parties.</p>` : `<p>Aucune partie terminée enregistrée pour l'instant.</p>`;
    const games = list.filter(r => !STATS.ver || r.version === STATS.ver).slice(0, 100);
    const card = r => `<div class="st-game"><div class="st-line"><b class="${r.winner}">${r.winner === "essaim" ? "Essaim" : "Colonie"}</b> · v${E(r.version)}${r.versionFin && r.versionFin !== r.version ? ` → v${E(r.versionFin)}` : ""} · ${E(r.mode)}${r.test ? " · test" : ""} · ${E(new Date(r.date).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }))}</div>
      <div class="st-line small">${r.rounds} manches · biomasse ${r.biomass} · ${r.killed} travailleur${r.killed > 1 ? "s" : ""} tué${r.killed > 1 ? "s" : ""} · fusée ${r.floors}/12</div>
      ${STATS.plans[r.id] ? `<img class="st-plan" alt="Plateau en fin de partie" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(STATS.plans[r.id])}">` : `<button data-a="statsPlan" data-id="${E(r.id)}" class="ghost">Voir le plateau final</button>`}</div>`;
    return `<section class="statpage">${head}
      <p class="small">Version actuelle : v${E(SF.VERSION)} · ${list.length} partie${list.length > 1 ? "s" : ""} terminée${list.length > 1 ? "s" : ""}${STATS.test ? "" : ` (hors ${nTest} partie${nTest > 1 ? "s" : ""} de test)`}.</p>
      <div class="home-acts"><button data-a="statsTest" aria-pressed="${STATS.test}">Parties de test : ${STATS.test ? "affichées" : "masquées"}</button><button data-a="statsCsv">Exporter en CSV</button></div>
      ${table}
      <h3>${STATS.ver ? `Parties de la v${E(STATS.ver)}` : "Dernières parties"}${STATS.ver ? ` <button data-a="statsVer" data-v="" class="ghost">Toutes les versions</button>` : ""}</h3>
      <div class="st-games">${games.map(card).join("") || "<p>Aucune partie.</p>"}</div></section>`;
  }
  const CSV_COLS = ["id", "date", "version", "versionFin", "mode", "test", "winner", "rounds", "biomass", "reserve", "killed", "workers", "floors", "creatures", "buildings", "barbed", "supports", "upgrades"];
  function statsAction(a, d) {
    if (a === "statsBack" || a === "home") { MODE = "home"; STATS = null; history.replaceState(null, "", location.pathname); render(); return; }
    if (a === "help") { return; }
    if (!STATS) return;
    if (a === "statsTest") STATS.test = !STATS.test;
    if (a === "statsVer") STATS.ver = d.v || null;
    if (a === "statsPlan") {
      fetch("/api/resultat?id=" + encodeURIComponent(d.id), { cache: "no-store" }).then(r => r.json()).then(j => { if (j.svg) { STATS.plans[d.id] = j.svg; render(); } }).catch(() => flash("Plateau indisponible."));
      return;
    }
    if (a === "statsCsv") {
      const cell = v => { const s = String(v === undefined || v === null ? "" : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const csv = [CSV_COLS.join(";"), ...shown().map(r => CSV_COLS.map(c => cell(r[c])).join(";"))].join("\n");
      const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a"); link.href = url; link.download = "swarm-steel-parties.csv"; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return;
    }
    render();
  }
  function receive(j) { // nouvel état envoyé par le serveur (vue filtrée pour notre camp)
    if (!j || !j.S) return;
    if (Number.isInteger(j.fxN)) NET.fx = j.fxN;
    const had = !!S, turnBefore = had && myTurn();
    if (j.S.winner !== (S && S.winner) || (S && S.round !== j.S.round)) UI = { ...resetUI(), help: UI.help };
    S = j.S; NET.v = j.v; NET.full = j.players.essaim && j.players.colonie;
    if (!turnBefore && myTurn()) { UI = { ...resetUI(), help: UI.help, selCreature: UI.selCreature }; NET.banner = had; }
  }
  // animations des événements reçus (sur l'ancien plateau), puis nouvel état
  async function show(j, onOk) {
    await animate(j.fx || []);
    receive(j);
    if (j.ok && onOk) onOk(); // ex. désélectionner la carte jouée, avant de redessiner
    render(); afterRender(j.fx || []);
    if (NET.banner) { NET.banner = false; banner(`À vous de jouer · ${PHASE_TXT[S.phase][1]}`); }
  }
  async function withBusy(f) {
    if (busy) return; busy = true; document.body.dataset.busy = "1";
    try { await f(); } catch (e) { flash(e.message); } finally { busy = false; document.body.dataset.busy = "0"; render(); }
  }
  function createOnline(side) {
    withBusy(async () => {
      const j = await api("create", { side, test: TEST });
      setNet({ code: j.code, token: j.token, side: j.side }); MODE = "online"; UI = resetUI(); receive(j);
      history.replaceState(null, "", location.pathname);
    });
  }
  function joinOnline(code) {
    withBusy(async () => {
      const j = await api("join", { code });
      setNet({ code: j.code, token: j.token, side: j.side }); MODE = "online"; UI = resetUI(); receive(j);
      history.replaceState(null, "", location.pathname);
    });
  }
  function send(type, args, onOk) {
    withBusy(async () => {
      const j = await api("action", { code: NET.code, token: NET.token, type, args: args || {}, f: NET.fx });
      await show(j, onOk);
      if (!j.ok) flash(j.error || "Action refusée.");
    });
  }
  async function poll() {
    if (!online() || busy || document.visibilityState === "hidden") return;
    if (NET.full && myTurn()) return; // c'est notre tour : rien ne peut changer sans nous
    try {
      const j = await api(`state?code=${encodeURIComponent(NET.code)}&token=${encodeURIComponent(NET.token)}&v=${NET.v || 0}&f=${NET.fx || 0}`);
      if (busy || !online() || j.same) return;
      busy = true; document.body.dataset.busy = "1";
      try { await show(j); } finally { busy = false; document.body.dataset.busy = "0"; }
    } catch (e) { /* réseau momentanément indisponible : on réessaiera */ }
  }
  function resumeOnline(n) {
    NET = { ...n, v: 0, full: false }; MODE = "online";
    withBusy(async () => {
      try { const j = await api(`state?code=${encodeURIComponent(n.code)}&token=${encodeURIComponent(n.token)}&v=0`); receive(j); }
      catch (e) { setNet(null); MODE = "home"; S = null; throw new Error("Impossible de reprendre la partie en ligne : " + e.message); }
    });
  }
  setInterval(poll, POLL_MS);

  function confirmNew() { return UI.confirm ? true : (UI.confirm = true, setTimeout(() => { UI.confirm = false; }, 4000), flash("Touchez encore « Nouvelle partie » pour confirmer."), false); }
  function flash(msg) { const f = $("#flash"); f.textContent = msg; f.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(() => { f.hidden = true; }, 3500); }

  document.addEventListener("click", e => {
    if (FX.playing) { FX.skip = true; return; } // un toucher pendant une animation la termine
    const el = e.target.closest("[data-a]");
    if (!el || el.disabled) return;
    handle(el.dataset.a, el.dataset);
  });
  function upgradeSave(t) { SF.migrate(t); t.invest = t.invest || {}; t.toPlace = t.toPlace || []; for (const x of Object.values(t.tiles || {})) if (SF.TILES[x.name] && SF.TILES[x.name].camo && x.camo === undefined) x.camo = 1; return t; }
  // démarrage : partie en ligne en cours, sinon partie locale sauvegardée, sinon accueil
  // (un lien d'invitation « ?code=… » ouvre toujours l'accueil, code prérempli)
  let net0 = null; try { net0 = JSON.parse(localStorage.getItem(NET_KEY) || "null"); } catch (e) { /* rien */ }
  const saved = load();
  const invite = new URLSearchParams(location.search).get("code");
  if (new URLSearchParams(location.search).has("stats") && HTTP) openStats(); // lien direct vers les statistiques
  else if (net0 && net0.code && net0.token && (!invite || invite.toUpperCase() === net0.code)) resumeOnline(net0);
  else if (!invite && saved && saved.phase) { S = upgradeSave(saved); MODE = "local"; render(); if (S.winner) recordLocal(); }
  else render();
  checkVersion();
})();
</script>
</body></html>
