<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm &amp; Steel</title>
<script>(function(){var r=document.documentElement;try{var t=localStorage.getItem("swarm-steel-theme");r.dataset.theme=(t==="light"||t==="auto")?t:"dark";if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)r.classList.add("sys-dark")}catch(e){r.dataset.theme="dark"}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>/* Table de jeu : plateau central entre le camp de la colonie (gauche) et celui de l'essaim (droite) */
:root {
  --bg: #e9ecea; --panel: #ffffff; --panel-2: #f4f6f5; --ink: #1b1f1d; --ink-soft: #5b6560; --rule: #d3d9d6;
  --aggro: #b0372b; --tank: #2c5b8a; --soutien: #6b4c97;
  --wall: #9c6a32; --wall-bg: #f3e7d6; --support: #1e7469; --support-bg: #d8ece8;
  --off: #c4611d; --sup: #3a7a4a;
  --north: #2563a8; --east: #2f8a55; --south: #c98a12; --west: #a03d8a;
  --colonie: #1e7469; --essaim: #6b4c97; --hot: #e2a400; --danger: #b0372b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cell: min(96px, calc((100vw - 52px) / 9)); /* plateau agrandi pour les illustrations (Oni, 04/11/2026 ; avant 64 px) */
}
/* Thème sombre (Oni, 04/11/2026) : charbon, braises et rouille, dans l'esprit des illustrations. Choisi par le bouton
   « Thème » (data-theme sur <html>, par défaut sombre) ; « auto » suit le réglage du système. */
:root[data-theme="dark"], :root[data-theme="auto"].sys-dark {
  --bg: #100e0d; --panel: #1b1816; --panel-2: #241f1c; --ink: #ece4da; --ink-soft: #a89b8e; --rule: #3a322c;
  --aggro: #d2533f; --tank: #4f8fd6; --soutien: #a07ad6;
  --wall: #c98d4e; --wall-bg: #3a2a1c; --support: #2f8f80; --support-bg: #17302c;
  --off: #e07a35; --sup: #57a368;
  --north: #4a86d0; --east: #46a96f; --south: #d9a12e; --west: #c25fab;
  --colonie: #4fb8a6; --essaim: #a77fd9; --hot: #f0a43a; --danger: #e0533f;
  color-scheme: dark;
}
:root[data-theme="dark"] body, :root[data-theme="auto"].sys-dark body {
  background: radial-gradient(ellipse 90% 60% at 50% -10%, rgba(240,120,40,.10), transparent 60%),
              radial-gradient(ellipse 60% 50% at 100% 100%, rgba(167,127,217,.07), transparent 70%), var(--bg);
  background-attachment: fixed;
}
:root[data-theme="dark"] .panel, :root[data-theme="dark"] .phase, :root[data-theme="dark"] .detail, :root[data-theme="dark"] .ho-card,
:root[data-theme="auto"].sys-dark .panel, :root[data-theme="auto"].sys-dark .phase, :root[data-theme="auto"].sys-dark .detail, :root[data-theme="auto"].sys-dark .ho-card {
  box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .board, :root[data-theme="auto"].sys-dark .board { border-color: #2b2420; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
:root[data-theme="dark"] .fl.on, :root[data-theme="auto"].sys-dark .fl.on { box-shadow: 0 0 8px rgba(79,184,166,.35); }
:root[data-theme="dark"] button.primary, :root[data-theme="auto"].sys-dark button.primary { background: var(--hot); color: #1b120a; border-color: var(--hot); }
:root[data-theme="dark"] .home-acts button.primary, :root[data-theme="auto"].sys-dark .home-acts button.primary { background: var(--hot); color: #1b120a; border-color: var(--hot); }
:root[data-theme="dark"] .cell.core:not(.im), :root[data-theme="auto"].sys-dark .cell.core:not(.im) { background: #2a2420; } /* sans écraser l'illustration de la fusée */
:root[data-theme="dark"] [data-tip]::after, :root[data-theme="auto"].sys-dark [data-tip]::after { background: #f1e9de; color: #1b1612; }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.45;
  padding-block: 0 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.i { width: 1.05em; height: 1.05em; vertical-align: -.16em; flex: none; }
.i.big { width: 44px; height: 44px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand b { font: 700 1.5rem/1 var(--display); letter-spacing: .01em; }
.brand span { color: var(--ink-soft); font-size: 1rem; }
.round { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.1rem; }
.round b { font-size: 1.3rem; }
.menu { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--ink-soft); }
.dot.colonie { background: var(--colonie); } .dot.essaim { background: var(--essaim); }

button.primary, button.ghost, .acts button, .choices button, .step button { border: 1px solid var(--rule); background: var(--panel); padding: 7px 12px; border-radius: 6px; }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
.choices button.on { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }

.layout { display: grid; grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; min-width: 0; }
.panel.colonie { border-top: 4px solid var(--colonie); } .panel.essaim { border-top: 4px solid var(--essaim); }
.panel h3 { margin: 0 0 10px; font: 700 1.25rem/1 var(--display); display: flex; align-items: center; gap: 6px; }
.panel h4 { margin: 14px 0 6px; font: 600 1rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--rule); font-variant-numeric: tabular-nums; }
.kv span { color: var(--ink-soft); } .kv b { text-align: right; }
.small { font-size: 1rem; color: var(--ink-soft); margin: 4px 0 0; }
.muted { color: var(--ink-soft); }
.floors { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 10px; }
.fl { font: 600 1rem/1 var(--display); font-style: normal; text-align: center; padding: 5px 0; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-soft); }
.fl.ms { border-color: var(--colonie); }
.fl.on { background: var(--colonie); color: #fff; border-color: var(--colonie); }
.atelier { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px dotted var(--rule); }
.atelier .al { font: 700 1rem/1 var(--display); color: #fff; text-align: center; padding: 5px 0; border-radius: 4px; }
.atelier.lane-N .al { background: var(--north); } .atelier.lane-E .al { background: var(--east); } .atelier.lane-S .al { background: var(--south); } .atelier.lane-O .al { background: var(--west); }
.slots { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.slot { font-size: 1rem; padding: 2px 6px; border-radius: 4px; background: var(--wall-bg); }
.slot.empty { background: transparent; border: 1px dashed var(--rule); color: var(--ink-soft); }
.slot .x { border: 0; background: none; padding: 0 4px; font-weight: 700; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { padding: 2px 9px; }
.step b, .pts { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; }
.hand { display: flex; flex-direction: column; gap: 5px; }
.tcard, .ccard { text-align: left; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.tcard { border-left: 4px solid var(--wall); }
.tcard small, .ccard small { color: var(--ink-soft); font-size: 1rem; }
.tcard.sel, .ccard.sel { outline: 2px solid var(--hot); outline-offset: 1px; }
.ccard { position: relative; padding-left: 40px; border-left: 4px solid var(--c); }
.ccard.aggro { --c: var(--aggro); } .ccard.tank { --c: var(--tank); } .ccard.soutien { --c: var(--soutien); }
.ccard .cost { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 1rem/1 var(--display); }
.hidden-hand { color: var(--ink-soft); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 1rem; padding: 2px 8px; border-radius: 99px; color: #fff; }
.chip.off { background: var(--off); } .chip.sup { background: var(--sup); }
.tree { border: 1px solid var(--rule); border-radius: 6px; padding: 6px; margin-bottom: 6px; display: grid; gap: 4px; }
.tree .tt { font: 600 1rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
.tree.aggro .tt { color: var(--aggro); } .tree.tank .tt { color: var(--tank); } .tree.soutien .tt { color: var(--soutien); }
.tree .r { display: flex; gap: 4px; }
.tree .node { flex: 1; min-width: 0; font-size: 1rem; padding: 4px 3px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel-2); }
.tree .node.taken { background: var(--essaim); color: #fff; border-color: var(--essaim); opacity: 1; }
.log { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; font-size: 1rem; }
.log li { padding: 3px 0; border-bottom: 1px dotted var(--rule); }
.log li span { font: 600 1rem/1 var(--display); color: var(--ink-soft); margin-right: 6px; }
.log li.colonie { color: var(--colonie); } .log li.essaim { color: var(--essaim); }

.center { display: flex; flex-direction: column; gap: 12px; min-width: 0; align-items: center; }
.phase { width: 100%; max-width: calc(var(--cell) * 9 + 16px); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-left: 5px solid var(--ink-soft); border-radius: 10px; padding: 10px 14px; }
.phase.colonie { border-left-color: var(--colonie); } .phase.essaim { border-left-color: var(--essaim); }
.ph-head { display: flex; align-items: center; gap: 8px; } .ph-head b { font: 700 1.15rem/1 var(--display); }
.ph-head .side { margin-left: auto; color: var(--ink-soft); font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; }
.ph-txt { margin: 4px 0 6px; color: var(--ink-soft); font-size: 1rem; }
.hint { margin: 6px 0; font-size: 1rem; }
.acts, .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.choices .lab { font-size: 1rem; color: var(--ink-soft); }
.spells { display: flex; flex-direction: column; gap: 5px; }
.spell { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 6px; background: var(--panel-2); padding: 6px 8px; }
.spell.off { --c: var(--off); } .spell.sup { --c: var(--sup); }
.spell .i { width: 22px; height: 22px; color: var(--c); }
.spell span { display: flex; flex-direction: column; } .spell small { color: var(--ink-soft); }

.board-wrap { overflow-x: auto; max-width: 100%; }
.board { display: grid; grid-template-columns: repeat(9, var(--cell)); grid-auto-rows: var(--cell); gap: 2px; padding: 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.cell { position: relative; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 1rem; }
.cell.void { background: transparent; }
.cell.entry { background: transparent; border: 1px dashed var(--rule); }
.cell.entry .col { position: absolute; top: 2px; left: 4px; font: 600 1rem/1 var(--display); color: var(--ink-soft); }
.cell.lane { background: color-mix(in srgb, var(--lc) 13%, var(--panel)); }
.cell.lane.r1 { background: color-mix(in srgb, var(--lc) 22%, var(--panel)); }
.lane-N { --lc: var(--north); } .lane-E { --lc: var(--east); } .lane-S { --lc: var(--south); } .lane-O { --lc: var(--west); }
.cell.stase { box-shadow: inset 0 0 0 3px #7fb6d9; }
.cell.core { background: var(--ink); color: var(--panel); flex-direction: column; gap: 1px; }
.cell.core .i { width: 22px; height: 22px; } .cell.core b { font: 700 1rem/1 var(--display); } .cell.core small { font-size: 1rem; opacity: .8; }
.cell.corner { background: var(--panel-2); color: var(--ink-soft); }
.cell.sup { background: var(--support); color: #fff; flex-direction: column; gap: 1px; }
.cell.sup .i { width: 20px; height: 20px; } .cell.sup b { font: 700 1rem/1 var(--display); }
.cell.sup.spent { opacity: .55; }
.cell .lv { position: absolute; top: 2px; left: 4px; font: 700 1rem/1 var(--display); }
.cell.hot { box-shadow: inset 0 0 0 3px var(--hot); cursor: pointer; }
.cell.sel { box-shadow: inset 0 0 0 3px var(--ink); }
.tile { position: absolute; inset: 3px; border-radius: 3px; background: var(--wall-bg); border: 1.5px solid var(--wall); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); }
.tile .tn { font: 600 1rem/1 var(--display); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.tile .hp { font: 700 1rem/1 var(--display); color: var(--wall); } .tile .hp small { font-size: 1rem; color: var(--ink-soft); }
.tile .tb { display: flex; align-items: center; gap: 1px; font: 600 1rem/1 var(--display); color: var(--wall); }
.tile .tb .i { width: 9px; height: 9px; }
.tile.hidden { background: repeating-linear-gradient(45deg, var(--wall) 0 4px, color-mix(in srgb, var(--wall) 75%, #000) 4px 8px); color: #fff; border-color: var(--wall); }
.tile.hidden b { font: 700 18px/1 var(--display); } .tile.hidden small { font-size: 1rem; }
.tile.trap { border-style: dashed; }
.cghost { position: absolute; inset: 4px; border: 1.5px dashed var(--wall); border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--wall); font: 600 1rem/1.1 var(--display); text-align: center; }
.cghost .i { width: 13px; height: 13px; }
.toks { position: absolute; inset: auto 2px 2px 2px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; z-index: 1; }
.tok { width: calc(var(--cell) / 2.6); height: calc(var(--cell) / 3.4); min-width: 20px; min-height: 16px; border: 0; border-radius: 4px; padding: 0 2px; display: flex; justify-content: space-between; align-items: center; color: #fff; font: 700 1rem/1 var(--display); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tok.aggro { background: var(--aggro); } .tok.tank { background: var(--tank); } .tok.soutien { background: var(--soutien); }
.tok.sel { outline: 2px solid var(--hot); } .tok.done { opacity: .5; } .tok.new { box-shadow: 0 0 0 1.5px #fff, 0 1px 2px rgba(0,0,0,.35); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: 1rem; color: var(--ink-soft); margin-top: 6px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--lc); margin-right: 4px; vertical-align: -1px; }
.detail { width: 100%; max-width: calc(var(--cell) * 9 + 16px); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; font-size: 1rem; }
.detail.empty { color: var(--ink-soft); text-align: center; background: transparent; border-style: dashed; margin: 0; }
.detail.aggro { border-top: 4px solid var(--aggro); } .detail.tank { border-top: 4px solid var(--tank); } .detail.soutien { border-top: 4px solid var(--soutien); }
.d-head { display: flex; align-items: center; gap: 6px; } .d-head b { font: 700 1.1rem/1 var(--display); } .d-head span { color: var(--ink-soft); font-size: 1rem; }
.detail p { margin: 5px 0; }

.handoff { display: flex; justify-content: center; padding: 40px 0; }
.ho-card { background: var(--panel); border: 1px solid var(--rule); border-top: 6px solid var(--c); border-radius: 12px; padding: 28px 30px; max-width: 420px; text-align: center; }
.handoff.essaim { --c: var(--essaim); } .handoff.colonie { --c: var(--colonie); }
.ho-card .i.big { color: var(--c); }
.ho-card h2 { margin: 6px 0 8px; font: 700 2rem/1.05 var(--display); text-wrap: balance; }
.ho-k { margin: 8px 0 0; font: 600 1rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.ho-card p { color: var(--ink-soft); }
.banner.win { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 10px; color: #fff; margin-bottom: 14px; font-size: 1.05rem; }
.banner.win.essaim { background: var(--essaim); } .banner.win.colonie { background: var(--colonie); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-card { position: relative; background: var(--panel); border-radius: 12px; padding: 22px 24px; max-width: 640px; max-height: 85vh; overflow-y: auto; }
.modal-card h2 { margin: 0 0 8px; font: 700 1.6rem/1 var(--display); }
.modal-card .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 1.4rem; }
#flash { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; z-index: 30; font-size: 1rem; max-width: calc(100vw - 32px); }

@media (max-width: 1180px) {
  .layout { grid-template-columns: 1fr 1fr; }
  .center { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 680px) {
  .layout { grid-template-columns: 1fr; }
  .menu { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.capline { display: flex; gap: 6px; align-items: flex-start; font-size: 1rem; line-height: 1.35; margin-top: 3px; color: var(--ink); }
.capline .i { width: 16px; height: 16px; color: var(--soutien); margin-top: 1px; }
.capline b { color: var(--soutien); font-weight: 600; }

.ccard:disabled { opacity: 1; cursor: default; }
.ccard .stats { font-size: 1rem; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ccard .stats em { color: var(--ink-soft); font-style: normal; font-size: 1rem; }
.capline.none { color: var(--ink-soft); font-style: italic; }
.upline { display: flex; gap: 6px; align-items: flex-start; font-size: 1rem; line-height: 1.3; color: var(--ink-soft); }
.upline .i { width: 14px; height: 14px; color: var(--essaim); margin-top: 1px; }
.tree .rk { font-size: 1rem; color: var(--ink-soft); margin-top: 2px; }
.tree .r { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tree .r.r3 { grid-template-columns: 1fr; }
.tree .node { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 6px 7px; font-size: 1rem; opacity: 1; cursor: default; }
.tree .node .np { font: 600 1rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tree .node b { font-size: 1rem; }
.tree .node .nt { line-height: 1.3; }
.tree .node .ns { font: 600 1rem/1.2 var(--display); letter-spacing: .04em; color: var(--ink-soft); margin-top: 2px; }
.tree .node.can { border-color: var(--essaim); box-shadow: inset 0 0 0 1px var(--essaim); }
.tree .node.can .ns { color: var(--essaim); }
.tree .node.taken .np, .tree .node.taken .ns, .tree .node.taken .nt { color: rgba(255,255,255,.88); }
.tree .node.closed { opacity: .55; }

.tree .node.closed, .tree .node.needR1 { opacity: .55; }
.tree .node .bar { display: block; height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 3px; }
.tree .node .bar i { display: block; height: 100%; background: var(--essaim); }
.tree .node .inv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tree .node .inv button { border: 1px solid var(--essaim); color: var(--essaim); background: var(--panel); border-radius: 4px; padding: 3px 8px; font-size: 1rem; font-weight: 600; }
.tree .node.taken .bar { display: none; }
.cell.hot .toks, .cell.mv .toks, .cell.atk .toks { pointer-events: none; } /* une case où l'on peut agir reçoit le clic, même couverte de créatures (Oni, 06/11/2026) */
.cghost:has(+ .toks) { justify-content: flex-start; padding-top: 2px; }
.cghost:has(+ .toks) .i { width: 10px; height: 10px; }
.tcard .capline .i { color: var(--wall); } .tcard .capline b { color: var(--wall); }
.tcard:disabled { opacity: 1; cursor: default; }
.slot.go { display: block; width: 100%; text-align: left; border: 1px solid var(--hot); background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 600; }

/* accueil et jeu en ligne */

  margin: 0; padding: 0; height: 100vh; overflow: hidden; font-size: 1rem;
}

  box-shadow: 0 10px 30px rgba(0,0,0,.45); transform: translateY(calc(-100% - 4px)); transition: transform .18s ease-out; }

body.pc .pc-layout.me-essaim { grid-template-columns: minmax(var(--side-sum), 1fr) auto minmax(var(--side-own), 1.6fr); }

body.pc .panel { height: 100%; box-sizing: border-box; min-height: 0; display: flex; flex-direction: column; padding: 12px; overflow: visible; }
body.pc .panel.colonie { border-top: 0; border-left: 4px solid var(--colonie); }
body.pc .panel.essaim { border-top: 0; border-right: 4px solid var(--essaim); }
body.pc .po-main, body.pc .ps-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
body.pc .panel h4 { margin: 12px 0 6px; font-size: 1rem; }

/* fusée horizontale : étage 1 à gauche ; 6 × 2 dans le résumé étroit */
.pc-rocket { margin-top: 10px; }
.pc-rocket .rk-lab { display: flex; align-items: center; gap: 4px; font: 600 1rem/1 var(--body); color: var(--ink-soft); margin-bottom: 5px; }
.pc-rocket .rk-lab .i { width: 15px; height: 15px; color: var(--colonie); } .pc-rocket .rk-lab b { color: var(--ink); font-size: 1rem; }
.floors.h { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 0; }
.pc-rocket.grid .floors.h { grid-template-columns: repeat(6, 1fr); }
.floors.h .fl { font: 700 1rem/1 var(--body); padding: 7px 0; border-radius: 4px; cursor: help; position: relative; }
.floors.h .fl.ms { border-width: 2px; }
.floors.h .fl.cur { background: linear-gradient(to right, color-mix(in srgb, var(--colonie) 45%, transparent) var(--p), transparent var(--p)); color: var(--ink); }

/* en-têtes : logo, nom, gros chiffre */
.po-head { display: flex; align-items: center; gap: 8px; }
.po-head .logo { width: 30px; height: 30px; }
.panel.essaim .po-head .logo { color: var(--essaim); } .panel.colonie .po-head .logo { color: var(--colonie); }
.po-head .nm { font: 700 1.5rem/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.pc-big { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; cursor: help; }
.pc-big b { font: 700 2.6rem/.9 var(--display); font-variant-numeric: tabular-nums; }
.pc-big b small { font-size: 1.1rem; color: var(--ink-soft); margin-left: 2px; }
.pc-big span { font: 600 1rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.pc-big.bio b { color: var(--essaim); } .pc-big.wk b { color: var(--colonie); }
.pc-sum .pc-big { margin: 4px 0 6px; align-items: flex-start; }
.pc-sum .pc-big b { font-size: 3rem; }
.pc-boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; margin-top: 10px; }
.pc-box { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); cursor: help; min-width: 0; }
.pc-box b { font: 700 1.35rem/1 var(--display); } .pc-box b small { font-size: 1rem; color: var(--ink-soft); }
.pc-box span { font: 600 1rem/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }
.pc-lines { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; font-size: 1rem; color: var(--ink-soft); }
.pc-lines span { display: flex; justify-content: space-between; gap: 8px; } .pc-lines b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ps-rows { display: flex; flex-direction: column; gap: 4px; }
.ps-rows > span { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--rule); font-size: 1rem; color: var(--ink-soft); cursor: help; }
.ps-rows .i { width: 16px; height: 16px; } .ps-rows b { font: 700 1.1rem/1 var(--display); color: var(--ink); }
.pc-sum h3 { margin: 0 0 4px; }

/* ateliers : blocs jaunes, une ligne par lane, 2 emplacements */
.pc-ateliers { display: flex; flex-direction: column; gap: 5px; }
.pc-ateliers .atelier { grid-template-columns: 26px 1fr auto; gap: 6px; padding: 0; border: 0; }
.pc-ateliers.sum .atelier { grid-template-columns: 22px 1fr; }
.pc-ateliers .atelier .al { padding: 0; height: 100%; display: flex; align-items: center; justify-content: center; min-height: 34px; }
.pc-ateliers .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.pc-ateliers .slots:has(.lock) { grid-template-columns: 1fr 30px; }
.pc-ateliers .slot { min-height: 34px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 3px 7px; border-radius: 6px;
  background: linear-gradient(#f0c24a, #d9a12e); color: #2a1d06; font-weight: 600; font-size: 1rem; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); min-width: 0; }
.pc-ateliers .slot .sn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pc-ateliers .slot b { font: 700 1.05rem/1 var(--display); }
.pc-ateliers .slot.empty { background: transparent; color: var(--ink-soft); border: 1.5px dashed color-mix(in srgb, #d9a12e 55%, var(--rule)); box-shadow: none; justify-content: center; font-weight: 500; }
.pc-ateliers .slot.lock { opacity: .45; border-style: dotted; font-size: 1rem; gap: 1px; padding: 0; }
.pc-ateliers .slot.lock .i { width: 11px; height: 11px; }
.pc-ateliers .slot.go { flex-direction: column; justify-content: center; gap: 0; border: 1.5px solid var(--hot); background: color-mix(in srgb, var(--hot) 18%, var(--panel)); color: var(--ink); font-weight: 700; line-height: 1.1; padding: 2px 4px; }
.pc-ateliers .slot.go small { font-size: 1rem; font-weight: 500; color: var(--ink-soft); }
.pc-ateliers .slot .x { color: #2a1d06; }
.pc-ateliers .step { gap: 2px; } .pc-ateliers .step button { padding: 3px 7px; } .pc-ateliers .step b { min-width: 1.2em; }

/* étapes du tour en chevrons ; l'étape en cours a un halo et clignote doucement */
.pc-steps { margin: 12px 0 8px; }
.chev { display: flex; list-style: none; margin: 0; padding: 0; gap: 0; }
.chev li { flex: 1; min-width: 0; position: relative; height: 30px; display: flex; align-items: center; justify-content: center; margin-right: -6px;
  background: var(--panel-2); color: var(--ink-soft); clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%, 9px 50%);
  font: 600 1rem/1 var(--display); letter-spacing: .01em; }
.chev li:first-child { clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); }
.chev li span { padding: 0 6px 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev li.done { background: color-mix(in srgb, var(--c) 30%, var(--panel-2)); color: var(--ink); }
.chev li.on { flex: 1.5; background: var(--c); color: #fff; animation: stepGlow 2.6s ease-in-out infinite; }
.pc-steps.essaim { --c: var(--essaim); } .pc-steps.colonie { --c: var(--colonie); }
.pc-steps:has(li.on) { filter: drop-shadow(0 0 0 transparent); animation: stepHalo 2.6s ease-in-out infinite; }
.pc-steps.idle { opacity: .55; } .pc-steps .small { margin-top: 5px; }
@keyframes stepGlow { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
@keyframes stepHalo { 0%, 100% { filter: drop-shadow(0 0 2px color-mix(in srgb, var(--c) 60%, transparent)); } 50% { filter: drop-shadow(0 0 9px var(--c)); } }

/* zone de choix défilante (la page, elle, ne défile jamais) et boutons d'action en bas */
.po-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px 8px; scrollbar-width: thin; }
.po-scroll > h4:first-child { margin-top: 0; }
body.pc .po-scroll .phase { max-width: none; margin: 0 0 4px; padding: 9px 11px; border-left-width: 4px; box-shadow: none; background: var(--panel-2); }
body.pc .po-scroll .ph-txt { font-size: 1rem; }
body.pc .po-scroll .detail { max-width: none; margin-top: 8px; box-shadow: none; background: var(--panel-2); }
body.pc .po-scroll .log { max-height: none; }
.po-acts { flex: none; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin: 8px 0 0; padding-top: 10px; border-top: 1px solid var(--rule); }
.po-acts button { padding: 9px 14px; }
.po-acts button.primary { font: 700 1rem/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 11px 18px; box-shadow: 0 0 14px color-mix(in srgb, var(--hot) 45%, transparent); }

/* améliorations de l'essaim en grosses icônes (résumé vu par la colonie) */
.utrees.big { gap: 10px; }
.utrees.big .utree { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 6px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--rule); }
.utrees.big .ut { width: auto; justify-content: flex-start; gap: 5px; font: 600 1rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.utrees.big .ut .i { width: 15px; height: 15px; }
.utrees.big .ur { display: flex; gap: 5px; } .utrees.big .ur > * { flex: 1; }
.utrees.big .node.un { width: auto; height: 40px; border-radius: 9px; }
.utrees.big .node.un .i { width: 24px; height: 24px; }
.pc-sum.essaim [data-tip]:hover::after, .pc-sum.essaim [data-tip]:focus::after { left: auto; right: calc(100% + 8px); }
.pc-own.essaim .po-head [data-tip]:hover::after, .pc-own.essaim .pc-boxes [data-tip]:hover::after, .pc-own.essaim .pc-boxes [data-tip]:focus::after { left: auto; right: calc(100% + 8px); }

/* plateau : toute la hauteur ; manche et camp qui joue dans les angles morts du haut */
body.pc .pc-center { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
body.pc .board-wrap { position: relative; overflow: visible; }
body.pc .legend { display: none; }
body.pc .board { padding: 8px; border-radius: 14px; }
.pc-corner { position: absolute; top: 9px; width: calc(var(--cell) * 2 + 2px); height: var(--cell); box-sizing: border-box; padding: 6px 10px; border-radius: 10px;
  display: flex; flex-direction: column; justify-content: center; gap: 3px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); box-shadow: 0 6px 18px rgba(0,0,0,.35); z-index: 2; }
.pc-corner.l { left: 9px; } .pc-corner.r { right: 9px; text-align: right; align-items: flex-end; }
.pc-corner .k { font: 600 1rem/1.1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.pc-corner.round b { font: 700 max(1rem, calc(var(--cell) * .5))/1 var(--display); }
.pc-corner.turn b { font: 700 max(1rem, calc(var(--cell) * .2))/1.05 var(--display); }
.pc-corner.turn.essaim { border-color: var(--essaim); box-shadow: 0 0 16px color-mix(in srgb, var(--essaim) 45%, transparent); } .pc-corner.turn.essaim b { color: var(--essaim); }
.pc-corner.turn.colonie { border-color: var(--colonie); box-shadow: 0 0 16px color-mix(in srgb, var(--colonie) 45%, transparent); } .pc-corner.turn.colonie b { color: var(--colonie); }
body.pc .board-wrap > .banner.win { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; margin: 0; padding: 18px 24px; font-size: 1.2rem; box-shadow: 0 14px 40px rgba(0,0,0,.6); }

/* cases : textes plus gros, lisibles d'un coup d'œil */
body.pc .cell.entry .col { font-size: max(1rem, calc(var(--cell) * .13)); top: 3px; left: 5px; }
body.pc .cell .lv { font-size: max(1rem, calc(var(--cell) * .13)); top: 3px; left: 5px; }
body.pc .cell.sup .i { width: calc(var(--cell) * .3); height: calc(var(--cell) * .3); } body.pc .cell.sup b { font-size: max(1rem, calc(var(--cell) * .2)); }
body.pc .cell.core b { font-size: max(1rem, calc(var(--cell) * .2)); } body.pc .cell.core small { font-size: max(1rem, calc(var(--cell) * .12)); }
body.pc .tile .tn { font-size: max(1rem, calc(var(--cell) * .15)); font-weight: 700; }
body.pc .tile .hp { font-size: max(18px, calc(var(--cell) * .3)); } body.pc .tile .hp small { font-size: max(1rem, calc(var(--cell) * .14)); }
body.pc .tile .tb { font-size: max(1rem, calc(var(--cell) * .14)); gap: 3px; }
body.pc .tile .tb .i { width: max(11px, calc(var(--cell) * .14)); height: max(11px, calc(var(--cell) * .14)); }
body.pc .tile.hidden b { font-size: max(1rem, calc(var(--cell) * .38)); } body.pc .tile.hidden small { font-size: max(1rem, calc(var(--cell) * .12)); }
/* portée des tourelles : petit repère dans le coin des cases visées */
body.pc .rng { display: flex; align-items: center; gap: 1px; position: absolute; right: 3px; top: 3px; z-index: 1; padding: 1px 3px; border-radius: 5px;
  background: color-mix(in srgb, var(--support) 80%, transparent); color: #fff; font: 700 1rem/1 var(--display); pointer-events: none; }
body.pc .rng .i { width: max(11px, calc(var(--cell) * .14)); height: max(11px, calc(var(--cell) * .14)); }
:root[data-theme="dark"] body.pc .rng, :root[data-theme="auto"].sys-dark body.pc .rng { background: rgba(20,70,63,.85); box-shadow: 0 0 0 1px #5fd4c0; }
/* jetons de créature : carrés, ils remplissent la case et rétrécissent avec le nombre */
body.pc .toks { inset: 3px; display: grid; grid-template-columns: repeat(var(--n), 1fr); align-content: center; justify-items: stretch; gap: 3px; }
body.pc .tok { width: 100%; height: auto; aspect-ratio: 1; min-width: 0; min-height: 0; padding: 0 4px 3px; border-radius: 6px; align-items: flex-end;
  font: 800 max(1rem, calc(var(--cell) / var(--n) * .3))/1 var(--body); }
body.pc .tok .ta, body.pc .tok .tp { text-shadow: 0 0 3px #000, 0 1px 2px #000; }
body.pc .tok .ta { color: #ffd2c4; } body.pc .tok .tp { color: #fff; }
body.pc .tok .au { display: flex; align-self: flex-end; margin-bottom: 1px; padding: 2px; border-radius: 50%; }
body.pc .tok .au .i { width: max(10px, calc(var(--cell) / var(--n) * .24)); height: max(10px, calc(var(--cell) / var(--n) * .24)); stroke-width: 2.6; }
body.pc .tok .au.give { color: #fff; background: rgba(0,0,0,.55); box-shadow: 0 0 0 1.5px #fff; }
body.pc .tok .au.get { color: #d9b8ff; background: rgba(40,10,70,.75); box-shadow: 0 0 0 1.5px #b383f0, 0 0 6px #b383f0; }
body.pc .tok.im { box-shadow: inset 0 0 0 max(2px, calc(var(--cell) / var(--n) * .04)) var(--tc), 0 2px 5px rgba(0,0,0,.5); }

/* écran de passage : la partie en fond, assombrie (plus fort au centre, derrière la carte) */
.pc-bg { position: fixed; inset: 0; filter: blur(2px) saturate(.7); pointer-events: none; }
.pc-ho { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: radial-gradient(ellipse 48% 58% at 50% 50%, rgba(0,0,0,.88), rgba(0,0,0,.62) 55%, rgba(0,0,0,.38) 100%); }
.pc-ho.essaim { --c: var(--essaim); } .pc-ho.colonie { --c: var(--colonie); }
.pc-ho .ho-card { max-width: 440px; padding: 34px 38px; box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 24px 70px rgba(0,0,0,.7), 0 0 40px color-mix(in srgb, var(--c) 30%, transparent); }
.pc-ho .ho-card h2 { font-size: 2.3rem; }
.pc-ho .ho-card button.primary { margin-top: 6px; padding: 12px 22px; font: 700 1.05rem/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.pc-ho .ho-card.from-l { animation: hoInL .5s cubic-bezier(.2,.8,.25,1) both; } .pc-ho .ho-card.from-r { animation: hoInR .5s cubic-bezier(.2,.8,.25,1) both; }
.pc-ho .ho-card.from-l.leave { animation: hoOutR .38s cubic-bezier(.6,0,.8,.4) both; } .pc-ho .ho-card.from-r.leave { animation: hoOutL .38s cubic-bezier(.6,0,.8,.4) both; }
@keyframes hoInL { from { transform: translateX(-75vw) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hoInR { from { transform: translateX(75vw) rotate(3deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hoOutR { to { transform: translateX(75vw) rotate(3deg); opacity: 0; } }
@keyframes hoOutL { to { transform: translateX(-75vw) rotate(-3deg); opacity: 0; } }
/* conseil du mode découverte : du côté de l'adversaire, pour ne pas cacher les boutons du joueur */
body.pc[data-view="essaim"] .tipcard { right: auto; left: 16px; }

/* ---- retours d'Oni (06/11/2026) : tuiles, supports, cartes à mots-clés, phase compacte, détail en fenêtre ---- */
/* bâtiments : nom en haut, PV au centre, capacités en bas, tout plus gros */
body.pc .tile.im, body.pc .tile { justify-content: space-between; padding: 4px 2px 4px; gap: 0; }
body.pc .tile .tn { font: 700 max(1rem, calc(var(--cell) * .14))/1.1 var(--body); }
body.pc .tile .hp { font: 800 max(20px, calc(var(--cell) * .34))/1 var(--body); }
body.pc .tile .hp small { font-size: max(1rem, calc(var(--cell) * .15)); font-weight: 700; }
body.pc .tile .tb { font: 800 max(1rem, calc(var(--cell) * .17))/1 var(--body); gap: 4px; min-height: 1em; }
body.pc .tile .tb .i { width: max(13px, calc(var(--cell) * .19)); height: max(13px, calc(var(--cell) * .19)); stroke-width: 2.4; }
/* supports : icône et dégâts plus gros */
body.pc .cell.sup { gap: 2px; }
body.pc .cell.sup .i { width: calc(var(--cell) * .42); height: calc(var(--cell) * .42); }
body.pc .cell.sup b { font: 800 max(16px, calc(var(--cell) * .28))/1 var(--body); }
body.pc .cell .lv { font: 800 max(1rem, calc(var(--cell) * .14))/1 var(--body); }
/* cartes de créatures à déployer : mots-clés, détail au survol */
.ccard.sh { padding: 7px 56px 7px 40px; gap: 3px; min-height: 0; }
.ccard.sh .thumb { width: 44px; height: 44px; }
.ccard.sh .stats { display: flex; gap: 10px; font: 800 1rem/1 var(--body); }
.ccard.sh .st { display: inline-flex; align-items: center; gap: 3px; } .ccard.sh .st .i { width: 15px; height: 15px; }
.ccard.sh .st.atq { color: var(--aggro); }
.ccard .caps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.ccard .cap { display: inline-flex; align-items: center; gap: 4px; font-size: 1rem; font-weight: 600; color: var(--soutien); background: color-mix(in srgb, var(--soutien) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--soutien) 40%, transparent); border-radius: 99px; padding: 2px 7px; cursor: help; }
.ccard .cap.up { color: var(--essaim); }
.ccard .cap .i { width: 12px; height: 12px; }
/* phase compacte : nom de l'étape, ⓘ pour l'explication complète, consigne courte */
body.pc .po-scroll .phase .hint { margin: 5px 0 2px; font-size: 1rem; }
.ph-head .info { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-soft); color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center;
  font: italic 700 1rem/1 Georgia, serif; cursor: help; flex: none; }
.spells.sh { flex-direction: row; flex-wrap: wrap; } .spells.sh .spell { padding: 6px 10px; }
/* détail d'une créature : fenêtre à côté de son jeton ; un clic ailleurs la ferme */
.cpop { position: fixed; z-index: 35; width: 300px; filter: drop-shadow(0 14px 30px rgba(0,0,0,.6)); }
.cpop .detail { margin: 0; max-width: none; box-shadow: none; }
.cpop .close { position: absolute; top: 6px; right: 8px; z-index: 1; border: 0; background: none; font-size: 1.3rem; color: var(--ink-soft); }
/* info-bulle flottante (PC) : remplace les bulles CSS, jamais coupée */
body.pc [data-tip]:hover::after, body.pc [data-tip]:focus::after, body.pc [data-tip]:focus-visible::after { display: none; }
#tipbox { position: fixed; z-index: 70; max-width: 260px; white-space: pre-line; background: var(--ink); color: var(--panel); font: 500 1rem/1.45 var(--body);
  padding: 8px 10px; border-radius: 7px; box-shadow: 0 6px 18px rgba(0,0,0,.4); pointer-events: none; }
:root[data-theme="dark"] #tipbox, :root[data-theme="auto"].sys-dark #tipbox { background: #f1e9de; color: #1b1612; }
.ps-rows .hidden-hand { font-style: normal; }

/* ---- retours d'Oni (06/11/2026, 3) ---- */
/* étapes du tour et consigne : toujours en bas du panneau du joueur */
.po-bottom { flex: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }
.po-bottom .pc-steps { margin: 0 0 8px; }
.po-bottom .phase { margin: 0; max-width: none; padding: 9px 11px; border-left-width: 4px; box-shadow: none; background: var(--panel-2); max-height: 34vh; overflow-y: auto; box-sizing: border-box; }
.po-bottom .phase .hint { margin: 5px 0 2px; font-size: 1rem; }
.chev li { height: 36px; font-size: 1rem; }
.chev li.on { font-weight: 700; }
/* boutons de l'étape : sur le plateau, dans l'angle mort du bas, côté joueur */
.pc-go { position: absolute; bottom: 9px; width: calc(var(--cell) * 2 + 2px); min-height: var(--cell); box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; z-index: 3; margin: 0; }
.pc-go.l { left: 9px; } .pc-go.r { right: 9px; }
.pc-go button { width: 100%; padding: 8px 10px; border-radius: 9px; font: 600 1rem/1.1 var(--body); background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--rule); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.pc-go button.primary { position: relative; padding: 14px 12px; font: 700 1.05rem/1.1 var(--display); letter-spacing: .07em; text-transform: uppercase; color: #1b120a;
  background: linear-gradient(180deg, #ffc75f, var(--hot) 55%, #c97a1a); border: 0; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 10px 50%);
  box-shadow: none; animation: goPulse 2.6s ease-in-out infinite; }
.pc-go.colonie button.primary { background: linear-gradient(180deg, #7fe0cf, var(--colonie) 55%, #237a6c); }
.pc-go.essaim button.primary { background: linear-gradient(180deg, #d2b3ff, var(--essaim) 55%, #5c3d8f); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.pc-go.colonie button.primary { color: #062421; }
.pc-go button.primary:hover { filter: brightness(1.12); }
@keyframes goPulse { 0%, 100% { filter: drop-shadow(0 0 2px rgba(255,190,90,.3)); } 50% { filter: drop-shadow(0 0 10px rgba(255,190,90,.7)); } }
/* biomasse calée à droite */
.po-head .bigwrap { margin-left: auto; } .po-head .bigwrap .pc-big { margin-left: 0; }
/* jetons : attaque et défense plus grandes, icône d'aura en haut à droite */
body.pc .tok { font-size: max(1rem, calc(var(--cell) / var(--n) * .38)); position: relative; padding: 0 4px 2px; }
body.pc .tok .au { position: absolute; top: 3px; right: 3px; margin: 0; }
body.pc .tok .au .i { width: max(11px, calc(var(--cell) / var(--n) * .26)); height: max(11px, calc(var(--cell) / var(--n) * .26)); }
/* info-bulle : suit le thème */
#tipbox, :root[data-theme="dark"] #tipbox, :root[data-theme="auto"].sys-dark #tipbox { background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); box-shadow: 0 8px 22px rgba(0,0,0,.45); }
/* encart du tour (haut du plateau) : écritures plus grandes */
.pc-corner .k { font-size: max(1rem, calc(var(--cell) * .13)); }
.pc-corner.turn b { font-size: max(18px, calc(var(--cell) * .27)); }
/* bouton de passage (Oni, 06/11/2026) : jaune comme tous les éléments actionnables, sans forme de flèche */
.pc-go button.primary, .pc-go.colonie button.primary, .pc-go.essaim button.primary {
  clip-path: none; border-radius: 12px; padding: 14px 34px 14px 14px; color: #1b120a; text-shadow: none;
  background: linear-gradient(180deg, #ffd27a 0%, var(--hot) 48%, #d98a1e 100%);
  border: 1px solid #ffdf9c; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,60,0,.35), 0 6px 16px rgba(0,0,0,.45);
  animation: goGlow 2.6s ease-in-out infinite; filter: none; }
.pc-go button.primary::after { content: "»"; position: absolute; right: 12px; top: 50%; transform: translateY(-52%); font: 800 1.5rem/1 var(--body); opacity: .75; }
.pc-go button.primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.pc-go button.primary:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(120,60,0,.35), 0 3px 8px rgba(0,0,0,.4); }
@keyframes goGlow { 0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,60,0,.35), 0 6px 16px rgba(0,0,0,.45), 0 0 0 rgba(240,164,58,0); }
  50% { box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,60,0,.35), 0 6px 16px rgba(0,0,0,.45), 0 0 18px rgba(240,164,58,.65); } }
/* étapes du tour (Oni, 06/11/2026) : halo seulement sur l'étape en cours, couleur du camp, sans changement de teinte.
   La forme (chevron) passe sur le <span> pour que le halo du <li> ne soit pas coupé. */
.pc-steps, .pc-steps:has(li.on) { animation: none; filter: none; }
.chev li, .chev li:first-child, .chev li.done, .chev li.on { clip-path: none; background: none; animation: none; color: inherit; }
.chev li > span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; box-sizing: border-box; padding: 0 6px 0 12px;
  background: var(--panel-2); color: var(--ink-soft); clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%, 9px 50%); }
.chev li:first-child > span { clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); }
.chev li.done > span { background: color-mix(in srgb, var(--c) 30%, var(--panel-2)); color: var(--ink); }
.chev li.on { position: relative; z-index: 1; animation: stepHaloOn 2.6s ease-in-out infinite; }
.chev li.on > span { background: var(--c); color: #fff; }
@keyframes stepHaloOn { 0%, 100% { filter: drop-shadow(0 0 2px var(--c)); } 50% { filter: drop-shadow(0 0 9px var(--c)) drop-shadow(0 0 3px var(--c)); } }
/* attaques (Oni, 06/11/2026) : une créature qui peut encore agir se touche pour avancer et attaquer seule (jaune = actionnable) */
.tok.go { cursor: pointer; outline: 2px solid var(--hot); outline-offset: -1px; }
.tok.go:hover { filter: brightness(1.15); }
/* téléphone et tablette (06/11/2026) : jetons en grille carrée dans la case, comme sur PC, pour que tous restent visibles et touchables */
body:not(.pc) .toks { inset: 2px; display: grid; grid-template-columns: repeat(var(--n), 1fr); align-content: center; gap: 1px; }
body:not(.pc) .tok { width: 100%; height: auto; aspect-ratio: 1; min-width: 0; min-height: 0; padding: 0 1px 1px; border-radius: 3px; align-items: flex-end;
  font-size: max(1rem, calc(var(--cell) / var(--n) * .3)); }
body:not(.pc) .tok .au { display: none; }

/* ---- arbres d'amélioration en cartes (maquette d'Oni, 06/11/2026) ---- */
.utree2 { margin-bottom: 14px; }
.utree2.aggro { --c: var(--aggro); } .utree2.tank { --c: var(--tank); } .utree2.soutien { --c: var(--soutien); }
.utree2 .tt { display: flex; align-items: center; gap: 6px; color: var(--c); font: 700 1.05rem/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.utree2 .tt .i { width: 18px; height: 18px; }
.utree2 .tt small { margin-left: auto; color: var(--ink-soft); font: 500 1rem/1 var(--body); letter-spacing: 0; text-transform: none; }
.ur1 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.ur2 { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
.ucard { display: flex; min-height: 104px; border-radius: 9px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--rule); text-align: left; }
.uc-ic { flex: none; width: 58px; background: var(--c); display: flex; align-items: center; justify-content: center; }
.uc-ic > span { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--c); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.uc-ic .i { width: 24px; height: 24px; }
.uc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.uc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 6px 9px 0; }
.uc-pos { font: 500 1rem/1.1 var(--body); color: var(--ink-soft); white-space: nowrap; }
.uc-name { font: 800 1.15rem/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; text-align: right; }
.uc-txt { flex: 1; padding: 4px 9px 8px; font: 400 1rem/1.35 var(--body); text-align: center; display: flex; align-items: center; justify-content: center; }
.uc-foot { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-height: 30px; padding: 0 9px; background: color-mix(in srgb, var(--c) 28%, var(--panel-2)); }
.ucard .uc-foot .bar { position: absolute; inset: 0; display: block; height: auto; margin: 0; border-radius: 0; background: none; }
.ucard .uc-foot .bar i { display: block; height: 100%; background: var(--c); }
.uc-n { position: relative; font: 800 1.1rem/1 var(--display); }
.uc-one { position: relative; border: 1px solid var(--hot); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 2px 9px; font: 700 1rem/1.2 var(--body); }
.ucard.taken { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.ucard.taken .uc-n { color: #fff; }
.ucard.closed, .ucard.needR1 { opacity: .42; }
.ucard.can { cursor: pointer; border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot); }
.ucard.can:hover { filter: brightness(1.1); }
@media (max-width: 680px) { .ur1 { grid-template-columns: 1fr; } }
/* pastille d'effet sur le jeton (seul sur sa case) : « +1 ATQ », « +2 HEAL »… */
body.pc .tok .au.lab { flex-direction: column; align-items: flex-end; gap: 1px; padding: 2px 5px; border-radius: 6px; }
body.pc .tok .au.lab span { font: 800 1rem/1.05 var(--body); white-space: nowrap; }
body.pc .tok .au.give.lab { color: #fff; } body.pc .tok .au.get.lab { color: #e2c8ff; }
.ccard .cap { font-size: 1rem; }
/* aucune écriture sous 1rem (Oni, 06/11/2026) : <small> et champs de formulaire compris */
small { font-size: max(1rem, .85em); }
input, select, textarea, button { font-size: max(1rem, 1em); }
/* cartes d'amélioration dans un panneau étroit : rang 1 l'une sous l'autre */
.po-scroll, .panel.essaim { container-type: inline-size; }
@container (max-width: 460px) { .ur1 { grid-template-columns: 1fr; } }
.uc-name { min-width: 0; overflow-wrap: anywhere; }
.ucard.taken .uc-body { background: color-mix(in srgb, var(--c) 16%, var(--panel-2)); }
/* étapes du tour : libellé sur deux lignes si besoin */
.chev li { height: 44px; } .chev li > span { white-space: normal; text-align: center; line-height: 1.05; }
/* téléphone et tablette : exception au minimum de 1rem, dans les cases du plateau seulement (environ 40 px de côté,
   un texte de 16 px n'y tient pas) — à revoir avec Oni lors de la version mobile */
body:not(.pc) .board .cell { font-size: 10px; }
body:not(.pc) .board .cell.entry .col { font: 600 10px/1 var(--display); }
body:not(.pc) .board .cell .lv { font: 700 9px/1 var(--display); }
body:not(.pc) .board .cell.core b { font: 700 12px/1 var(--display); } body:not(.pc) .board .cell.core small { font-size: 8px; }
body:not(.pc) .board .cell.sup b { font: 700 12px/1 var(--display); }
body:not(.pc) .board .tile .tn { font: 600 max(8.5px, calc(var(--cell) * .13))/1 var(--display); }
body:not(.pc) .board .tile .hp { font: 700 max(13px, calc(var(--cell) * .22))/1 var(--display); } body:not(.pc) .board .tile .hp small { font-size: 8px; }
body:not(.pc) .board .tile .tb { font: 600 9px/1 var(--display); }
body:not(.pc) .board .tile.hidden b { font-size: 16px; } body:not(.pc) .board .tile.hidden small { font-size: 8px; }
body:not(.pc) .board .tok { font: 700 max(8px, calc(var(--cell) / var(--n) * .3))/1 var(--display); }
body:not(.pc) .board .rng { font-size: 9px; }
body:not(.pc) .board .tile { justify-content: space-between; padding: 1px 1px 2px; gap: 0; line-height: 1; }
body:not(.pc) .board .tile .tn { line-height: 1.1; flex: none; }
/* écran de passage (Oni, 06/11/2026) : arrivée et départ en 0,3 s, cubic-bezier(0.64, 0, 0.78, 0), opacité progressive */
.pc-ho .ho-card.from-l { animation: hoInL .3s cubic-bezier(0.64, 0, 0.78, 0) 0s 1 normal both; }
.pc-ho .ho-card.from-r { animation: hoInR .3s cubic-bezier(0.64, 0, 0.78, 0) 0s 1 normal both; }
.pc-ho .ho-card.from-l.leave { animation: hoOutR .3s cubic-bezier(0.64, 0, 0.78, 0) 0s 1 normal forwards; }
.pc-ho .ho-card.from-r.leave { animation: hoOutL .3s cubic-bezier(0.64, 0, 0.78, 0) 0s 1 normal forwards; }
@keyframes hoInL { from { transform: translateX(-60vw); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hoInR { from { transform: translateX(60vw); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hoOutR { from { transform: none; opacity: 1; } to { transform: translateX(60vw); opacity: 0; } }
@keyframes hoOutL { from { transform: none; opacity: 1; } to { transform: translateX(-60vw); opacity: 0; } }
.ho-stat { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 4px 0 10px; font: 600 1.1rem/1 var(--body); color: var(--ink) !important; }
.ho-stat b { font: 800 2.2rem/1 var(--display); color: var(--c); } .ho-stat .i { width: 26px; height: 26px; color: var(--c); }

    log(S, "essaim", `${card.name} déployé${card.free ? " gratuitement" : ""} en lane ${LANE_NAME[lane]}, colonne ${COLS[u + 2]}.`);
    if (card.name === "Sapeur" && target && S.tiles[target]) {
      fx(S, { t: "sapeur", k: target });
      log(S, "essaim", `Sabotage : le Sapeur détruit un bâtiment de la lane ${LANE_NAME[lane]}.`);
      destroyTile(S, target, "sabotage", c);
    }
    if (card.name === "Œil-sonde") revealLane(S, lane);
    return true;
  }
  // Vision de l'Œil-sonde (Oni, 04/11/2026) : tant qu'il est en vie, les tuiles camouflées de sa lane sont révélées,
  // y compris celles posées plus tard (appelé au déploiement et à chaque pose de la colonie). Une tuile révélée le reste.
  function visionSweep(S) {
    const lanes = new Set(S.creatures.filter(c => c.name === "Œil-sonde").map(c => c.lane));
    for (const lane of lanes) if (laneTiles(S, lane).some(k => S.tiles[k].camo && !S.tiles[k].revealed)) revealLane(S, lane);
  }
  function revealLane(S, lane) {
    fx(S, { t: "vision", lane, keys: laneTiles(S, lane).filter(k => S.tiles[k].camo && !S.tiles[k].revealed) });
    for (const k of laneTiles(S, lane)) if (S.tiles[k].camo && !S.tiles[k].revealed) { S.tiles[k].revealed = true; if (S.tiles[k].trap) S.tiles[k].disarmed = true; log(S, "essaim", `Vision : tuile camouflée révélée (${S.tiles[k].name}).`); }
  }
  function endDeploy(S) {
    if (S.budget > 0) { S.reserve += S.budget; log(S, "essaim", `${S.budget} biomasse versée à la réserve (réserve ${S.reserve}).`); }
    S.budget = 0;
    for (const c of S.handA) toPile(S, c.name);
    for (const l of [1, 2, 3]) shuffle(S.piles[l]);
    S.handA = [];
    S.phase = "A_upgrade";
  }
  // Améliorations payées en plusieurs fois : on investit des points de biomasse dans un nœud précis.
  // Commencer à investir dans un nœud ferme l'autre choix du même rang.
  const nodeCost = slot => (slot.endsWith("1") ? COST_R1 : COST_R2);
  function invested(S, type, slot) { return (S.invest && S.invest[type + ":" + slot]) || 0; }
  function nodeState(S, type, slot) {
    const u = S.upgrades[type], r1 = slot.endsWith("1"), cur = r1 ? u.r1 : u.r2;
    if (cur === slot[0]) return "taken";
    if (cur) return "closed";
    const siblings = r1 ? ["A1", "B1"] : ["A2", "C2", "B2"];
    if (siblings.some(o => o !== slot && invested(S, type, o) > 0)) return "closed";
    if (!r1 && !u.r1) return "needR1";
    if (!r1 && slot !== "C2" && u.r1 !== slot[0]) return "closed";
    return "open";
  }
  function investable(S) {
    if (S.phase === "A_deploy") return S.budget + S.reserve;
    if (S.phase === "A_upgrade") return S.reserve;
    return 0;
  }
  function invest(S, type, slot, n) {
    if (nodeState(S, type, slot) !== "open") return false;
    const need = nodeCost(slot) - invested(S, type, slot);
    n = Math.min(n, need, investable(S));
    if (n <= 0) return false;
    let left = n;
    if (S.phase === "A_deploy") { const b = Math.min(left, S.budget); S.budget -= b; left -= b; }
    S.reserve -= left;
    S.invest = S.invest || {};
    S.invest[type + ":" + slot] = invested(S, type, slot) + n;
    fx(S, { t: "invest", type, slot, got: invested(S, type, slot), cost: nodeCost(slot) });
    log(S, "essaim", `${n} biomasse investie dans ${TREES[type][slot][0]} (${invested(S, type, slot)}/${nodeCost(slot)}).`);
    if (invested(S, type, slot) >= nodeCost(slot)) { delete S.invest[type + ":" + slot]; acquire(S, type, slot); }
    return true;
  }
  function acquire(S, type, slot) {
    const u = S.upgrades[type];
    const before = S.creatures.filter(c => CREATURES[c.name].type === type).map(c => [c, maxHp(S, c.name)]);
    if (slot.endsWith("1")) { u.r1 = slot[0]; addPile(S, 2, type); } else { u.r2 = slot[0]; addPile(S, 3, type); }
    fx(S, { t: "upgrade", type, slot, name: TREES[type][slot][0] });
    for (const [c, m] of before) c.hp += maxHp(S, c.name) - m;
    log(S, "essaim", `Amélioration ${TREES[type][slot][0]} (${type}) acquise : les cartes de niveau ${slot.endsWith("1") ? 2 : 3} entrent dans la pioche.`);
    if (type === "soutien" && slot === "C2") {
      log(S, "essaim", "Clairvoyance : les tuiles camouflées sont visibles tant qu'un soutien est en jeu.");
      // les Œil-sonde de la pioche sortent du jeu ; ceux en main ou sur le plateau restent, mais ne reviendront plus dans la pioche
      const n = S.piles[1].filter(x => x === "Œil-sonde").length;
      S.piles[1] = S.piles[1].filter(x => x !== "Œil-sonde");
      if (n) log(S, "essaim", `Clairvoyance : ${n} Œil-sonde ${n > 1 ? "sortent" : "sort"} de la pioche (plus utile${n > 1 ? "s" : ""}).`);
    }
  }
  function canBuy(S, type, slot) { return nodeState(S, type, slot) === "open" && investable(S) + invested(S, type, slot) >= nodeCost(slot); }
  function buy(S, type, slot) { return canBuy(S, type, slot) && invest(S, type, slot, nodeCost(slot)); }
  function startAttacks(S) { S.phase = "A_attack"; }
  function attackOrder(S) { return [...S.creatures].filter(c => !c.acted).sort((a, b) => a.k - b.k || a.id - b.id); }
  function endAttackerTurn(S) {
    if (S.winner) return;
    // auras de soin
    for (const c of S.creatures) {
      const v = soinValue(S, c), m = maxHp(S, c.name);
      if (v && c.hp < m) { const before = c.hp; c.hp = Math.min(m, c.hp + v); fx(S, { t: "cheal", id: c.id, n: c.hp - before, hp: c.hp + bonusHp(S, c) }); log(S, "essaim", `${c.name} regagne ${v} PV.`); }
    }
    // sortilèges non joués : ils restent en main jusqu'à ce qu'ils soient joués (Oni, 01/11/2026 ; avant : défaussés)
    S.stase = [];
    startDefenderTurn(S);
  }

  // ------------------------------------------------------------------ sortilèges
  function useSpell(S, idx, arg) {
    const name = S.spells[idx]; if (!name) return false;
    const sp = SPELLS[name];
    // événement visuel du sort, placé avant ses effets (dégâts, soins…) ; seules des informations publiques
    const at = S.fx ? S.fx.length : 0;
    const pubArg = ["Frappe orbitale", "Salve", "Brouillage"].includes(name) ? { id: arg } : name === "Barrage" ? { lane: arg } : name === "Champ de stase" ? { k: arg }
      : name === "Onde de choc" ? { ring: Number(arg) } : name === "Réparation" ? { keys: arg } : name === "Reconversion" ? { k: arg && arg.tile }
      : name === "Renouvellement" ? { n: Array.isArray(arg) ? arg.length : 0 } : {};
    fx(S, { t: "spell", name, kind: sp.kind, ...pubArg });
    const ok = applySpell(S, name, arg);
    if (!ok) { if (S.fx) S.fx.splice(at); return false; }
    S.spells.splice(idx, 1); S.spellDiscard.push(name);
    log(S, "colonie", `Sortilège joué : ${name}.`);
    killCheck(S);
    return true;
  }
  function applySpell(S, name, arg) {
    const cr = id => S.creatures.find(c => c.id === id);
    switch (name) {
      case "Frappe orbitale": { const c = cr(arg); if (!c) return false; const t = resolveTarget(S, c); if (!t) return false; damageCreature(S, t, 4, name); return true; }
      case "Salve": {
        const c = cr(arg); if (!c) return false;
        const group = [c, ...caseMates(S, c)].filter(o => targetable(S, o));
        if (!group.length) return false;
        const first = resolveTarget(S, c) || group[0];
        const rest = group.filter(o => o !== first).sort((a, b) => effAtq(S, b) - effAtq(S, a));
        damageCreature(S, first, 2, name); if (rest[0]) damageCreature(S, rest[0], 2, name);
        return true;
      }
      case "Barrage": { if (!LANES.includes(arg)) return false; for (const c of S.creatures.filter(c => c.lane === arg && targetable(S, c))) damageCreature(S, c, 1, name); return true; }
      case "Onde de choc": { const r = Number(arg); if (!(r >= 1 && r <= 3)) return false; for (const c of S.creatures.filter(c => c.k === r && targetable(S, c))) damageCreature(S, c, 1, name); return true; }
      case "Champ de stase": { if (typeof arg !== "string" || !S.tiles[arg]) return false; S.stase.push(arg); return true; }
      case "Famine": { if (S.phase !== "A_start") return false; S.famine = 1; return true; }
      case "Brouillage": { // la créature visée (Provocation et Furtivité s'appliquent) ne bouge pas et n'attaque pas ce tour
        const c0 = cr(arg); if (!c0) return false; const c = resolveTarget(S, c0); if (!c || c.acted) return false;
        c.acted = true; c.jammed = true;
        log(S, "colonie", `Brouillage : ${c.name} ne bouge pas et n'attaque pas ce tour.`);
        return true;
      }
      case "Effort": S.extraPts += 2; return true;
      case "Cadence": S.extraPts += 2; return true;
      case "Feu nourri": S.doubleFire = true; return true;
      case "Réparation": { // arg = liste de clés de tuiles, 3 PV au total
        if (!Array.isArray(arg) || !arg.length || arg.length > 3) return false;
        for (const k of arg) { const t = S.tiles[k]; if (t && t.hp < t.max) { t.hp += 1; fx(S, { t: "heal", k, n: 1, hp: t.hp }); } }
        return true;
      }
      case "Renouvellement": { // arg = indices de la main à défausser
        if (!Array.isArray(arg)) return false;
        const idx = [...arg].sort((a, b) => b - a);
        for (const i of idx) if (S.hand[i]) S.tileDiscard.push(S.hand.splice(i, 1)[0]);
        for (let i = 0; i < arg.length; i++) drawOneTile(S);
        return true;
      }
      case "Reconversion": { // arg = {hand: index, tile: clé}
        if (!arg || S.hand[arg.hand] === undefined || !S.tiles[arg.tile] || S.tiles[arg.tile].start) return false;
        const old = S.tiles[arg.tile], nn = S.hand[arg.hand];
        const [x, y] = parse(arg.tile);
        S.tiles[arg.tile] = tileStats(nn, x, y);
        fx(S, { t: "place", k: arg.tile });
        if (TILES[nn].perm) S.workersBase += 1;
        S.hand[arg.hand] = old.name;
        log(S, "colonie", `Reconversion : ${pubName(nn)} remplace ${old.camo && !old.revealed ? "une tuile camouflée" : old.name}.`);
        return true;
      }
    }
    return false;
  }

  // ------------------------------------------------------------------ tour de la colonie
  function startDefenderTurn(S) {
    S.phase = "D_main"; S.alloc = { N: 0, E: 0, S: 0, O: 0 }; S.extraPts = 0; S.cadence = false; S.firedSupports = []; S.doubleFire = false;
  }
  const pubName = name => (TILES[name] && TILES[name].camo ? "tuile camouflée" : name);
  // Le chantier est affecté à une lane ; la case exacte n'est choisie qu'à la fin de la construction.
  function startChantier(S, handIdx, lane) {
    if (S.phase !== "D_main" || S.chantiers[lane].length >= S.chPerLane || S.hand[handIdx] === undefined) return false;
    const name = S.hand.splice(handIdx, 1)[0];
    S.chantiers[lane].push({ tile: name, left: TILES[name].d, fresh: true });
    fx(S, { t: "chantier", lane });
    log(S, "colonie", `Chantier lancé en lane ${LANE_NAME[lane]} : ${pubName(name)}.`);
    return true;
  }
  function cancelChantier(S, lane, i) {
    const ch = S.chantiers[lane][i]; if (!ch || !ch.fresh || S.phase !== "D_main") return false;
    S.chantiers[lane].splice(i, 1); S.hand.push(ch.tile); return true;
  }
  function supportTargets(S, sk) { // portée : les 8 cases autour du support (diagonales comprises)
    const [x, y] = parse(sk);
    return S.creatures.filter(c => { const [a, b] = toGlobal(c.lane, c.u, c.k); return Math.max(Math.abs(a - x), Math.abs(b - y)) === 1 && targetable(S, c); });
  }
  const rocketMilestones = S => [3, 6, 9].filter(f => S.floors >= f).length;
  const turretDmg = (S, l) => (l === 1 ? 1 + rocketMilestones(S) : l === 2 ? 2 : 0);
  // tirs restants d'une tourelle ce tour : 1, ou 2 avec Feu nourri
  const shotsLeft = (S, sk) => (S.doubleFire ? 2 : 1) - S.firedSupports.filter(k => k === sk).length;
  function fire(S, sk, creatureId) {
    const lvl = S.supports[sk];
    if (!lvl || lvl === 3 || shotsLeft(S, sk) <= 0) return false;
    const c = S.creatures.find(o => o.id === creatureId);
    if (!c || !supportTargets(S, sk).includes(c)) return false;
    const t = resolveTarget(S, c);
    S.firedSupports.push(sk);
    fx(S, { t: "shot", sk, id: t.id });
    damageCreature(S, t, turretDmg(S, lvl), `tourelle de niveau ${lvl}`);
    killCheck(S);
    return true;
  }
  function autoFire(S) {
    const order = Object.keys(S.supports).sort((a, b) => S.supports[a] - S.supports[b]);
    for (const sk of order) while (S.supports[sk] && S.supports[sk] !== 3 && shotsLeft(S, sk) > 0) {
      const cands = supportTargets(S, sk); if (!cands.length) { S.firedSupports.push(sk); continue; }
      const d = turretDmg(S, S.supports[sk]);
      cands.sort((a, b) => ((resolveTarget(S, b).hp <= d) - (resolveTarget(S, a).hp <= d)) || a.k - b.k || effAtq(S, b) - effAtq(S, a));
      if (!fire(S, sk, cands[0].id)) break;
    }
  }
  // Fin du tour de la colonie (ordre décidé par Oni le 30/10/2026) : chantiers et pose des bâtiments, nouveaux supports
  // (dès la pose), fusée (étages, paliers), PUIS tirs des tourelles (phase D_fire), puis pioches. Les supports apparus et les paliers atteints
  // pendant le tour comptent donc pour les tirs.
  function endDefenderTurn(S) {
    // chantiers et débordement
    let rocket = totalPoints(S) - allocated(S);
    for (const lane of LANES) {
      let pts = S.alloc[lane];
      const done = [];
      for (const ch of S.chantiers[lane]) {
        const use = Math.min(pts, ch.left); ch.left -= use; pts -= use;
        if (use) fx(S, { t: "work", lane, n: use });
        if (ch.left === 0) done.push(ch);
      }
      rocket += pts;
      for (const ch of done) {
        S.chantiers[lane].splice(S.chantiers[lane].indexOf(ch), 1);
        S.toPlace.push({ tile: ch.tile, lane });
      }
    }
    for (const lane of LANES) for (const ch of S.chantiers[lane]) ch.fresh = false;
    if (rocket > 0) fx(S, { t: "rocketPts", n: rocket });
    S.pendingRocket = rocket;
    skipUnplaceable(S);
    if (S.toPlace.length) { S.phase = "D_place"; return; }
    finishDefenderTurn(S);
  }
  // pose d'un bâtiment achevé : la colonie choisit une case valable de sa lane
  function placeTargets(S) {
    const p = S.toPlace[0]; if (!p) return [];
    const out = [];
    for (let x = -3; x <= 3; x++) for (let y = -3; y <= 3; y++) { const k = key(x, y); if (canTarget(S, p.lane, k)) out.push(k); }
    return out;
  }
  function skipUnplaceable(S) {
    while (S.toPlace.length && !placeTargets(S).length) {
      const p = S.toPlace.shift(); S.hand.push(p.tile);
      log(S, "colonie", `${pubName(p.tile)} : aucune case libre en lane ${LANE_NAME[p.lane]}, la tuile revient en main.`);
    }
  }
  function placeTile(S, k) {
    if (S.phase !== "D_place" || !placeTargets(S).includes(k)) return false;
    const p = S.toPlace.shift(), [x, y] = parse(k);
    pushBack(S, k);
    S.tiles[k] = tileStats(p.tile, x, y);
    fx(S, { t: "place", k });
    if (TILES[p.tile].perm) { S.workersBase += 1; log(S, "colonie", "+1 travailleur permanent."); }
    placeSupports(S); // un support apparaît dès que ses murs sont construits
    log(S, "colonie", TILES[p.tile].camo ? `Une tuile camouflée est construite en lane ${LANE_NAME[p.lane]}.` : `${p.tile} construit en lane ${LANE_NAME[p.lane]}.`);
    visionSweep(S); // un Œil-sonde en vie dans la lane révèle aussitôt la nouvelle tuile camouflée
    skipUnplaceable(S);
    if (!S.toPlace.length) finishDefenderTurn(S);
    return true;
  }
  function finishDefenderTurn(S) {
    const rocket = S.pendingRocket || 0; S.pendingRocket = 0;
    placeSupports(S); // supports d'abord (au moment où les bâtiments sont construits), puis la fusée (ordre décidé par Oni, 30/10/2026)
    // fusée
    S.rocketPts += Math.max(0, rocket);
    while (S.floors < FLOORS && S.rocketPts >= floorCost(S)) {
      S.rocketPts -= floorCost(S); S.floors += 1; S.workersBase += 1;
      fx(S, { t: "floor", n: S.floors });
      log(S, "colonie", `Étage ${S.floors} de la fusée achevé : +1 travailleur.`);
      if (S.floors === 3) { S.techBonus += 2; log(S, "colonie", "Palier 3 : +2 technologies permanentes."); }
      if (S.floors === 6) { S.chPerLane = 2; log(S, "colonie", "Palier 6 : +1 chantier par lane."); }
      if (S.floors === 9) {
        fx(S, { t: "nuke", ids: S.creatures.map(c => c.id) });
        for (const c of S.creatures) toPile(S, c.name);
        for (const l of [1, 2, 3]) shuffle(S.piles[l]);
        log(S, "colonie", `Palier 9 · Nuke : ${S.creatures.length} créature${S.creatures.length > 1 ? "s" : ""} détruite${S.creatures.length > 1 ? "s" : ""}.`);
        S.creatures = [];
      }
      if (S.floors === FLOORS) { fx(S, { t: "liftoff" }); S.winner = "colonie"; log(S, "jeu", "La fusée décolle : la colonie gagne."); return; }
    }
    S.phase = "D_fire"; // les tourelles tirent maintenant (choix de la colonie, ou tirs automatiques)
  }
  function endColonyTurn(S) {
    autoFire(S); // tirs restants (automatiques)
    // sortilèges de soutien non joués : gardés en main (Oni, 01/11/2026)
    drawTiles(S);
    const n = spellsPerTurn(S);
    for (let i = 0; i < n; i++) {
      if (!S.spellDeck.length) { S.spellDeck = shuffle(S.spellDiscard); S.spellDiscard = []; }
      if (S.spellDeck.length) S.spells.push(S.spellDeck.pop());
    }
    if (n) log(S, "colonie", `${n} sortilège${n > 1 ? "s" : ""} pioché${n > 1 ? "s" : ""}.`);
    S.round += 1;
    startAttackerTurn(S);
  }
  function drawOneTile(S) {
    if (!S.tileDeck.length) { S.tileDeck = shuffle(S.tileDiscard); S.tileDiscard = []; }
    if (S.tileDeck.length) S.hand.push(S.tileDeck.pop());
  }
  function drawTiles(S) { while (S.hand.length < handSize(S)) { const before = S.hand.length; drawOneTile(S); if (S.hand.length === before) break; } }

  // Parties enregistrées avec d'anciennes règles : les tuiles de départ (« Mur de départ », « Haie de départ »,
  // « Haie d'épines » marquée start) deviennent des Barbelés
  // de départ (1 PV, Épines 1), et les Épines des tuiles posées suivent les nouvelles valeurs. Sans effet sur une partie à jour.
  function migrate(S) {
    if (!S.version) S.version = "0.3"; // partie commencée avant le suivi des versions
    if (S.killed === undefined) S.killed = 0;
    for (const t of Object.values(S.tiles || {})) if (t.shield) { t.ren = t.shield; delete t.shield; } // Bouclier → Renforcé (02/11/2026)
    for (const c of S.creatures || []) if (CREATURES[c.name] && c.hp > maxHp(S, c.name)) c.hp = maxHp(S, c.name); // Mue : plus de +1 PV au soutien
    for (const t of Object.values(S.tiles || {})) {
      if (t.name === "Mur de départ" || t.name === "Haie de départ") { t.start = true; t.max = 1; t.hp = Math.min(t.hp, 1); }
      if (t.start) { t.name = START_WALL; t.ep = 1; } // Barbelé : Épines 1
      else if (TILES[t.name]) t.ep = TILES[t.name].ep;
      if (TILES[t.name] && TILES[t.name].aura && t.camo) { t.camo = 0; t.revealed = true; } // Avant-postes désormais face visible
    }
    if (S.invest && S.upgrades) for (const [key, got] of Object.entries(S.invest)) {
      const [type, slot] = key.split(":");
      if (TREES[type] && TREES[type][slot] && got >= nodeCost(slot) && nodeState(S, type, slot) === "open") { delete S.invest[key]; acquire(S, type, slot); }
    }
    for (const list of [S.tileDiscard, S.tileDeck, S.hand]) if (Array.isArray(list)) for (let i = list.length - 1; i >= 0; i--) if (list[i] === "Mur de départ" || list[i] === "Haie de départ") list.splice(i, 1);
    return S;
  }

  // ------------------------------------------------------------------ actions des joueurs
  // Point d'entrée unique, utilisé par l'interface locale et par le serveur en ligne :
  // vérifie le camp, la phase et les paramètres, puis appelle les fonctions de règles ci-dessus.
  // Les transitions de phase qui vivaient dans l'interface (fenêtres Famine / Réaction, passage aux tirs) sont ici.
  const PHASE_SIDE = { A_famine: "colonie", A_start: "essaim", A_deploy: "essaim", A_upgrade: "essaim", A_react: "colonie", A_attack: "essaim", D_main: "colonie", D_fire: "colonie", D_place: "colonie" };
  const actor = S => PHASE_SIDE[S.phase] || null;
  const isInt = v => Number.isInteger(v);
  const isLane = l => LANES.includes(l);
  const own = (o, k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k);
  const creatureById = (S, id) => S.creatures.find(c => c.id === id);
  // à la fin du tour de la colonie : fenêtre Famine si la colonie tient Famine
  function openFamine(S) { if (!S.winner && S.phase === "A_start" && S.spells.includes("Famine")) S.phase = "A_famine"; }
