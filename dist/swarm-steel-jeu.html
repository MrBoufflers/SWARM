<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm &amp; Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>/* Table de jeu : plateau central entre le camp de la colonie (gauche) et celui de l'essaim (droite) */
:root {
  --bg: #e9ecea; --panel: #ffffff; --panel-2: #f4f6f5; --ink: #1b1f1d; --ink-soft: #5b6560; --rule: #d3d9d6;
  --aggro: #b0372b; --tank: #2c5b8a; --soutien: #6b4c97;
  --wall: #9c6a32; --wall-bg: #f3e7d6; --support: #1e7469; --support-bg: #d8ece8;
  --off: #c4611d; --sup: #3a7a4a;
  --north: #2563a8; --east: #2f8a55; --south: #c98a12; --west: #a03d8a;
  --colonie: #1e7469; --essaim: #6b4c97; --hot: #e2a400; --danger: #b0372b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cell: min(64px, calc((100vw - 100px) / 9));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131716; --panel: #1c2120; --panel-2: #232927; --ink: #e5eae7; --ink-soft: #9ba7a1; --rule: #33403b;
  --wall-bg: #3a2e20; --support-bg: #18332f; --colonie: #3fb3a3; --essaim: #a68bd6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131716; --panel: #1c2120; --panel-2: #232927; --ink: #e5eae7; --ink-soft: #9ba7a1; --rule: #33403b;
  --wall-bg: #3a2e20; --support-bg: #18332f; --colonie: #3fb3a3; --essaim: #a68bd6; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-block: 0 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.i { width: 1.05em; height: 1.05em; vertical-align: -.16em; flex: none; }
.i.big { width: 44px; height: 44px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand b { font: 700 1.5rem/1 var(--display); letter-spacing: .01em; }
.brand span { color: var(--ink-soft); font-size: .8rem; }
.round { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.1rem; }
.round b { font-size: 1.3rem; }
.menu { margin-left: auto; display: flex; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--ink-soft); }
.dot.colonie { background: var(--colonie); } .dot.essaim { background: var(--essaim); }

button.primary, button.ghost, .acts button, .choices button, .step button { border: 1px solid var(--rule); background: var(--panel); padding: 7px 12px; border-radius: 6px; }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
.choices button.on { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }

.layout { display: grid; grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; min-width: 0; }
.panel.colonie { border-top: 4px solid var(--colonie); } .panel.essaim { border-top: 4px solid var(--essaim); }
.panel h3 { margin: 0 0 10px; font: 700 1.25rem/1 var(--display); display: flex; align-items: center; gap: 6px; }
.panel h4 { margin: 14px 0 6px; font: 600 .78rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--rule); font-variant-numeric: tabular-nums; }
.kv span { color: var(--ink-soft); } .kv b { text-align: right; }
.small { font-size: .8rem; color: var(--ink-soft); margin: 4px 0 0; }
.muted { color: var(--ink-soft); }
.floors { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 10px; }
.fl { font: 600 .72rem/1 var(--display); font-style: normal; text-align: center; padding: 5px 0; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-soft); }
.fl.ms { border-color: var(--colonie); }
.fl.on { background: var(--colonie); color: #fff; border-color: var(--colonie); }
.atelier { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px dotted var(--rule); }
.atelier .al { font: 700 1rem/1 var(--display); color: #fff; text-align: center; padding: 5px 0; border-radius: 4px; }
.atelier.lane-N .al { background: var(--north); } .atelier.lane-E .al { background: var(--east); } .atelier.lane-S .al { background: var(--south); } .atelier.lane-O .al { background: var(--west); }
.slots { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.slot { font-size: .82rem; padding: 2px 6px; border-radius: 4px; background: var(--wall-bg); }
.slot.empty { background: transparent; border: 1px dashed var(--rule); color: var(--ink-soft); }
.slot .x { border: 0; background: none; padding: 0 4px; font-weight: 700; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { padding: 2px 9px; }
.step b, .pts { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; }
.hand { display: flex; flex-direction: column; gap: 5px; }
.tcard, .ccard { text-align: left; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.tcard { border-left: 4px solid var(--wall); }
.tcard small, .ccard small { color: var(--ink-soft); font-size: .76rem; }
.tcard.sel, .ccard.sel { outline: 2px solid var(--hot); outline-offset: 1px; }
.ccard { position: relative; padding-left: 40px; border-left: 4px solid var(--c); }
.ccard.aggro { --c: var(--aggro); } .ccard.tank { --c: var(--tank); } .ccard.soutien { --c: var(--soutien); }
.ccard .cost { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 .95rem/1 var(--display); }
.hidden-hand { color: var(--ink-soft); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: .78rem; padding: 2px 8px; border-radius: 99px; color: #fff; }
.chip.off { background: var(--off); } .chip.sup { background: var(--sup); }
.tree { border: 1px solid var(--rule); border-radius: 6px; padding: 6px; margin-bottom: 6px; display: grid; gap: 4px; }
.tree .tt { font: 600 .8rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
.tree.aggro .tt { color: var(--aggro); } .tree.tank .tt { color: var(--tank); } .tree.soutien .tt { color: var(--soutien); }
.tree .r { display: flex; gap: 4px; }
.tree .node { flex: 1; min-width: 0; font-size: .74rem; padding: 4px 3px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel-2); }
.tree .node.taken { background: var(--essaim); color: #fff; border-color: var(--essaim); opacity: 1; }
.log { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; font-size: .8rem; }
.log li { padding: 3px 0; border-bottom: 1px dotted var(--rule); }
.log li span { font: 600 .7rem/1 var(--display); color: var(--ink-soft); margin-right: 6px; }
.log li.colonie { color: var(--colonie); } .log li.essaim { color: var(--essaim); }

.center { display: flex; flex-direction: column; gap: 12px; min-width: 0; align-items: center; }
.phase { width: 100%; max-width: calc(var(--cell) * 9 + 16px); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-left: 5px solid var(--ink-soft); border-radius: 10px; padding: 10px 14px; }
.phase.colonie { border-left-color: var(--colonie); } .phase.essaim { border-left-color: var(--essaim); }
.ph-head { display: flex; align-items: center; gap: 8px; } .ph-head b { font: 700 1.15rem/1 var(--display); }
.ph-head .side { margin-left: auto; color: var(--ink-soft); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.ph-txt { margin: 4px 0 6px; color: var(--ink-soft); font-size: .86rem; }
.hint { margin: 6px 0; font-size: .88rem; }
.acts, .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.choices .lab { font-size: .8rem; color: var(--ink-soft); }
.spells { display: flex; flex-direction: column; gap: 5px; }
.spell { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 6px; background: var(--panel-2); padding: 6px 8px; }
.spell.off { --c: var(--off); } .spell.sup { --c: var(--sup); }
.spell .i { width: 22px; height: 22px; color: var(--c); }
.spell span { display: flex; flex-direction: column; } .spell small { color: var(--ink-soft); }

.board-wrap { overflow-x: auto; max-width: 100%; }
.board { display: grid; grid-template-columns: repeat(9, var(--cell)); grid-auto-rows: var(--cell); gap: 2px; padding: 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.cell { position: relative; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 10px; }
.cell.void { background: transparent; }
.cell.entry { background: transparent; border: 1px dashed var(--rule); }
.cell.entry .col { position: absolute; top: 2px; left: 4px; font: 600 10px/1 var(--display); color: var(--ink-soft); }
.cell.lane { background: color-mix(in srgb, var(--lc) 13%, var(--panel)); }
.cell.lane.r1 { background: color-mix(in srgb, var(--lc) 22%, var(--panel)); }
.lane-N { --lc: var(--north); } .lane-E { --lc: var(--east); } .lane-S { --lc: var(--south); } .lane-O { --lc: var(--west); }
.cell.stase { box-shadow: inset 0 0 0 3px #7fb6d9; }
.cell.core { background: var(--ink); color: var(--panel); flex-direction: column; gap: 1px; }
.cell.core .i { width: 22px; height: 22px; } .cell.core b { font: 700 13px/1 var(--display); } .cell.core small { font-size: 9px; opacity: .8; }
.cell.corner { background: var(--panel-2); color: var(--ink-soft); }
.cell.sup { background: var(--support); color: #fff; flex-direction: column; gap: 1px; }
.cell.sup .i { width: 20px; height: 20px; } .cell.sup b { font: 700 12px/1 var(--display); }
.cell.sup.spent { opacity: .55; }
.cell .lv { position: absolute; top: 2px; left: 4px; font: 700 9px/1 var(--display); }
.cell.hot { box-shadow: inset 0 0 0 3px var(--hot); cursor: pointer; }
.cell.sel { box-shadow: inset 0 0 0 3px var(--ink); }
.tile { position: absolute; inset: 3px; border-radius: 3px; background: var(--wall-bg); border: 1.5px solid var(--wall); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); }
.tile .tn { font: 600 9.5px/1 var(--display); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.tile .hp { font: 700 15px/1 var(--display); color: var(--wall); } .tile .hp small { font-size: 9px; color: var(--ink-soft); }
.tile .tb { display: flex; align-items: center; gap: 1px; font: 600 9px/1 var(--display); color: var(--wall); }
.tile .tb .i { width: 9px; height: 9px; }
.tile.hidden { background: repeating-linear-gradient(45deg, var(--wall) 0 4px, color-mix(in srgb, var(--wall) 75%, #000) 4px 8px); color: #fff; border-color: var(--wall); }
.tile.hidden b { font: 700 18px/1 var(--display); } .tile.hidden small { font-size: 8px; }
.tile.trap { border-style: dashed; }
.cghost { position: absolute; inset: 4px; border: 1.5px dashed var(--wall); border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--wall); font: 600 9px/1.1 var(--display); text-align: center; }
.cghost .i { width: 13px; height: 13px; }
.toks { position: absolute; inset: auto 2px 2px 2px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; z-index: 1; }
.tok { width: calc(var(--cell) / 2.6); height: calc(var(--cell) / 3.4); min-width: 20px; min-height: 16px; border: 0; border-radius: 4px; padding: 0 2px; display: flex; justify-content: space-between; align-items: center; color: #fff; font: 700 10px/1 var(--display); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tok.aggro { background: var(--aggro); } .tok.tank { background: var(--tank); } .tok.soutien { background: var(--soutien); }
.tok.sel { outline: 2px solid var(--hot); } .tok.done { opacity: .5; } .tok.new { box-shadow: 0 0 0 1.5px #fff, 0 1px 2px rgba(0,0,0,.35); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: .75rem; color: var(--ink-soft); margin-top: 6px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--lc); margin-right: 4px; vertical-align: -1px; }
.detail { width: 100%; max-width: calc(var(--cell) * 9 + 16px); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; font-size: .86rem; }
.detail.empty { color: var(--ink-soft); text-align: center; background: transparent; border-style: dashed; margin: 0; }
.detail.aggro { border-top: 4px solid var(--aggro); } .detail.tank { border-top: 4px solid var(--tank); } .detail.soutien { border-top: 4px solid var(--soutien); }
.d-head { display: flex; align-items: center; gap: 6px; } .d-head b { font: 700 1.1rem/1 var(--display); } .d-head span { color: var(--ink-soft); font-size: .8rem; }
.detail p { margin: 5px 0; }

.handoff { display: flex; justify-content: center; padding: 40px 0; }
.ho-card { background: var(--panel); border: 1px solid var(--rule); border-top: 6px solid var(--c); border-radius: 12px; padding: 28px 30px; max-width: 420px; text-align: center; }
.handoff.essaim { --c: var(--essaim); } .handoff.colonie { --c: var(--colonie); }
.ho-card .i.big { color: var(--c); }
.ho-card h2 { margin: 6px 0 8px; font: 700 2rem/1.05 var(--display); text-wrap: balance; }
.ho-k { margin: 8px 0 0; font: 600 .8rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.ho-card p { color: var(--ink-soft); }
.banner.win { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 10px; color: #fff; margin-bottom: 14px; font-size: 1.05rem; }
.banner.win.essaim { background: var(--essaim); } .banner.win.colonie { background: var(--colonie); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-card { position: relative; background: var(--panel); border-radius: 12px; padding: 22px 24px; max-width: 640px; max-height: 85vh; overflow-y: auto; }
.modal-card h2 { margin: 0 0 8px; font: 700 1.6rem/1 var(--display); }
.modal-card .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 1.4rem; }
#flash { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; z-index: 30; font-size: .9rem; max-width: calc(100vw - 32px); }

@media (max-width: 1180px) {
  .layout { grid-template-columns: 1fr 1fr; }
  .center { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 680px) {
  .layout { grid-template-columns: 1fr; }
  .menu { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.capline { display: flex; gap: 6px; align-items: flex-start; font-size: .8rem; line-height: 1.35; margin-top: 3px; color: var(--ink); }
.capline .i { width: 16px; height: 16px; color: var(--soutien); margin-top: 1px; }
.capline b { color: var(--soutien); font-weight: 600; }

.ccard:disabled { opacity: 1; cursor: default; }
.ccard .stats { font-size: .8rem; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ccard .stats em { color: var(--ink-soft); font-style: normal; font-size: .74rem; }
.capline.none { color: var(--ink-soft); font-style: italic; }
.upline { display: flex; gap: 6px; align-items: flex-start; font-size: .76rem; line-height: 1.3; color: var(--ink-soft); }
.upline .i { width: 14px; height: 14px; color: var(--essaim); margin-top: 1px; }
.tree .rk { font-size: .7rem; color: var(--ink-soft); margin-top: 2px; }
.tree .r { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tree .r.r3 { grid-template-columns: 1fr; }
.tree .node { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 6px 7px; font-size: .78rem; opacity: 1; cursor: default; }
.tree .node .np { font: 600 .66rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tree .node b { font-size: .86rem; }
.tree .node .nt { line-height: 1.3; }
.tree .node .ns { font: 600 .7rem/1.2 var(--display); letter-spacing: .04em; color: var(--ink-soft); margin-top: 2px; }
.tree .node.can { border-color: var(--essaim); box-shadow: inset 0 0 0 1px var(--essaim); }
.tree .node.can .ns { color: var(--essaim); }
.tree .node.taken .np, .tree .node.taken .ns, .tree .node.taken .nt { color: rgba(255,255,255,.88); }
.tree .node.closed { opacity: .55; }

.tree .node.closed, .tree .node.needR1 { opacity: .55; }
.tree .node .bar { display: block; height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 3px; }
.tree .node .bar i { display: block; height: 100%; background: var(--essaim); }
.tree .node .inv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tree .node .inv button { border: 1px solid var(--essaim); color: var(--essaim); background: var(--panel); border-radius: 4px; padding: 3px 8px; font-size: .76rem; font-weight: 600; }
.tree .node.taken .bar { display: none; }
.cell.hot .toks { pointer-events: none; }
.cghost:has(+ .toks) { justify-content: flex-start; padding-top: 2px; }
.cghost:has(+ .toks) .i { width: 10px; height: 10px; }
.tcard .capline .i { color: var(--wall); } .tcard .capline b { color: var(--wall); }
.tcard:disabled { opacity: 1; cursor: default; }
.slot.go { display: block; width: 100%; text-align: left; border: 1px solid var(--hot); background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 600; }

/* accueil et jeu en ligne */
.handoff.home { --c: var(--ink); }
.home-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 18px; }
.home-acts button { border: 1px solid var(--rule); background: var(--panel); padding: 9px 14px; border-radius: 6px; }
.home-acts button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.home-acts.join input { font: 700 1.3rem/1 var(--display); letter-spacing: .3em; text-transform: uppercase; text-align: center; width: 8.5em; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel-2); color: var(--ink); }
.bigcode { letter-spacing: .12em; }
.ho-card .link { font-size: .85rem; word-break: break-all; color: var(--ink); }
.code-chip { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; color: var(--ink-soft); padding: 0 4px; }
.code-chip b { color: var(--ink); letter-spacing: .08em; }
.phase.waiting { opacity: .85; }

/* animations (lot 1) : calque au-dessus du plateau, jamais cliquable */
#fx { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 40; pointer-events: none; }
#fx > * { position: absolute; pointer-events: none; }
#fx .tok.ghost { margin: 0; z-index: 2; }
#fx .float { font: 700 .95rem/1 var(--display); white-space: nowrap; text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel); z-index: 3; }
#fx .float.tile-dmg { color: var(--wall); } #fx .float.cr-dmg { color: var(--danger); } #fx .float.bio { color: var(--essaim); font-size: .8rem; }
#fx .shot { width: 8px; height: 8px; border-radius: 50%; background: var(--support); box-shadow: 0 0 0 2px var(--support-bg); z-index: 3; }
#fx .turn-banner { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; font: 600 1rem/1.2 var(--display); letter-spacing: .02em; max-width: calc(100vw - 32px); text-align: center; border-left: 5px solid var(--c, var(--hot)); z-index: 50; }
#fx .turn-banner.essaim { --c: var(--essaim); } #fx .turn-banner.colonie { --c: var(--colonie); }

/* animations (lot 2) et cartes de sortilège en main */
#fx .float.heal { color: var(--sup); }
#fx .beam { width: 4px; height: 60px; border-radius: 2px; background: linear-gradient(var(--off), transparent); transform-origin: bottom; z-index: 3; }

  function nextStep(u, k) {
    if (k === 4) return [u, 3];
    if (k === 1) return [0, 0];
    if (Math.abs(u) <= k - 2) return [u, k - 1];
    return [u - Math.sign(u), k];
  }
  const isSupportCell = (x, y) => x !== 0 && Math.abs(x) === Math.abs(y) && ring(x, y) <= 3;
  const supportLanes = (x, y) => [y > 0 ? "N" : "S", x > 0 ? "E" : "O"];
  const supportInner = (x, y) => [key(x - Math.sign(x), y), key(x, y - Math.sign(y))];
  const neighbors = (x, y) => [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
  function supportWalls(x, y) {
    return neighbors(x, y).filter(([a, b]) => ring(a, b) <= 3 && cellLane(a, b)).map(([a, b]) => key(a, b));
  }

  // ------------------------------------------------------------------ outils
  let RNG = Math.random;
  const setRng = f => { RNG = f; };
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  // Événements visuels (animations) : S.fx n'existe que pendant une action, créé et vidé par l'appelant
  // (interface locale ou serveur). Purement descriptif : n'a aucun effet sur les règles.
  const fx = (S, e) => { if (S.fx) S.fx.push(e); };
  const log = (S, who, msg) => { S.log.unshift({ r: S.round, who, msg }); if (S.log.length > 250) S.log.pop(); };

  // ------------------------------------------------------------------ mise en place
  function newGame() {
    const S = {
      round: 1, phase: "A_start", view: "essaim", handoff: "essaim", winner: null, nextId: 1,
      tiles: {}, supports: {}, chantiers: { N: [], E: [], S: [], O: [] }, chPerLane: 1, toPlace: [], pendingRocket: 0,
      workersBase: 3, floors: 0, rocketPts: 0, techBonus: 0,
      tileDeck: [], tileDiscard: [], hand: [],
      spellDeck: [], spellDiscard: [], spells: [],
      alloc: { N: 0, E: 0, S: 0, O: 0 }, extraPts: 0, cadence: false, firedSupports: [],
      biomass: 3, budget: 0, reserve: 0, famine: 0,
      piles: { 1: [], 2: [], 3: [] }, handA: [], creatures: [], reincQueue: [], reincUsed: false, raidUsed: false,
      upgrades: { aggro: { r1: null, r2: null }, tank: { r1: null, r2: null }, soutien: { r1: null, r2: null } }, invest: {},
      stase: [], log: [],
    };
    for (const lane of LANES) {
      const [x, y] = toGlobal(lane, 0, 1);
      S.tiles[key(x, y)] = { name: START_WALL, hp: 2, max: 2, ep: 1, ren: 0, tech: 0, temp: 0, trap: 0, revealed: true };
    }
    for (const sx of [1, -1]) for (const sy of [1, -1]) S.supports[key(sx, sy)] = 1;
    for (const [n, t] of Object.entries(TILES)) for (let i = 0; i < t.n; i++) S.tileDeck.push(n);
    shuffle(S.tileDeck);
    for (const [n, s] of Object.entries(SPELLS)) for (let i = 0; i < s.n; i++) S.spellDeck.push(n);
    shuffle(S.spellDeck);
    addPile(S, 1, "aggro"); addPile(S, 1, "tank"); addPile(S, 1, "soutien");
    drawTiles(S);
    log(S, "jeu", "Nouvelle partie. L'essaim commence.");
    startAttackerTurn(S);
    return S;
  }
  function addPile(S, lvl, type) {
    for (const [name, n] of PILES[lvl][type]) for (let i = 0; i < n; i++) S.piles[lvl].push(name);
    shuffle(S.piles[lvl]);
  }

  // ------------------------------------------------------------------ dérivés
  const tier = S => { let t = 0; TIERS.forEach((r, i) => { if (S.biomass >= r.min) t = i; }); return t; };
  const capOf = S => TIERS[tier(S)].cap;
  const laneCount = (S, lane) => S.creatures.filter(c => c.lane === lane).length;
  const tech = S => Object.values(S.tiles).reduce((a, t) => a + (t.tech || 0), 0) + S.techBonus;
  const spellsPerTurn = S => { const t = tech(S); return t >= 9 ? 3 : t >= 6 ? 2 : t >= 3 ? 1 : 0; };
  const bonusWorkers = S => Object.values(S.tiles).reduce((a, t) => a + (t.temp || 0), 0) + 2 * Object.values(S.supports).filter(l => l === 3).length;
  const totalPoints = S => S.workersBase + bonusWorkers(S) + S.extraPts;
  const allocated = S => LANES.reduce((a, l) => a + S.alloc[l], 0);
  const handSize = S => 4 * S.chPerLane;
  const posKey = c => { const [x, y] = toGlobal(c.lane, c.u, c.k); return c.k === 4 ? "in:" + c.lane + ":" + c.u : key(x, y); };
  const caseMates = (S, c) => S.creatures.filter(o => o !== c && posKey(o) === posKey(c));
  const anySoutien = S => S.creatures.some(c => CREATURES[c.name].type === "soutien");
  const clairvoyance = S => S.upgrades.soutien.r2 === "C" && anySoutien(S);
  function hasMobility(S, c) {
    if (CREATURES[c.name].type === "aggro" && S.upgrades.aggro.r1 === "B") return true;
    return caseMates(S, c).some(o => o.name === "Catalyseur" && o.instinct === "mobilite" && o.instinctTarget === c.id);
  }
  function isStealthy(S, c) {
    if (CREATURES[c.name].type === "soutien" && S.upgrades.soutien.r1 === "A") return true;
    return caseMates(S, c).some(o => o.name === "Catalyseur" && o.instinct === "furtivite" && o.instinctTarget === c.id);
  }
  function hasPercee(S, c) { return caseMates(S, c).some(o => o.name === "Perforeur"); }
  function bonusHp(S, c) { return CREATURES[c.name].type === "tank" && S.upgrades.tank.r2 === "B" ? caseMates(S, c).length : 0; }
  function maxHp(S, name) {
    const b = CREATURES[name]; let m = b.pv;
    if (b.type === "tank") { if (S.upgrades.tank.r1 === "A") m += 2; if (S.upgrades.tank.r2 === "A") m += 4; }
    if (b.type === "soutien" && S.upgrades.soutien.r1 === "A") m += 1;
    return m;
  }
  function baseAtq(S, name) {
    const b = CREATURES[name]; let a = b.atq;
    if (b.type === "aggro") { if (S.upgrades.aggro.r1 === "A") a += 1; if (S.upgrades.aggro.r2 === "A") a += 2; }
    return a;
  }
  function frenzyTarget(S, c) { // la créature doublée par un soutien Frénésie de sa case : la plus forte des autres
    if (S.upgrades.soutien.r2 !== "B") return false;
    const mates = caseMates(S, c);
    const frenzySources = mates.filter(o => CREATURES[o.name].type === "soutien");
    if (!frenzySources.length) return false;
    // pour chaque soutien, l'autre créature de plus forte ATQ de la case est doublée
    return frenzySources.some(src => {
      const others = S.creatures.filter(o => o !== src && posKey(o) === posKey(src));
      others.sort((a, b) => baseAtq(S, b.name) - baseAtq(S, a.name) || a.id - b.id);
      return others[0] === c;
    });
  }
  function effAtq(S, c) {
    if (!attacks(c)) return 0;
    let a = baseAtq(S, c.name);
    if (caseMates(S, c).some(o => o.name === "Hurleur")) a += 1; // Aura Fureur, non cumulable
    if (S.upgrades.soutien.r1 === "B" && caseMates(S, c).some(o => CREATURES[o.name].type === "soutien")) a += 1; // Aura Griffes, non cumulable, cumulable avec Fureur
    if (frenzyTarget(S, c)) a *= 2;
    return a;
  }
  function soinValue(S, c) { // aura de soin la plus forte présente sur la case (hors soi)
    let v = 0;
    for (const o of caseMates(S, c)) {
      if (CREATURES[o.name].type !== "soutien") continue;
      if (S.upgrades.soutien.r2 === "A") v = Math.max(v, 2);
      if (o.name === "Glaneur") v = Math.max(v, 1);
    }
    return v;
  }

  // ------------------------------------------------------------------ tuiles et supports
  function tileStats(name, x, y) {
    const t = TILES[name], r = ring(x, y), lane = cellLane(x, y);
    let pv = t.pv;
    if (pv === "ap") pv = lane === t.dir ? 4 : 2;
    if (pv === "front") pv = 1 + r;
    if (pv === "reduit") pv = 5 - r;
    return { name, hp: pv, max: pv, ep: t.ep, ren: t.ren || 0, tech: t.tech || 0, temp: t.temp || 0, trap: t.trap || 0, camo: t.camo || 0, revealed: !t.camo };
  }
  function epinesOf(S, k) {
    let e = S.tiles[k].ep;
    // support de niveau 2 : +1 Épines, seulement aux tuiles qui ont déjà des Épines (décision d'Oni, 30/10/2026)
    if (e > 0 && Object.entries(S.supports).some(([sk, l]) => l === 2 && supportWalls(...parse(sk)).includes(k))) e += 1;
    return e;
  }
  function destroyTile(S, k, why) {
    const t = S.tiles[k]; if (!t) return;
    delete S.tiles[k];
    if (t.name !== START_WALL) S.tileDiscard.push(t.name);
    S.biomass += 1;
    fx(S, { t: "tileDown", k });
    log(S, "essaim", `${t.name} détruit${why ? " (" + why + ")" : ""} : +1 biomasse.`);
    checkSupportsFall(S);
  }
  function checkSupportsFall(S) {
    for (const sk of Object.keys(S.supports)) {
      if (!supportWalls(...parse(sk)).some(w => S.tiles[w])) {
        log(S, "essaim", `Le support de niveau ${S.supports[sk]} tombe : +1 biomasse.`);
        delete S.supports[sk];
        S.biomass += 1;
        fx(S, { t: "tileDown", k: sk });
      }
    }
  }
  function placeSupports(S) {
    for (let r = 1; r <= 3; r++) for (const sx of [1, -1]) for (const sy of [1, -1]) {
      const x = sx * r, y = sy * r, k = key(x, y);
      if (!S.supports[k] && supportInner(x, y).every(w => S.tiles[w])) {
        S.supports[k] = r;
        fx(S, { t: "supUp", k });
        log(S, "colonie", `Un support de niveau ${r} apparaît en couronne ${r}.`);
      }
    }
  }
  // Un bâtiment qui sort de chantier sur une case occupée fait reculer les créatures d'une case vers le fond
  // (même colonne, couronne +1). Si cette case porte déjà une tuile, elles reculent jusqu'à la première case libre.
  function pushBack(S, k) {
    const here = S.creatures.filter(c => c.k < 4 && posKey(c) === k);
    if (!here.length) return;
    const { lane, u } = here[0];
    let nk = here[0].k + 1;
    while (nk < 4 && S.tiles[key(...toGlobal(lane, u, nk))]) nk++;
    fx(S, { t: "push", ids: here.map(c => c.id), lane, u, to: nk });
    for (const c of here) c.k = nk;
    const where = nk === 4 ? "sur la case d'entrée" : `en couronne ${nk}`;
    log(S, "colonie", `${here.map(c => c.name).join(", ")} recule${here.length > 1 ? "nt" : ""} ${where} pour laisser place au bâtiment.`);
  }
  function canTarget(S, lane, k) { // case cible valable pour un chantier de cette lane
    const [x, y] = parse(k);
    if (ring(x, y) > 3 || ring(x, y) < 1 || cellLane(x, y) !== lane) return false;
    if (S.tiles[k]) return false;
    return neighbors(x, y).some(([a, b]) => (a === 0 && b === 0) || S.tiles[key(a, b)] || S.supports[key(a, b)]);
  }

  // ------------------------------------------------------------------ créatures
  function makeCreature(S, name, lane, u, extra) {
    const c = { id: S.nextId++, name, lane, u, k: 4, hp: maxHp(S, name), new: true, acted: false, ...extra };
    if (name === "Catalyseur") { c.instinct = "mobilite"; c.instinctTarget = null; }
    return c;
  }
  function killCheck(S) {
    const dead = S.creatures.filter(c => c.hp + bonusHp(S, c) <= 0);
    for (const c of dead) {
      S.creatures.splice(S.creatures.indexOf(c), 1);
      fx(S, { t: "die", id: c.id });
      log(S, "colonie", `${c.name} est détruit.`);
      if (CREATURES[c.name].type === "tank" && S.upgrades.tank.r2 === "C" && !S.reincUsed) {
        S.reincUsed = true;
        S.reincQueue.push({ name: c.name, lane: c.lane, u: c.u });
        log(S, "essaim", `Réincarnation : ${c.name} reviendra au début du prochain tour de l'essaim.`);
      } else {
        S.piles[CREATURES[c.name].lvl].push(c.name); shuffle(S.piles[CREATURES[c.name].lvl]);
      }
    }
    // Catalyseur : la cible d'Instinct doit rester sur sa case
    for (const c of S.creatures) if (c.name === "Catalyseur") {
      const mates = caseMates(S, c);
      if (!mates.some(o => o.id === c.instinctTarget)) c.instinctTarget = mates.length ? mates[0].id : null;
    }
  }
  function damageCreature(S, c, n, why) {
    c.hp -= n;
    fx(S, { t: "dmg", id: c.id, n, hp: c.hp + bonusHp(S, c) });
    log(S, "colonie", `${c.name} subit ${n} dégât${n > 1 ? "s" : ""}${why ? " (" + why + ")" : ""}.`);
  }
  // cible imposée par Protection puis Leurre ; renvoie null si la créature est intouchable (Furtivité)
  function resolveTarget(S, c) {
    const mates = caseMates(S, c);
    if (isStealthy(S, c) && mates.some(o => !isStealthy(S, o))) return null;
    let t = c;
    if (CREATURES[t.name].type !== "tank" && S.upgrades.tank.r1 === "B") {
      const tank = mates.find(o => CREATURES[o.name].type === "tank");
      if (tank) t = tank;
    }
    const group = [t, ...caseMates(S, t)];
    if (group.some(o => o.name === "Phéromone")) {
      const visible = group.filter(o => !(isStealthy(S, o) && group.some(p => !isStealthy(S, p))));
      visible.sort((a, b) => (b.hp + bonusHp(S, b)) - (a.hp + bonusHp(S, a)) || a.id - b.id);
      t = visible[0] || t;
    }
    return t;
  }
  const targetable = (S, c) => resolveTarget(S, c) !== null;

  // trajet : renvoie {stand:[u,k], target:'fusee'|clé de tuile}
  function walk(S, c) {
    let u = c.u, k = c.k;
    for (;;) {
      const [nu, nk] = nextStep(u, k);
      if (nk === 0) return { stand: [u, k], target: "fusee" };
      const [x, y] = toGlobal(c.lane, nu, nk), tk = key(x, y);
      if (S.tiles[tk]) return { stand: [u, k], target: tk };
      u = nu; k = nk;
    }
  }
  function laneTiles(S, lane) { return Object.keys(S.tiles).filter(k => cellLane(...parse(k)) === lane); }

  const cellName = (u, k) => (k === 4 ? "entrée " + COLS[u + 2] : COLS[u + 2] + k);
  const attacks = c => CREATURES[c.name].type !== "soutien";
  function act(S, c, chosenTarget) {
    if (c.acted) return;
    c.acted = true;
    const w = walk(S, c), from = cellName(c.u, c.k);
    if (c.u !== w.stand[0] || c.k !== w.stand[1]) fx(S, { t: "move", id: c.id, lane: c.lane, from: [c.u, c.k], to: [w.stand[0], w.stand[1]] });
    c.u = w.stand[0]; c.k = w.stand[1];
    const to = cellName(c.u, c.k), tgt = w.target === "fusee" ? "la fusée" : `${cellName(...toLocal(c.lane, ...parse(w.target)))}`;
    log(S, "essaim", `${c.name} (lane ${LANE_NAME[c.lane]}) : ${from === to ? "reste en " + from : from + " → " + to}, devant ${tgt}.`);
    if (!attacks(c)) { // les soutiens avancent avec l'essaim mais n'attaquent jamais (ils ne s'empalent pas sur les Épines)
      log(S, "essaim", `${c.name} avance sans attaquer.`);
      return;
    }
    const auras = [];
    if (caseMates(S, c).some(o => o.name === "Hurleur")) auras.push("Fureur");
    if (S.upgrades.soutien.r1 === "B" && caseMates(S, c).some(o => CREATURES[o.name].type === "soutien")) auras.push("Griffes");
    if (frenzyTarget(S, c)) auras.push("Frénésie");
    if (hasPercee(S, c)) auras.push("Percée");
    if (auras.length) fx(S, { t: "aura", id: c.id, names: auras });
    let target = w.target;
    if (chosenTarget && hasMobility(S, c) && laneTiles(S, c.lane).includes(chosenTarget)) target = chosenTarget;
    const dmg = effAtq(S, c);
    if (target === "fusee") {
      S.workersBase -= 1; // une attaque contre la fusée tue un seul travailleur, quelle que soit la force
      fx(S, { t: "rocket", id: c.id });
      log(S, "essaim", `${c.name} frappe la fusée : −1 travailleur.`);
      if (S.workersBase <= 0) { S.winner = "essaim"; log(S, "jeu", "La colonie n'a plus de travailleurs : l'essaim gagne."); }
      return;
    }
    hitTile(S, c, target, dmg, true);
    killCheck(S);
  }
  function hitTile(S, c, tk, dmg, primary) {
    const t = S.tiles[tk]; if (!t) return;
    const [x, y] = parse(tk), lane = cellLane(x, y);
    const epVal = epinesOf(S, tk); // calculé avant les dégâts : la tuile peut tomber
    if (t.camo && !t.revealed) { // Camouflage : la première attaque retourne la tuile
      t.revealed = true;
      fx(S, { t: "reveal", k: tk, trap: !!t.trap });
      if (t.trap) {
        if (!clairvoyance(S)) damageCreature(S, c, 2, "piège");
        log(S, "essaim", "Un piège est révélé.");
      } else log(S, "essaim", `Tuile camouflée révélée : ${t.name}.`);
    }
    if (S.stase.includes(lane)) {
      fx(S, { t: "hit", id: c.id, k: tk, n: 0, hp: t.hp });
      log(S, "colonie", `Champ de stase : ${t.name} ne subit aucun dégât.`);
    } else {
      const loss = t.ren ? Math.floor(dmg / t.ren) : dmg;
      const capacity = t.ren ? t.hp * t.ren : t.hp;
      const excess = dmg - capacity;
      t.hp -= loss;
      fx(S, { t: "hit", id: c.id, k: tk, n: Math.min(loss, t.hp + loss), hp: Math.max(0, t.hp) });
      log(S, "essaim", `${c.name} inflige ${dmg} à ${t.name} (−${Math.min(loss, t.hp + loss)} PV).`);
      if (primary && caseMates(S, c).some(o => o.name === "Sporeur")) {
        for (const [a, b] of neighbors(x, y)) {
          const nk = key(a, b), nt = S.tiles[nk];
          if (nt && !S.stase.includes(cellLane(a, b))) {
            nt.hp -= nt.ren ? Math.floor(1 / nt.ren) : 1;
            fx(S, { t: "hit", id: null, k: nk, n: nt.ren ? 0 : 1, hp: Math.max(0, nt.hp) });
            if (nt.hp <= 0) destroyTile(S, nk, "spores");
          }
        }
      }
      if (t.hp <= 0) {
        destroyTile(S, tk);
        if (excess > 0 && hasPercee(S, c)) {
          const [lu, lk] = toLocal(lane, x, y);
          const ghost = { ...c, u: lu, k: lk };
          const w = walk(S, ghost);
          if (w.target === "fusee") {
            S.workersBase -= 1;
            fx(S, { t: "rocket", id: c.id });
            log(S, "essaim", "Percée : la fusée est touchée, −1 travailleur.");
            if (S.workersBase <= 0) S.winner = "essaim";
          } else hitTile(S, c, w.target, excess, false);
        }
      }
    }
    if (primary && epVal > 0) damageCreature(S, c, epVal, "épines");
  }

  // ------------------------------------------------------------------ tour de l'essaim
  function startAttackerTurn(S) {
    S.phase = "A_start"; S.raidUsed = false; S.reincUsed = false; S.stase = [];
    for (const c of S.creatures) { c.new = false; c.acted = false; }
    // Réincarnation
    for (const r of S.reincQueue) {
      const nc = makeCreature(S, r.name, r.lane, r.u);
      S.creatures.push(nc);
      fx(S, { t: "reinc", id: nc.id });
      log(S, "essaim", `${r.name} se réincarne à l'entrée de la lane ${LANE_NAME[r.lane]}.`);
    }
    S.reincQueue = [];
    S.famine = 0;
  }
  function attackerDraw(S) {
    const t = TIERS[tier(S)];
    S.handA = [];
    for (let lvl = 3; lvl >= 1; lvl--) {
      for (let i = 0; i < t.n[lvl - 1]; i++) {
        for (let l = lvl; l >= 1; l--) if (S.piles[l].length) { S.handA.push({ name: S.piles[l].pop(), free: false, uid: S.nextId++ }); break; }
      }
    }
    if (S.upgrades.aggro.r2 === "C") {
      for (let i = 0; i < 2; i++) if (S.piles[1].length) S.handA.push({ name: S.piles[1].pop(), free: true, uid: S.nextId++ });
    }
    S.budget = Math.max(0, S.biomass - S.famine);
    fx(S, { t: "draw", n: S.handA.length });
    S.phase = "A_deploy";
    log(S, "essaim", `Palier ${tier(S) + 1} : ${S.handA.length} cartes, budget ${S.budget}.`);
  }
  function canDeploy(S, card, lane) {
    const cost = card.free ? 0 : CREATURES[card.name].cost;
    return S.phase === "A_deploy" && cost <= S.budget && laneCount(S, lane) < capOf(S);
  }
  function deploy(S, uid, lane, u) {
    const i = S.handA.findIndex(c => c.uid === uid); if (i < 0) return false;
    const card = S.handA[i];
    if (!canDeploy(S, card, lane)) return false;
    S.budget -= card.free ? 0 : CREATURES[card.name].cost;
    S.handA.splice(i, 1);
    const c = makeCreature(S, card.name, lane, u);
    S.creatures.push(c);
    fx(S, { t: "deploy", id: c.id });
    log(S, "essaim", `${card.name} déployé${card.free ? " gratuitement" : ""} en lane ${LANE_NAME[lane]}, colonne ${COLS[u + 2]}.`);
    if (card.name === "Sapeur" && S.chantiers[lane].length) {
      const ch = S.chantiers[lane].shift();

  // ------------------------------------------------------------------ sortilèges

  // ------------------------------------------------------------------ tour de la colonie

  // ------------------------------------------------------------------ actions des joueurs

          ? `<p class="hint">Choisissez la tuile de votre main.</p><div class="choices">${S.hand.map((t, i) => `<button data-a="recoHand" data-i="${i}">${E(t)}</button>`).join("")}${cancel}</div>`
          : `<p class="hint">Elle remplace quelle tuile construite ?</p><div class="choices">${Object.keys(S.tiles).filter(k => S.tiles[k].name !== SF.START_WALL).map(k => `<button data-a="spellArg" data-v="${k}">${E(tileLabel(k))}</button>`).join("")}${cancel}</div>`;
        break;
      default: inner = `<div class="choices"><button data-a="spellArg" data-v="go" class="primary">Jouer ${E(name)}</button>${cancel}</div>`;
    }
    return `<div class="targeting"><p class="hint"><b>${E(name)}</b> : ${E(SF.SPELLS[name].text)}</p>${inner}</div>`;
  }
  // carte de sortilège en main : type, moment où le jouer, effet complet
  function spellCard(s) {
    const sp = SF.SPELLS[s];
    const when = s === "Famine" ? "Offensif · au début du tour de l'essaim, avant qu'il calcule son budget"
      : sp.kind === "off" ? "Offensif · pendant le tour de l'essaim, juste avant ses attaques"
      : "Soutien · pendant votre tour, avant de passer aux tirs";
    return `<div class="spell ${sp.kind} card">${icon(spellIcon(s))}<span><b>${E(s)}</b><small class="when">${E(when)}</small><small>${E(sp.text)}</small><small class="lost">Non joué dans sa fenêtre : défaussé.</small></span></div>`;
  }
  const spellIcon = s => ({ "Frappe orbitale": "frappe", "Salve": "salve", "Barrage": "lane", "Onde de choc": "couronne", "Champ de stase": "stase", "Famine": "famine", "Brouillage": "brouillage", "Effort": "effort", "Cadence": "cadence", "Réparation": "reparation", "Renouvellement": "renouvellement", "Reconversion": "reconversion" }[s]);
  const capIcon = c => ({ vision: "vision", soin: "soin", fureur: "fureur", leurre: "leurre", percee: "percee", instinct: "instinct", sabotage: "sabotage", spores: "spores" }[c] || "aura");
  const cardOf = uid => S.handA.find(c => c.uid === uid) || { name: "?" };
  function posTxt(c) { return c.k === 4 ? `entrée ${SF.LANE_NAME[c.lane]} ${SF.COLS[c.u + 2]}` : `${SF.LANE_NAME[c.lane]} ${SF.COLS[c.u + 2]}${c.k}`; }
  function tileLabel(k) {
    const [x, y] = SF.parse(k), l = SF.cellLane(x, y), [u, r] = SF.toLocal(l, x, y);
    return `${S.tiles[k] ? (hiddenTrap(S.tiles[k]) ? "Tuile camouflée" : S.tiles[k].name) : "case"} · ${SF.LANE_NAME[l]} ${SF.COLS[u + 2]}${r}`;
  }

  // ---------------------------------------------------------------- plateau
  function hiddenTrap(t) { return t.camo && !t.revealed && S.view === "essaim" && !SF.clairvoyance(S); }
  function board() {
    const canDeployHere = (lane, u) => S.phase === "A_deploy" && S.view === "essaim" && UI.sel && SF.canDeploy(S, cardOf(UI.sel), lane);
    const placeHot = S.phase === "D_place" && S.view === "colonie" ? SF.placeTargets(S) : [];
    let html = "";
    for (let y = 4; y >= -4; y--) for (let x = -4; x <= 4; x++) {
      const r = SF.ring(x, y), k = SF.key(x, y);
      if (r === 4) { // entrées
        const lane = SF.cellLane(x, y);
        if (!lane) { html += `<div class="cell void"></div>`; continue; }
        const [u] = SF.toLocal(lane, x, y);
        if (Math.abs(u) > 2) { html += `<div class="cell void"></div>`; continue; }
        const crs = S.creatures.filter(c => c.lane === lane && c.k === 4 && c.u === u);
        const hot = canDeployHere(lane, u);
        html += `<div class="cell entry lane-${lane}${hot ? " hot" : ""}" data-xy="${k}" ${hot ? `data-a="deployAt" data-l="${lane}" data-u="${u}"` : ""}><span class="col">${SF.COLS[u + 2]}</span>${tokens(crs)}</div>`;
        continue;
      }
      if (x === 0 && y === 0) {
        html += `<div class="cell core" data-xy="${k}">${icon("fusee")}<b>${S.floors}/12</b><small>${S.workersBase} trav.</small></div>`;
        continue;
      }
      if (SF.isSupportCell(x, y)) {
        const lvl = S.supports[k];
        const ready = S.phase === "D_fire" && S.view === "colonie" && lvl && lvl < 3 && !S.firedSupports.includes(k) && SF.supportTargets(S, k).length;
        const fired = S.firedSupports.includes(k);
        html += lvl ? `<div class="cell sup${ready ? " hot" : ""}${UI.support === k ? " sel" : ""}${fired ? " spent" : ""}" data-xy="${k}" ${ready ? `data-a="support" data-k="${k}"` : ""}>
            <span class="lv">${["", "I", "II", "III"][lvl]}</span>${lvl < 3 ? icon("tourelle") + `<b>${SF.turretDmg(S, lvl)}</b>` : icon("travailleur") + "<b>+2</b>"}</div>`
          : `<div class="cell corner"><span class="lv">${["", "I", "II", "III"][r]}</span></div>`;
        continue;
      }
      const lane = SF.cellLane(x, y);
      const t = S.tiles[k];
      const crs = S.creatures.filter(c => c.k < 4 && SF.posKey(c) === k);
      const target = placeHot.includes(k);
      let inner = "";
      if (t) {
        if (hiddenTrap(t)) inner = `<div class="tile hidden"><b>?</b><small>camouflée</small></div>`;
        else {
          const ep = SF.epinesOf(S, k);
          inner = `<div class="tile${t.camo && !t.revealed ? " trap" : ""}" title="${t.camo && !t.revealed ? "Camouflée : l'essaim ne la voit pas" : ""}"><span class="tn">${E(short(t.name))}</span><b class="hp">${t.hp}<small>/${t.max}</small></b>
            <span class="tb">${ep ? icon("epines") + ep : ""}${t.ren ? icon("renforce") + t.ren : ""}${t.tech ? icon("tech") + t.tech : ""}${t.temp ? icon("temp") : ""}</span></div>`;
        }
      }
      const stased = S.stase.includes(lane);
      html += `<div class="cell lane lane-${lane} r${r}${target ? " hot" : ""}${stased ? " stase" : ""}" data-xy="${k}" ${target ? `data-a="placeAt" data-k="${k}"` : ""}>${inner}${tokens(crs)}</div>`;
    }
    return `<div class="board" role="grid" aria-label="Plateau">${html}</div>
      <div class="legend"><span><i class="sw lane-N"></i>Nord</span><span><i class="sw lane-E"></i>Est</span><span><i class="sw lane-S"></i>Sud</span><span><i class="sw lane-O"></i>Ouest</span><span>Lettres : colonnes d'entrée</span></div>`;
  }
  // Carte de tuile en main : durée, PV, Épines et capacités (libellés du Catalogue du livret v0.3)
  function tileCard(name) {
    const t = SF.TILES[name], L = SF.LANE_NAME;
    const pv = t.pv === "ap" ? `2 (4 en lane ${L[t.dir]})` : t.pv === "front" ? "2 à 4" : t.pv === "reduit" ? "2 à 4" : t.pv;
    const caps = [];
    const cap = (ic, n, txt) => caps.push(`<span class="capline">${icon(ic)}<span><b>${E(n)}</b> : ${E(txt)}</span></span>`);
    if (t.pv === "ap") cap("cardinal", "Avant-poste", `+2 PV si posé dans la lane ${L[t.dir]} (4 PV), sinon 2 PV.`);
    if (t.pv === "front") cap("couronne", "Ligne de front", "PV = 1 + couronne (2 / 3 / 4) : plus solide loin de la fusée.");
    if (t.pv === "reduit") cap("couronne", "Réduit", "PV = 5 − couronne (4 / 3 / 2) : plus solide près de la fusée.");
    if (t.ren) cap("renforce", `Renforcé ${t.ren}`, `ne perd 1 PV que par tranche complète de ${t.ren} dégâts d'une même attaque.`);
    if (t.tech) cap("tech", `+${t.tech} technologie${t.tech > 1 ? "s" : ""}`, "compte dans votre total de technologies tant que la tuile tient.");
    if (t.temp) cap("temp", "Travailleur temporaire", "+1 travailleur tant que la tuile tient.");
    if (t.perm) cap("perm", "Travailleur permanent", "+1 travailleur gagné à la construction, conservé même si la tuile tombe.");
    if (t.camo) cap("piege", "Camouflage", "posée face cachée : l'essaim ne la voit pas. Retournée à la première attaque ou par Vision / Clairvoyance.");
    if (t.trap) cap("piege", "Piège", "2 dégâts à la créature qui le révèle en l'attaquant. Un piège rendu visible par Vision ou Clairvoyance ne se déclenche plus.");
    if (t.ep) cap("epines", `Épines ${t.ep}`, `${t.ep} dégât${t.ep > 1 ? "s" : ""} à la créature qui l'attaque, après son attaque (+1 si la tuile touche un support de niveau 2).`);
    return `<b>${E(name)}</b><small>${icon("duree")} ${t.d} point${t.d > 1 ? "s" : ""} de construction</small>
      <span class="stats">${icon("pv")} ${pv} PV${t.ep ? ` · ${icon("epines")} Épines ${t.ep}` : " · sans Épines"}</span>${caps.join("")}`;
  }
  const short = n => ({ "Haie de départ": "Départ", "Haie d'épines": "Haie", "Mur hérissé": "Hérissé", "Avant-poste du Nord": "Av.-poste N", "Avant-poste de l'Est": "Av.-poste E", "Avant-poste du Sud": "Av.-poste S", "Avant-poste de l'Ouest": "Av.-poste O", "Ligne de front": "Front", "Observatoire": "Observ.", "Laboratoire": "Labo", "Baraquement": "Baraq." }[n] || n);
  function tokens(crs) {
    if (!crs.length) return "";
    return `<div class="toks">` + crs.map(c => {
      const t = SF.CREATURES[c.name].type;
      const cls = `tok ${t}${UI.selCreature === c.id ? " sel" : ""}${c.acted && S.phase === "A_attack" ? " done" : ""}${c.new ? " new" : ""}`;
      return `<button class="${cls}" data-a="creature" data-id="${c.id}" title="${E(c.name)}"><span>${SF.effAtq(S, c)}</span><span>${c.hp + SF.bonusHp(S, c)}</span></button>`;
    }).join("") + `</div>`;
  }
  function detail() {
    const c = S.creatures.find(o => o.id === UI.selCreature);
    if (!c) return `<p class="detail empty">Touchez une créature pour voir sa carte.</p>`;
    const b = SF.CREATURES[c.name];
    const extras = [];
    if (SF.hasMobility(S, c)) extras.push("Mobilité");
    if (SF.isStealthy(S, c)) extras.push("Furtivité");
    if (SF.caseMates(S, c).some(o => o.name === "Perforeur")) extras.push("Percée");
    let actions = "";
    if (S.view === "essaim" && c.name === "Catalyseur" && ["A_deploy", "A_upgrade"].includes(S.phase)) {
      const mates = SF.caseMates(S, c);
      actions += `<div class="choices"><span class="lab">Instinct :</span>` +
        ["mobilite", "furtivite"].map(v => `<button data-a="instinct" data-id="${c.id}" data-v="${v}" class="${c.instinct === v ? "on" : ""}">${v === "mobilite" ? "Mobilité" : "Furtivité"}</button>`).join("") +
        mates.map(m => `<button data-a="instTarget" data-id="${c.id}" data-v="${m.id}" class="${c.instinctTarget === m.id ? "on" : ""}">→ ${E(m.name)}</button>`).join("") + `</div>`;
    }
    if (S.view === "essaim" && S.phase === "A_upgrade" && b.type === "aggro" && S.upgrades.aggro.r2 === "B" && !S.raidUsed) {
      const i = SF.LANES.indexOf(c.lane);
      actions += `<div class="choices"><span class="lab">Raid :</span>${[SF.LANES[(i + 1) % 4], SF.LANES[(i + 3) % 4]].map(l => `<button data-a="raid" data-id="${c.id}" data-v="${l}">Vers ${SF.LANE_NAME[l]}</button>`).join("")}</div>`;
    }
    return `<section class="detail ${b.type}"><div class="d-head">${icon(b.type)}<b>${E(c.name)}</b><span>${b.type} · niveau ${["", "I", "II", "III"][b.lvl]}</span></div>
      <p>${icon("atq")} ATQ ${SF.effAtq(S, c)}${SF.attacks(c) ? "" : " (n'attaque pas : avance avec l'essaim)"} · ${icon("pv")} PV ${c.hp + SF.bonusHp(S, c)}/${SF.maxHp(S, c.name)} · ${posTxt(c)}</p>
      ${b.cap ? `<p class="capline">${icon(capIcon(b.cap))}<span><b>${E(b.capName)}</b> : ${E(b.capText)}</span></p>` : ""}${extras.length ? `<p>Gagne : ${extras.join(", ")}.</p>` : ""}${actions}</section>`;
  }

  // ---------------------------------------------------------------- panneaux
  function colonyPanel() {
    const mine = S.view === "colonie";
    const pts = SF.totalPoints(S), used = SF.allocated(S);
    const floors = Array.from({ length: 12 }, (_, i) => `<i class="fl${i < S.floors ? " on" : ""}${[2, 5, 8, 11].includes(i) ? " ms" : ""}">${i + 1}</i>`).join("");
    let ateliers = "";
    for (const l of SF.LANES) {
      const chs = S.chantiers[l];
      const slots = Array.from({ length: S.chPerLane }, (_, i) => {
        const ch = chs[i];
        if (!ch) return mine && S.phase === "D_main" && UI.sel !== null && UI.spell === null && chs.length < S.chPerLane
          ? `<button data-a="startCh" data-l="${l}" class="slot empty go">Construire ici : ${E(S.hand[UI.sel])}</button>` : `<div class="slot empty">libre</div>`;
        const hide = !ch.tile || (SF.TILES[ch.tile].camo && !mine);
        return `<div class="slot">${E(hide ? "?" : ch.tile)} · ${ch.left} pt${ch.left > 1 ? "s" : ""}${mine && ch.fresh && S.phase === "D_main" ? ` <button data-a="cancelCh" data-l="${l}" data-i="${i}" class="x" aria-label="Annuler">×</button>` : ""}</div>`;
      }).join("");
      const step = mine && S.phase === "D_main" ? `<span class="step"><button data-a="alloc" data-l="${l}" data-d="-1" aria-label="Retirer un point">−</button><b>${S.alloc[l]}</b><button data-a="alloc" data-l="${l}" data-d="1" aria-label="Ajouter un point">+</button></span>` : `<b class="pts">${S.alloc[l]}</b>`;
      ateliers += `<div class="atelier lane-${l}"><span class="al">${l}</span><div class="slots">${slots}</div>${step}</div>`;
    }
    const hand = mine
      ? `<div class="hand">${S.hand.map((t, i) => `<button data-a="tile" data-i="${i}" class="tcard${UI.sel === i ? " sel" : ""}"${S.phase === "D_main" ? "" : " disabled"}>${tileCard(t)}</button>`).join("")}</div>`
      : `<p class="hidden-hand">${S.hand.length} tuiles en main (cachées)</p>`;
    const spells = mine ? (S.spells.length ? `<div class="spells">${S.spells.map(s => spellCard(s)).join("")}</div>` : `<span class="muted">aucun</span>`) : `<span class="muted">${S.spells.length} en main (cachés)</span>`;
    return `<h3>${icon("fusee")} Colonie</h3>
      <div class="kv"><span>Travailleurs</span><b>${S.workersBase}${SF.bonusWorkers(S) ? ` + ${SF.bonusWorkers(S)}` : ""}</b></div>
      <div class="kv"><span>Technologies</span><b>${SF.tech(S)} → ${SF.spellsPerTurn(S)} sort./tour</b></div>
      <div class="floors">${floors}</div><p class="small">Fusée : ${S.floors}/12 étages · ${S.rocketPts}/${SF.floorCost(S)} points vers le suivant. Un étage coûte 3 points (étages 1 à 3), puis 4, 5 et 6 après les paliers 3 · 6 · 9.</p>
      <h4 data-fx="ateliers">Ateliers ${mine && S.phase === "D_main" ? `<span class="small">points ${used}/${pts} · fusée ${pts - used}</span>` : ""}</h4>${ateliers}
      <h4 data-fx="tilehand">Main de tuiles</h4>${hand}<h4>Sortilèges</h4>${spells}`;
  }
  function swarmPanel() {
    const mine = S.view === "essaim";
    const t = SF.TIERS[SF.tier(S)];
    const acquired = ty => { // améliorations acquises pour ce type
      const u = S.upgrades[ty], out = [];
      if (u.r1) out.push(SF.TREES[ty][u.r1 + "1"]);
      if (u.r2) out.push(SF.TREES[ty][u.r2 + "2"]);
      return out;
    };
    const hand = mine
      ? (S.handA.length ? `<div class="hand">${S.handA.map(c => {
        const b = SF.CREATURES[c.name];
        const atq = SF.baseAtq(S, c.name), pv = SF.maxHp(S, c.name);
        const ups = acquired(b.type).map(([n, txt]) => `<span class="upline">${icon("palier")}<span><b>${E(n)}</b> : ${E(txt)}</span></span>`).join("");
        return `<button data-a="card" data-uid="${c.uid}" class="ccard ${b.type}${UI.sel === c.uid ? " sel" : ""}"${S.phase === "A_deploy" ? "" : " disabled"}><span class="cost">${c.free ? "0" : b.cost}</span>
          <b>${E(c.name)}</b><small>${b.type} · niveau ${b.lvl}${c.free ? " · gratuit" : ""}</small>
          <span class="stats">${b.type === "soutien" ? `${icon("atq")} 0 ATQ <em>(n'attaque pas)</em>` : `${icon("atq")} ${atq} ATQ${atq !== b.atq ? ` <em>(base ${b.atq})</em>` : ""}`} · ${icon("pv")} ${pv} PV${pv !== b.pv ? ` <em>(base ${b.pv})</em>` : ""}</span>
          ${b.cap ? `<span class="capline">${icon(capIcon(b.cap))}<span><b>${E(b.capName)}</b> : ${E(b.capText)}</span></span>` : `<span class="capline none">Aucune capacité propre.</span>`}${ups}</button>`;
      }).join("")}</div>` : `<p class="muted">Pas de cartes en main.</p>`)
      : `<p class="hidden-hand">${S.handA.length} cartes en main (cachées)</p>`;
    let trees = "";
    const POS = { A1: "Côté A", B1: "Côté B", A2: "Après A", C2: "Centre", B2: "Après B" };
    for (const ty of ["aggro", "tank", "soutien"]) {
      const u = S.upgrades[ty], T = SF.TREES[ty];
      const node = slot => {
        const st = SF.nodeState(S, ty, slot), cost = SF.nodeCost(slot), got = SF.invested(S, ty, slot);
        const avail = SF.investable(S);
        const canInv = mine && st === "open" && avail > 0 && ["A_deploy", "A_upgrade"].includes(S.phase);
        let state, cls = st;
        if (st === "taken") state = "Acquis";
        else if (st === "closed") state = got ? "Fermé" : (u.r1 && !slot.endsWith("1") && slot !== "C2" && u.r1 !== slot[0] ? `Fermé : demande ${T[slot[0] + "1"][0]}` : "Fermé : biomasse déjà engagée sur l'autre choix de ce rang");
        else if (st === "needR1") state = "Demande d'abord un rang 1";
        else state = `${got} / ${cost} investis`;
        const bar = st === "open" || got ? `<span class="bar"><i style="width:${Math.round(100 * got / cost)}%"></i></span>` : "";
        const btns = canInv ? `<span class="inv"><button data-a="invest" data-t="${ty}" data-s="${slot}" data-n="1">+1</button><button data-a="invest" data-t="${ty}" data-s="${slot}" data-n="99">Tout investir (${Math.min(avail, cost - got)})</button></span>` : "";
        return `<div class="node ${cls}${canInv ? " can" : ""}" data-node="${ty}:${slot}"><span class="np">${POS[slot]}</span><b>${E(T[slot][0])}</b><span class="nt">${E(T[slot][1])}</span>${bar}<span class="ns">${E(state)}</span>${btns}</div>`;
      };
      trees += `<div class="tree ${ty}"><span class="tt">${icon(ty)}${ty}</span>
        <span class="rk">Rang 1 · ${SF.COST_R1} biomasse · 1 choix sur 2 · ajoute les cartes de niveau 2</span><div class="r">${node("A1")}${node("B1")}</div>
        <span class="rk">Rang 2 · ${SF.COST_R2} biomasse · 1 choix sur 3 · ajoute les cartes de niveau 3</span><div class="r r3">${node("A2")}${node("C2")}${node("B2")}</div></div>`;
    }
    return `<h3>${icon("spores")} Essaim</h3>
      <div class="kv"><span>Biomasse</span><b>${S.biomass}</b></div>
      <div class="kv"><span>Palier</span><b>${SF.tier(S) + 1} · pioche ${t.n.join("/")} · plafond ${t.cap}</b></div>
      <div class="kv" data-fx="budget"><span>Budget du tour</span><b>${S.budget}${S.famine ? ` (Famine −${S.famine})` : ""}</b></div>
      <div class="kv"><span>Réserve (non investie)</span><b>${S.reserve}</b></div>
      <div class="kv"><span>Pioches N1 / N2 / N3</span><b>${S.piles[1].length} / ${S.piles[2].length} / ${S.piles[3].length}</b></div>
      <h4>Main</h4>${hand}<h4>Arbres d'amélioration</h4>${trees}`;
  }
  function logPanel() {
    return `<h4>Journal</h4><ol class="log">${S.log.slice(0, 40).map(l => `<li class="${l.who}"><span>M${l.r}</span>${E(l.msg)}</li>`).join("")}</ol>`;
  }
  function help() {
    return `<div class="modal" role="dialog" aria-label="Règles"><div class="modal-card"><button data-a="help" class="x close" aria-label="Fermer">×</button>
      <h2>Règles en bref</h2>
      <p><b>But.</b> La colonie gagne quand le 12ᵉ étage de la fusée est achevé. L'essaim gagne quand la colonie n'a plus de travailleurs.</p>
      <p><b>Essaim.</b> Budget = biomasse. Piochez selon le palier (3 · 4 · 7 · 10 · 13 de biomasse), déployez sur une case d'entrée en respectant le plafond par lane (1 / 2 / 3 / 4 / 5 selon le palier), ou investissez dans un nœud d'amélioration (rang 1 : 8, rang 2 : 16, payable en plusieurs fois) ; le reste va à la réserve. Puis chaque créature se déplace case par case, sans diagonale, et attaque la première tuile ou la fusée (une attaque contre la fusée tue un seul travailleur). Les soutiens avancent aussi mais n'attaquent jamais. +1 biomasse par tuile détruite.</p>
      <p><b>Colonie.</b> Lancez une tuile par chantier libre : le chantier appartient à une lane. Quand il est achevé, posez le bâtiment sur une case de cette lane qui touche une tuile, un support ou la fusée ; les créatures présentes reculent d'une case vers le fond. Répartissez vos travailleurs : les points d'une lane avancent son chantier, le reste va à la fusée (3 points par étage, puis 4, 5 et 6 après les paliers 3, 6 et 9 ; +1 travailleur par étage ; étage 3 : +2 technologies, 6 : 2ᵉ chantier, 9 : nuke).</p>
      <p><b>Combat.</b> Seules les haies de départ (Épines 1), la Haie d'épines et le Mur hérissé (Épines 2) ont des Épines : dégâts à la créature qui les attaque (+1 si elles touchent un support de niveau 2). Renforcé X : 1 PV perdu par tranche de X dégâts. Les auras ne touchent que les créatures de la même case. Les supports tirent en fin de tour de la colonie sur une créature des 8 cases qui les entourent (I : 1 dégât, +1 aux étages 3, 6 et 9 ; II : 2) et tombent quand tous leurs murs voisins ont disparu.</p>
      <p><b>Écrans de passage.</b> En partie locale, à chaque changement de camp, passez l'appareil : chaque joueur ne voit que sa main.</p>
      <p><b>En ligne.</b> Créez une partie et donnez le code (ou le lien) à votre adversaire. Chaque joueur ne reçoit que ce que son camp a le droit de voir. Vous pouvez recharger la page : la partie reprend.</p></div></div>`;
  }

  // ---------------------------------------------------------------- actions
  // Les actions de jeu passent toutes par SF.apply (moteur) : en local directement, en ligne via le serveur.
  function play(type, args, onOk) {
    if (online()) { send(type, args, onOk); return; }
    S.fx = [];
    const refused = SF.apply(S, who(), type, args || {});
    const events = S.fx; delete S.fx;
    if (!refused && onOk) onOk();
    if (!S.winner) setPhaseHandoff();
    save();
    animate(events).then(() => { render(); afterRender(events); });
  }
  function handle(a, d) {
    if (a === "help") { UI.help = !UI.help; render(); return; }
    if (a === "anim") { animOn = !animOn; try { localStorage.setItem(ANIM_KEY, animOn ? "1" : "0"); } catch (e) { /* rien */ } render(); return; }
    if (MODE === "home" || !S) { homeAction(a, d); return; }
    if (a === "home") { if (online()) return; MODE = "home"; render(); return; }
    if (a === "quit") { if (confirmQuit()) { setNet(null); MODE = "home"; S = null; UI = resetUI(); render(); } return; }
    if (a === "new") {
      if (online()) { if (S.winner) send("rematch", {}); return; }
      if (!S || S.winner || confirmNew()) { clearSave(); newGame(); } return;
    }
    if (a === "reveal") { if (online()) return; S.view = S.handoff; S.handoff = null; save(); render(); return; }
    if (S.winner) return;
    switch (a) {
      // choix locaux (sans effet sur la partie)
      case "card": UI.sel = UI.sel === Number(d.uid) ? null : Number(d.uid); break;
      case "creature": UI.selCreature = Number(d.id); break;
      case "tile": UI.sel = UI.sel === Number(d.i) ? null : Number(d.i); break;
      case "spell": UI.spell = Number(d.i); UI.picks = []; UI.recoHand = null; break;
      case "spellCancel": UI.spell = null; UI.picks = []; UI.recoHand = null; break;
      case "pick": if (UI.picks.length < 3) UI.picks.push(d.k); break;
      case "pickHand": { const i = Number(d.i); UI.picks = UI.picks.includes(i) ? UI.picks.filter(p => p !== i) : [...UI.picks, i]; break; }
      case "recoHand": UI.recoHand = Number(d.i); break;
      case "support": UI.support = UI.support === d.k ? null : d.k; break;
      case "act": {
        const c = S.creatures.find(o => o.id === Number(d.id));
        if (!c) break;
        if (SF.hasMobility(S, c) && SF.laneTiles(S, c.lane).length > 1) { UI.mob = c.id; break; }
        return play("act", { id: c.id });
      }
      // actions de jeu
      case "famine": return play("famine", { play: d.v === "1" });
      case "draw": return play("draw");
      case "deployAt": if (UI.sel) return play("deploy", { uid: UI.sel, lane: d.l, u: Number(d.u) }, () => { UI.sel = null; }); break;
      case "endDeploy": UI.sel = null; return play("endDeploy");
      case "invest": return play("invest", { t: d.t, s: d.s, n: Number(d.n) });
      case "raid": return play("raid", { id: Number(d.id), lane: d.v });
      case "instinct": return play("instinct", { id: Number(d.id), v: d.v });
      case "instTarget": return play("instTarget", { id: Number(d.id), v: Number(d.v) });
      case "toAttacks": return play("toAttacks");
      case "reactDone": UI.spell = null; return play("reactDone");
      case "mobTarget": { const id = UI.mob; UI.mob = null; return play("act", { id, target: d.k || null }); }
      case "actAll": return play("actAll");
      case "endA": return play("endA");
      case "startCh": if (UI.sel !== null) return play("startCh", { i: UI.sel, lane: d.l }, () => { UI.sel = null; }); break;
      case "placeAt": return play("placeAt", { k: d.k });
      case "cancelCh": return play("cancelCh", { lane: d.l, i: Number(d.i) });
      case "alloc": return play("alloc", { lane: d.l, d: Number(d.d) });
      case "spellArg": {
        const name = S.spells[UI.spell];
        let arg = d.v;
        if (["Frappe orbitale", "Salve", "Brouillage"].includes(name)) arg = Number(d.v);
        if (d.v === "picks") arg = UI.picks;
        if (name === "Reconversion") arg = { hand: UI.recoHand, tile: d.v };
        if (d.v === "go") arg = null;
        const i = UI.spell;
        UI.spell = null; UI.picks = []; UI.recoHand = null;
        return play("spell", { i, arg });
      }
      case "toFire": UI.sel = null; UI.spell = null; return play("toFire");
      case "fireAt": if (UI.support) { const sk = UI.support; UI.support = null; return play("fire", { sk, id: Number(d.id) }); } break;
      case "autoFire": UI.support = null; return play("autoFire");
      case "endD": return play("endD");
    }
    if (!online() && !S.winner) setPhaseHandoff();
    if (!online()) save();
    render();
  }
  function homeAction(a, d) {
    if (a === "resume") { const t = load(); if (t && t.phase) { S = upgradeSave(t); MODE = "local"; UI = resetUI(); render(); } return; }
    if (a === "local") { MODE = "local"; clearSave(); newGame(); return; }
    if (a === "create") { createOnline(d.side); return; }
    if (a === "join") { const c = ($("#joincode").value || "").trim().toUpperCase(); if (c.length !== 5) { flash("Le code fait 5 caractères."); return; } joinOnline(c); }
  }
  function confirmQuit() { return UI.confirmQuit ? true : (UI.confirmQuit = true, setTimeout(() => { UI.confirmQuit = false; }, 4000), flash("Touchez encore « Quitter » : vous ne pourrez plus revenir dans cette partie depuis cet appareil."), false); }

  // ---------------------------------------------------------------- animations (lot 1)
  // Rejouées par-dessus le plateau encore à l'ancien état, à partir des événements du moteur (S.fx) ;
  // l'état final est affiché ensuite. Sobres et courtes ; un toucher les termine ; réglage « Animations ».
  const ANIM_KEY = "swarm-steel-anim";
  let animOn = (() => {
    try { const v = localStorage.getItem(ANIM_KEY); if (v !== null) return v === "1"; } catch (e) { /* rien */ }
    return !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  })();
  const FX = { playing: false, skip: false, ghosts: {}, speed: 1 };
  const wait = ms => new Promise(res => setTimeout(res, FX.skip ? 0 : ms * FX.speed));
  const dur = ms => (FX.skip ? 1 : ms * FX.speed);
  function layer() { let l = $("#fx"); if (!l) { l = document.createElement("div"); l.id = "fx"; document.body.appendChild(l); } return l; }
  function box(el) { const r = el.getBoundingClientRect(); return { x: r.left + scrollX, y: r.top + scrollY, w: r.width, h: r.height, cx: r.left + scrollX + r.width / 2, cy: r.top + scrollY + r.height / 2 }; }
  const cellAt = k => document.querySelector(`.board [data-xy="${k}"]`);
  const tokAt = id => FX.ghosts[id] || document.querySelector(`.board .tok[data-id="${id}"]`);
  function ghost(id) { // jeton flottant qui remplace le vrai jeton pendant qu'il se déplace
    if (FX.ghosts[id]) return FX.ghosts[id];
    const t = document.querySelector(`.board .tok[data-id="${id}"]`); if (!t) return null;
    const b = box(t), g = t.cloneNode(true);
    g.removeAttribute("data-a"); g.classList.add("ghost");
    Object.assign(g.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px" });
    layer().appendChild(g); t.style.visibility = "hidden";
    return (FX.ghosts[id] = g);
  }
  function glide(g, cx, cy, ms) {
    const nx = cx - g.offsetWidth / 2, ny = cy - g.offsetHeight / 2;
    const a = g.animate([{ left: g.style.left, top: g.style.top }, { left: nx + "px", top: ny + "px" }], { duration: dur(ms), easing: "ease-in-out", fill: "forwards" });
    g.style.left = nx + "px"; g.style.top = ny + "px";
    return a.finished.catch(() => {});
  }
  function lunge(el, toward, ms) { // petit élan vers la cible, puis retour
    if (!el || !toward) return Promise.resolve();
    const a = box(el), b = box(toward), dx = (b.cx - a.cx) * 0.3, dy = (b.cy - a.cy) * 0.3;
    return el.animate([{ transform: "translate(0,0)" }, { transform: `translate(${dx}px,${dy}px)` }, { transform: "translate(0,0)" }], { duration: dur(ms), easing: "ease-out" }).finished.catch(() => {});
  }
  function float(el, text, cls) { // chiffre qui monte et s'efface (n'attend pas)
    if (!el || FX.skip) return;
    const b = box(el), f = document.createElement("div");
    f.className = "float " + (cls || ""); f.textContent = text;
    Object.assign(f.style, { left: b.cx + "px", top: b.y + "px" });
    layer().appendChild(f);
    f.animate([{ transform: "translate(-50%, 0)", opacity: 1 }, { transform: "translate(-50%, -26px)", opacity: 0 }], { duration: 900, easing: "ease-out", fill: "forwards" }).finished.then(() => f.remove(), () => f.remove());
  }
  const shake = el => el && el.animate([{ transform: "translateX(0)" }, { transform: "translateX(-3px)" }, { transform: "translateX(3px)" }, { transform: "translateX(0)" }], { duration: dur(220) });
  const fade = el => el ? el.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.4)" }], { duration: dur(260), fill: "forwards" }).finished.catch(() => {}) : Promise.resolve();
  function flashEl(el, color) { el.animate([{ boxShadow: `0 0 0 0 ${color}` }, { boxShadow: `0 0 0 4px ${color}` }, { boxShadow: `0 0 0 0 ${color}` }], { duration: dur(420) }); }
  const flip = el => el ? el.animate([{ transform: "rotateY(0)" }, { transform: "rotateY(90deg)" }, { transform: "rotateY(0)" }], { duration: dur(320) }).finished.catch(() => {}) : Promise.resolve();
  function laneCells(lane) { // de l'entrée vers la fusée
    const out = [];
    for (let k = 4; k >= 1; k--) for (let u = -2; u <= 2; u++) { const c = cellAt(SF.toGlobal(lane, u, k).join(",")); if (c && !out.includes(c)) out.push(c); }
    return out;
  }
  function ringCells(r) { return [...document.querySelectorAll(".board .cell.lane.r" + r)]; }
  async function sweep(cells, kind, together) { // vague sobre sur des cases (lane ou couronne)
    const color = kind === "stase" ? "var(--support)" : kind === "vision" ? "var(--essaim)" : "var(--off)";
    for (const c of cells) {
      c.animate([{ boxShadow: `inset 0 0 0 0 ${color}` }, { boxShadow: `inset 0 0 0 3px ${color}` }, { boxShadow: `inset 0 0 0 0 ${color}` }], { duration: dur(380) });
      if (!together) await wait(35);
    }
    await wait(together ? 300 : 200);
  }
  async function beam(tok, n) { // trait vertical qui tombe sur la créature
    const b = box(tok);
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div"); d.className = "beam";
      Object.assign(d.style, { left: b.cx + "px", top: (b.cy - 60) + "px" });
      layer().appendChild(d);
      await d.animate([{ transform: "translate(-50%, -20px) scaleY(.2)", opacity: 0 }, { transform: "translate(-50%, 0) scaleY(1)", opacity: 1, offset: .6 }, { transform: "translate(-50%, 0) scaleY(1)", opacity: 0 }], { duration: dur(260) }).finished.catch(() => {});
      d.remove();
    }
  }
  function spellBanner(name, kind, raw) {
    const b = document.createElement("div");
    b.className = "turn-banner spell-banner " + (kind || ""); b.textContent = raw ? name : "Sortilège : " + name;
    layer().appendChild(b);
    b.animate([{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .8 }, { opacity: 0 }], { duration: FX.skip ? 1 : 1400, fill: "forwards" }).finished.then(() => b.remove(), () => b.remove());
  }
  const STEP = {
    async move(e) {
      const g = ghost(e.id); if (!g) return;
      let [u, k] = e.from;
      for (let i = 0; i < 12 && !(u === e.to[0] && k === e.to[1]); i++) {
        [u, k] = SF.nextStep(u, k);
        const c = cellAt(SF.toGlobal(e.lane, u, k).join(","));
        if (c) { const b = box(c); await glide(g, b.cx, b.cy, 130); }
      }
    },
    async hit(e) {
      const cell = cellAt(e.k), tile = cell && cell.querySelector(".tile");
      await lunge(e.id !== null ? tokAt(e.id) : null, cell, 200);
      shake(tile || cell);
      if (e.n !== null) float(tile || cell, e.n ? "−" + e.n : "0", "tile-dmg");
      const hp = tile && tile.querySelector(".hp");
      if (hp && e.hp !== null && hp.firstChild) hp.firstChild.textContent = e.hp;
      await wait(180);
    },
    async tileDown(e) {
      const cell = cellAt(e.k); if (!cell) return;
      float(cell, "+1 biomasse", "bio");
      await fade(cell.querySelector(".tile") || cell.firstElementChild);
    },
    async dmg(e) {
      const t = tokAt(e.id); if (!t) return;
      float(t, "−" + e.n, "cr-dmg");
      t.animate([{ filter: "brightness(1.9)" }, { filter: "none" }], { duration: dur(220) });
      const spans = t.querySelectorAll("span"); if (spans[1]) spans[1].textContent = e.hp;
      await wait(160);
    },
    async die(e) { await fade(tokAt(e.id)); },
    async rocket(e) {
      const core = cellAt("0,0"); if (!core) return;
      await lunge(tokAt(e.id), core, 220);
      core.animate([{ boxShadow: "0 0 0 0 var(--danger)" }, { boxShadow: "0 0 0 6px var(--danger)" }, { boxShadow: "0 0 0 0 var(--danger)" }], { duration: dur(420) });
      float(core, "−1 travailleur", "cr-dmg");
      await wait(300);
    },
    // ---- lot 2 : sortilèges, piège, chantiers, poses, supports
    async spell(e) {
      spellBanner(e.name, e.kind);
      const tok = e.id !== undefined ? tokAt(e.id) : null;
      switch (e.name) {
        case "Frappe orbitale": case "Salve": if (tok) await beam(tok, e.name === "Salve" ? 2 : 1); break;
        case "Brouillage": if (tok) { await tok.animate([{ transform: "translateX(0)" }, { transform: "translateX(-2px)" }, { transform: "translateX(2px)" }, { transform: "translateX(-2px)" }, { transform: "translateX(0)" }], { duration: dur(260) }).finished.catch(() => {}); await fade(tok); } break;
        case "Barrage": await sweep(laneCells(e.lane), "off"); break;
        case "Champ de stase": await sweep(laneCells(e.lane), "stase"); break;
        case "Onde de choc": await sweep(ringCells(e.ring), "off", true); break;
        case "Famine": { const b = document.querySelector('[data-fx="budget"]'); if (b) { flashEl(b, "var(--off)"); float(b, "−2 budget", "cr-dmg"); } await wait(300); break; }
        case "Effort": case "Cadence": { const h = document.querySelector('[data-fx="ateliers"]'); if (h) { flashEl(h, "var(--sup)"); float(h, "+2 points", "heal"); } await wait(300); break; }
        case "Renouvellement": { const h = document.querySelector('[data-fx="tilehand"]'); if (h) { flashEl(h, "var(--sup)"); float(h, "↻ " + e.n, "heal"); } await wait(300); break; }

      }
    },
    async heal(e) {

      const hp = tile && tile.querySelector(".hp");

    },
    async reveal(e) {

    async work(e) {

    },
    async rocketPts(e) { const core = cellAt("0,0"); if (core) float(core, "+" + e.n + " fusée", "heal"); await wait(200); },
    async push(e) { // créatures qui reculent pour laisser place au bâtiment

  async function animate(events) {
