<g transform="translate(48 641)" font-size="8"><rect width="60" height="3" fill="#222"/><text y="11">60 mm = 1 case</text><text x="90" y="8">Imprimer à 100 % : 1 case = 6 cm. Cartes créatures 44 × 68 mm (bande du bas de 12 mm visible), tuiles de bâtiment 50 × 50 mm.</text><text x="90" y="19">Les cartes sont orientées bande vers la fusée et s'empilent vers l'extérieur de la lane (Nord : vers le haut, Est : vers la droite…).</text><text x="90" y="30">Marge de 48 mm autour du plateau : une pile de 4 cartes sur une case d'entrée dépasse de 45 mm.</text><text x="90" y="41">Piles de démonstration : Nord C3 (3 cartes), Est (2 cartes) et entrée Sud (4 cartes).</text></g>
